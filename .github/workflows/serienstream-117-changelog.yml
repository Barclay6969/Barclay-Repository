name: Add SerienStream 1.0.17 changelog

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/serienstream-117-changelog.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP="zips/plugin.video.serienstream/plugin.video.serienstream-1.0.17.zip"
          WORK="$RUNNER_TEMP/ss117"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          unzip -q "$ZIP" -d "$WORK"
          ROOT="$(find "$WORK" -type f -name addon.xml -printf '%h\n' | head -n1)"
          cp tools/serienstream-changelog.txt "$ROOT/changelog.txt"
          ROOT="$ROOT" ZIP="$ZIP" python3 - <<'PY'
          from pathlib import Path
          import os, zipfile, xml.etree.ElementTree as ET

          root = Path(os.environ["ROOT"])
          zip_path = Path(os.environ["ZIP"])
          addon = root / "addon.xml"

          tree = ET.parse(addon)
          addon_root = tree.getroot()
          metadata = None
          for ext in addon_root.findall("extension"):
              if ext.get("point") == "xbmc.addon.metadata":
                  metadata = ext
                  break
          if metadata is None:
              raise SystemExit("metadata extension not found")

          news = metadata.find("news")
          if news is None:
              news = ET.SubElement(metadata, "news")
          news.text = (
              "1.0.17\n"
              "- Trakt-Bewertungsdialog nach Serienwiedergabe wiederhergestellt.\n"
              "- Staffel- und Episodennummer werden beim TMDb-Helper-Playback vollständig an Kodi/Trakt übergeben.\n"
              "- Fehlerhafte Staffel-Erkennung aus SerienStream-URLs korrigiert."
          )
          tree.write(addon, encoding="UTF-8", xml_declaration=True)

          if zip_path.exists():
              zip_path.unlink()
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as zf:
              for p in sorted(root.rglob("*")):
                  if p.is_file():
                      zf.write(p, Path("plugin.video.serienstream") / p.relative_to(root))

          with zipfile.ZipFile(zip_path, "r") as zf:
              names = zf.namelist()
              assert "plugin.video.serienstream/changelog.txt" in names
              addon_text = zf.read("plugin.video.serienstream/addon.xml").decode("utf-8")
              assert "<news>1.0.17" in addon_text
          PY

      - name: Rebuild repository metadata
        run: python3 tools/make_repo.py

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add zips/plugin.video.serienstream/plugin.video.serienstream-1.0.17.zip zips/addons.xml zips/addons.xml.md5 zips/repository.barclay
          git commit -m "Document SerienStream 1.0.17 Trakt rating fix" || exit 0
          git push
