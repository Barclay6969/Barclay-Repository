name: Publish xShip 2026.09.17.97

on:
  push:
    branches: [ main ]
    paths:
      - '.release-payload/xship-2026.09.17.97.ready'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build xShip 2026.09.17.97
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil
          import tempfile
          import zipfile

          repo = Path.cwd()
          old_zip = repo / 'zips/plugin.video.xship/plugin.video.xship-2026.09.16.96.zip'
          new_zip = repo / 'zips/plugin.video.xship/plugin.video.xship-2026.09.17.97.zip'
          addons_xml = repo / 'zips/addons.xml'
          md5_file = repo / 'zips/addons.xml.md5'

          if not old_zip.exists():
              raise SystemExit(f'Missing base ZIP: {old_zip}')

          release_news = (
              '2026.09.17.97\n'
              '- Provider-Healthstatus ist nur noch informativ und kann die Quellensuche nicht mehr komplett deaktivieren.\n'
              '- Netzwerk-/DNS-/HEAD-Fehler im Hintergrundcheck werden als unknown statt dead gespeichert.\n'
              '- Behebt den Fall, dass xShip ohne Scraper-Aufrufe sofort mit 0 Quellen beendet.\n\n'
          )

          with tempfile.TemporaryDirectory() as td:
              td = Path(td)
              with zipfile.ZipFile(old_zip, 'r') as zf:
                  zf.extractall(td)

              root = td / 'plugin.video.xship'
              addon = root / 'addon.xml'
              scrapers_init = root / 'scrapers/__init__.py'
              service = root / 'service.py'

              # Release metadata: keep the complete 2026.09.16.96 changelog and prepend the fix.
              text = addon.read_text(encoding='utf-8')
              text, n = text.replace('version="2026.09.16.96"', 'version="2026.09.17.97"', 1), text.count('version="2026.09.16.96"')
              if n < 1:
                  raise SystemExit('Base version not found in addon.xml')
              marker = '<news>2026.09.16.96'
              if marker not in text:
                  raise SystemExit('2026.09.16.96 news marker not found in addon.xml')
              text = text.replace(marker, '<news>' + release_news + '2026.09.16.96', 1)
              addon.write_text(text, encoding='utf-8', newline='\n')

              # Confirmed fix: provider health is informative only. Only the explicit provider toggle can disable a scraper.
              text = scrapers_init.read_text(encoding='utf-8')
              old = "        if __addon__.getSetting('provider.' + module_name) == 'false' or __addon__.getSetting('provider.' + module_name + '.health') != 'ok':\n            return False\n        return True\n"
              new = "        # Der Health-Status ist nur informativ. Ein temporaerer Timeout, ein\n        # blockierter HEAD-Request oder ein Camping-/ISP-Netz darf einen\n        # Provider nicht dauerhaft aus der Quellensuche entfernen.\n        if __addon__.getSetting('provider.' + module_name) == 'false':\n            return False\n        return True\n    return True\n"
              if old not in text:
                  raise SystemExit('Provider health gate pattern not found')
              text = text.replace(old, new, 1)
              scrapers_init.write_text(text, encoding='utf-8', newline='\n')

              # Transient HTTP/network failures are unknown, not proof that a provider is dead.
              text = service.read_text(encoding='utf-8')
              old = "                else:\n                    health_status = 'dead'\n        except:\n            health_status = 'dead'\n"
              new = "                else:\n                    # HEAD wird von manchen Seiten/Netzen nicht sauber unterstuetzt.\n                    # Unklare Antworten duerfen keinen Provider als dauerhaft tot markieren.\n                    health_status = 'unknown'\n        except:\n            # Netzwerk-/DNS-/Timeoutfehler sind transient und kein Beweis, dass\n            # der Provider nicht funktioniert.\n            health_status = 'unknown'\n"
              if old not in text:
                  raise SystemExit('Service health pattern not found')
              text = text.replace(old, new, 1)
              service.write_text(text, encoding='utf-8', newline='\n')

              # Remove stale bytecode so Kodi compiles the patched Python sources.
              for cache in list(root.rglob('__pycache__')):
                  shutil.rmtree(cache, ignore_errors=True)
              for pyc in root.rglob('*.pyc'):
                  try:
                      pyc.unlink()
                  except FileNotFoundError:
                      pass

              # Syntax check of the two changed Python files.
              compile(scrapers_init.read_text(encoding='utf-8'), str(scrapers_init), 'exec')
              compile(service.read_text(encoding='utf-8'), str(service), 'exec')

              if new_zip.exists():
                  new_zip.unlink()
              with zipfile.ZipFile(new_zip, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
                  for p in sorted(root.rglob('*')):
                      if p.is_file():
                          zf.write(p, p.relative_to(td).as_posix())

          # Repository metadata: preserve the full current changelog and prepend 2026.09.17.97.
          text = addons_xml.read_text(encoding='utf-8')
          if 'id="plugin.video.xship" version="2026.09.16.96"' not in text:
              raise SystemExit('Current xShip version not found in zips/addons.xml')
          text = text.replace('id="plugin.video.xship" version="2026.09.16.96"', 'id="plugin.video.xship" version="2026.09.17.97"', 1)
          marker = '<news>2026.09.16.96'
          if marker not in text:
              raise SystemExit('Current xShip news marker not found in zips/addons.xml')
          text = text.replace(marker, '<news>' + release_news + '2026.09.16.96', 1)
          addons_xml.write_text(text, encoding='utf-8', newline='\n')
          md5_file.write_text(hashlib.md5(addons_xml.read_bytes()).hexdigest() + '\n', encoding='ascii')

          # Final package checks.
          with zipfile.ZipFile(new_zip, 'r') as zf:
              zf.testzip()
              built_addon = zf.read('plugin.video.xship/addon.xml').decode('utf-8')
              built_scrapers = zf.read('plugin.video.xship/scrapers/__init__.py').decode('utf-8')
              if 'version="2026.09.17.97"' not in built_addon:
                  raise SystemExit('Built ZIP has wrong addon version')
              if ".health') != 'ok'" in built_scrapers:
                  raise SystemExit('Provider health gate still present in built ZIP')
          print('Built:', new_zip)
          print('ZIP MD5:', hashlib.md5(new_zip.read_bytes()).hexdigest())
          print('addons.xml MD5:', hashlib.md5(addons_xml.read_bytes()).hexdigest())
          PY

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .release-payload/xship-2026.09.17.97.ready
          git rm -f .github/workflows/publish-xship-2026.09.17.97.yml
          git add zips/plugin.video.xship/plugin.video.xship-2026.09.17.97.zip zips/addons.xml zips/addons.xml.md5
          git commit -m "Publish xShip 2026.09.17.97 provider health fix"
          git push
