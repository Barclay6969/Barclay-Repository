name: Publish FilmPalast 0.6.7 TMDb Native
on:
  push:
    branches:
      - main
      - staging/filmpalast-tmdb-native-1.3.1
    paths:
      - 'addons/plugin.video.filmpalast.ex/**'
      - '.github/workflows/publish-filmpalast-tmdb-native.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and build FilmPalast ZIP
        run: |
          python3 - <<'PY'
          import ast,hashlib,pathlib,zipfile,xml.etree.ElementTree as ET
          folder=pathlib.Path('addons/plugin.video.filmpalast.ex')
          root=ET.parse(folder/'addon.xml').getroot()
          assert root.attrib['id']=='plugin.video.filmpalast.ex'
          assert root.attrib['version']=='0.6.7'
          settings=ET.parse(folder/'resources/settings.xml')
          assert len(settings.findall(".//setting[@id='tmdbNativeInfo']"))==1
          for name in ('default.py','tmdb_native.py'):
              ast.parse((folder/name).read_text(encoding='utf-8'))
          script=(folder/'default.py').read_text(encoding='utf-8')
          assert "from tmdb_native import open_tmdb_info" in script
          assert "isFolder=(mode == 30)" in script
          assert "play_resolved_video(selected['stream'], already_resolved=True)" in script
          bridge=(folder/'tmdb_native.py').read_text(encoding='utf-8')
          assert "item.setPath(playback_url(" in bridge
          assert "xbmcgui.Dialog().info(item)" in bridge
          assert 'filmpalast.tmdb.native.play_scope' not in bridge
          out=pathlib.Path('zips/plugin.video.filmpalast.ex/plugin.video.filmpalast.ex-0.6.7.zip')
          out.parent.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as archive:
              for file in folder.rglob('*'):
                  if file.is_file() and '__pycache__' not in file.parts and not file.name.endswith('.pyc'):
                      archive.write(file,'plugin.video.filmpalast.ex/'+str(file.relative_to(folder)))
          with zipfile.ZipFile(out) as archive:
              assert archive.testzip() is None
              assert ET.fromstring(archive.read('plugin.video.filmpalast.ex/addon.xml')).attrib['version']=='0.6.7'
              assert archive.read('plugin.video.filmpalast.ex/default.py')==(folder/'default.py').read_bytes()
          (out.parent/'changelog.txt').write_bytes((folder/'changelog.txt').read_bytes())
          print('Verified ZIP',out,'size',out.stat().st_size,'sha256',hashlib.sha256(out.read_bytes()).hexdigest())
          PY
      - name: Rebuild Kodi repository index
        run: |
          python3 tools/make_repo.py
          python3 - <<'PY'
          import hashlib,pathlib,xml.etree.ElementTree as ET
          z=pathlib.Path('zips/addons.xml')
          assert hashlib.md5(z.read_bytes()).hexdigest()==pathlib.Path('zips/addons.xml.md5').read_text().strip()
          root=ET.fromstring(z.read_bytes())
          versions={addon.get('id'):addon.get('version') for addon in root}
          assert versions['plugin.video.filmpalast.ex']=='0.6.7'
          assert versions['plugin.video.xship'] in ('2026.10.13.157','2026.10.13.156')
          print('Repository index validated', versions['plugin.video.filmpalast.ex'])
          PY
      - name: Commit Kodi package and index to current branch
        run: |
          git config user.name 'Barclay Repo Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add zips/plugin.video.filmpalast.ex/plugin.video.filmpalast.ex-0.6.7.zip zips/plugin.video.filmpalast.ex/changelog.txt zips/addons.xml zips/addons.xml.md5 zips/repository.barclay
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Package FilmPalast 0.6.7 TMDb Native [skip ci]'
          git push
