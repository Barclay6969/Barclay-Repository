name: Extract series scrapers

on:
  push:
    branches: [ main ]
    paths:
      - '.extract-series-scrapers'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract relevant scrapers from TEST3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/series-audit-current
          mkdir -p tools/series-audit-current
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          zpath=Path('test-builds/plugin.video.xship-2026.09.18.98.3-MEINECLOUD-TEST3.zip')
          wanted={
            'bsto.py','burningseries.py','fhdfilme.py','hdfilme.py','huhu.py',
            'kinoking.py','kkiste.py','megakino.py','meinecloud.py','moflix.py',
            'movie2k.py','movie2k2.py','movie4k.py','nox.py','serienfans.py',
            'serienstream.py','streamcloud.py','streamcloudforum.py','topstreamfilm.py',
            'vavoo.py','vixstream.py','filmpalast.py'
          }
          out=Path('tools/series-audit-current')
          with zipfile.ZipFile(zpath) as z:
              found=[]
              for name in z.namelist():
                  if '/scrapers/scrapers_source/de/' not in name or not name.endswith('.py'):
                      continue
                  base=Path(name).name
                  if base in wanted:
                      (out/base).write_bytes(z.read(name))
                      found.append(base)
              (out/'_inventory.txt').write_text('\n'.join(sorted(found))+'\n',encoding='utf-8')
          PY
      - name: Commit extracted sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .extract-series-scrapers
          git rm -f .github/workflows/extract-series-scrapers.yml
          git add tools/series-audit-current
          git commit -m "Extract TEST3 series scrapers for audit"
          git push
