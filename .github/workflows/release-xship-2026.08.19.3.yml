name: Release xShip 2026.08.19.3

on:
  pull_request:
    branches: [main]
    paths:
      - '.release-xship-2026.08.19.3'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Promote verified local test to 2026.08.19.3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NEWS_B64: ''
          CHANGELOG_B64: ''
        run: |
          set -euo pipefail

          # Download the exact successful 08.19.3 local-test artifact.
          gh api repos/${{ github.repository }}/actions/artifacts/9371305642/zip > "$RUNNER_TEMP/test-artifact.zip"
          mkdir -p "$RUNNER_TEMP/artifact"
          unzip -q "$RUNNER_TEMP/test-artifact.zip" -d "$RUNNER_TEMP/artifact"
          TESTZIP="$RUNNER_TEMP/artifact/plugin.video.xship-2026.08.19.3-LOCAL-TEST.zip"
          test -f "$TESTZIP"

          EXPECTED_TEST_SHA='d4a67c20d3603b19f81a990c5a4fa63e8c3e3c0bf4e92428229c9f3f3ca2db85'
          ACTUAL_TEST_SHA="$(sha256sum "$TESTZIP" | awk '{print $1}')"
          echo "Verified local-test SHA256: $ACTUAL_TEST_SHA"
          test "$ACTUAL_TEST_SHA" = "$EXPECTED_TEST_SHA"

          WORK="$RUNNER_TEMP/xship-release"
          ORIGINAL="$RUNNER_TEMP/xship-test-original"
          rm -rf "$WORK" "$ORIGINAL"
          mkdir -p "$WORK" "$ORIGINAL"
          unzip -q "$TESTZIP" -d "$WORK"
          unzip -q "$TESTZIP" -d "$ORIGINAL"
          ROOT="$WORK/plugin.video.xship"
          ORIG="$ORIGINAL/plugin.video.xship"
          export ROOT ORIG NEWS_B64 CHANGELOG_B64

          # Only release metadata changes after the confirmed local test:
          # addon.xml news and changelog.txt. Code stays byte-for-byte identical.
          python3 - <<'PY'
          from pathlib import Path
          import os, re, base64, xml.etree.ElementTree as ET
          root = Path(os.environ['ROOT'])
          news = base64.b64decode(os.environ['NEWS_B64']).decode('utf-8')
          changelog = base64.b64decode(os.environ['CHANGELOG_B64']).decode('utf-8')

          addon = root / 'addon.xml'
          s = addon.read_text(encoding='utf-8')
          s, n = re.subn(r'<news>.*?</news>', '<news>' + news + '</news>', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('addon.xml news block not found')
          addon.write_text(s, encoding='utf-8', newline='\n')
          ET.parse(addon)

          (root / 'changelog.txt').write_text(changelog, encoding='utf-8', newline='\n')
          PY

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          a = Path(os.environ['ORIG'])
          b = Path(os.environ['ROOT'])
          def hashes(root):
              out = {}
              for p in root.rglob('*'):
                  if p.is_file():
                      out[str(p.relative_to(root))] = hashlib.sha256(p.read_bytes()).hexdigest()
              return out
          ha, hb = hashes(a), hashes(b)
          changed = sorted(k for k in set(ha) | set(hb) if ha.get(k) != hb.get(k))
          print('Changed since successful local test:', changed)
          if changed != ['addon.xml', 'changelog.txt']:
              raise SystemExit('Unexpected post-test code/content changes: %r' % changed)

          vix = b / 'scrapers/scrapers_source/de/vixstream.py'
          vix_sha = hashlib.sha256(vix.read_bytes()).hexdigest()
          expected_vix = '36e2e9110e7774c967c95ec52185f8ee1f3c6b5bff8e5b7e9290a414c76200a2'
          print('Vixstream SHA256:', vix_sha)
          if vix_sha != expected_vix:
              raise SystemExit('Vixstream differs from tested resolver')
          PY

          OUT='zips/plugin.video.xship/plugin.video.xship-2026.08.19.3.zip'
          rm -f "$OUT"
          (cd "$WORK" && zip -qr "$GITHUB_WORKSPACE/$OUT" plugin.video.xship)
          unzip -t "$OUT" >/dev/null

          # Update repository metadata while preserving all unrelated entries.
          python3 - <<'PY'
          from pathlib import Path
          import os, re, base64
          from xml.sax.saxutils import escape

          p = Path('zips/addons.xml')
          s = p.read_text(encoding='utf-8')
          start = s.find('<addon id="plugin.video.xship"')
          if start < 0:
              raise SystemExit('xShip addon block not found in addons.xml')
          end = s.find('</addon>', start)
          if end < 0:
              raise SystemExit('xShip addon block end not found')
          end += len('</addon>')
          block = s[start:end]

          block, n = re.subn(
              r'(<addon id="plugin\.video\.xship" version=")[^"]+(")',
              r'\g<1>2026.08.19.3\2',
              block,
              count=1,
          )
          if n != 1:
              raise SystemExit('xShip repository version not updated')

          news = base64.b64decode(os.environ['NEWS_B64']).decode('utf-8')
          block, n = re.subn(
              r'<news>.*?</news>',
              '<news>' + escape(news) + '</news>',
              block,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('xShip repository news not updated')

          p.write_text(s[:start] + block + s[end:], encoding='utf-8', newline='\n')
          PY

          printf '%s\n' "$(md5sum zips/addons.xml | awk '{print $1}')" > zips/addons.xml.md5

          # Final release assertions, including yesterday's Filmo/BYSE changelog.
          python3 - <<'PY'
          import zipfile
          p='zips/plugin.video.xship/plugin.video.xship-2026.08.19.3.zip'
          with zipfile.ZipFile(p) as z:
              addon=z.read('plugin.video.xship/addon.xml').decode('utf-8')
              changelog=z.read('plugin.video.xship/changelog.txt').decode('utf-8')
              assert 'version="2026.08.19.3"' in addon
              assert '2026.08.18.1' in addon
              assert 'Filmo: BYSE als neue Stream-Quelle hinzugefügt' in addon
              assert '2026.08.18.1' in changelog
              assert 'Filmo: BYSE als neue Stream-Quelle hinzugefügt' in changelog
          PY

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: xship-2026.08.19.3-release-candidate
          path: zips/plugin.video.xship/plugin.video.xship-2026.08.19.3.zip
          retention-days: 3

      - name: Commit release to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .release-xship-2026.08.19.3
          git add zips/plugin.video.xship/plugin.video.xship-2026.08.19.3.zip zips/addons.xml zips/addons.xml.md5
          git commit -m 'Release xShip 2026.08.19.3'
          git push origin HEAD:${{ github.head_ref }}
