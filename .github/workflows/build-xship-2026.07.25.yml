name: Build xShip 2026.07.25

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-xship-2026.07.25.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build official xShip 2026.07.25
        shell: bash
        run: |
          set -euo pipefail
          BASE='zips/plugin.video.xship/plugin.video.xship-2026.07.22.zip'
          OUT='zips/plugin.video.xship/plugin.video.xship-2026.07.25.zip'
          WORK="$RUNNER_TEMP/xship025"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          unzip -q "$BASE" -d "$WORK"
          ROOT="$WORK/plugin.video.xship"
          export ROOT

          echo '' | base64 -d > "$RUNNER_TEMP/patch_025.py"
          python3 "$RUNNER_TEMP/patch_025.py"

          grep -q 'version="2026.07.25"' "$ROOT/addon.xml"
          grep -q 'Playlist-URL aus Embed-ID abgeleitet' "$ROOT/scrapers/scrapers_source/de/vixstream.py"
          grep -q 'def _openStartupBusy' "$ROOT/resources/lib/player.py"
          grep -q 'Dialog.Close(busydialognocancel,true)' "$ROOT/resources/lib/player.py"
          python3 -m py_compile "$ROOT/scrapers/scrapers_source/de/vixstream.py" "$ROOT/resources/lib/sources.py" "$ROOT/resources/lib/player.py" "$ROOT/service.py"
          ROOT="$ROOT" python3 - <<'PYXML'
          import os
          import xml.etree.ElementTree as ET
          ET.parse(os.path.join(os.environ['ROOT'], 'addon.xml'))
          PYXML

          rm -f "$OUT"
          (cd "$WORK" && zip -qr "$GITHUB_WORKSPACE/$OUT" plugin.video.xship)
          unzip -t "$OUT" >/dev/null

      - name: Update repository metadata and checksum
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYMETA'
          from pathlib import Path
          import re, hashlib
          p = Path('zips/addons.xml')
          s = p.read_text(encoding='utf-8')
          s, n = re.subn(r'(<addon\s+id="plugin\.video\.xship"\s+version=")2026\.07\.22(")', r'\g<1>2026.07.25\2', s, count=1)
          if n != 1:
              raise SystemExit('xShip 2026.07.22 metadata entry not found')
          p.write_text(s, encoding='utf-8', newline='\n')
          md5 = hashlib.md5(p.read_bytes()).hexdigest()
          Path('zips/addons.xml.md5').write_text(md5 + '\n', encoding='ascii')
          print('addons.xml md5:', md5)
          PYMETA

      - name: Commit xShip 2026.07.25
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zips/plugin.video.xship/plugin.video.xship-2026.07.25.zip zips/addons.xml zips/addons.xml.md5
          git diff --cached --quiet && exit 0
          git commit -m 'Release xShip 2026.07.25 Vixstream and playback busy fixes'
          git push
