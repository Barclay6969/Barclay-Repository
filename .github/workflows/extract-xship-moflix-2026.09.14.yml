name: Extract xShip resolver sources 2026.08.31.2

on:
  push:
    branches: [moflix-test-20260914]
    paths:
      - '.github/workflows/extract-xship-moflix-2026.09.14.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moflix-test-20260914
      - name: Extract scraper and resolver sources
        shell: bash
        run: |
          set -euo pipefail
          BASE='zips/plugin.video.xship/plugin.video.xship-2026.08.31.2.zip'
          WORK="$RUNNER_TEMP/xship-extract"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          unzip -q "$BASE" -d "$WORK"
          ROOT="$WORK/plugin.video.xship"
          SRC="$ROOT/scrapers/scrapers_source/de"
          test -d "$SRC"
          rm -rf tools/extracted/xship-2026.08.31.2-scrapers
          mkdir -p tools/extracted/xship-2026.08.31.2-scrapers
          cp -a "$SRC/." tools/extracted/xship-2026.08.31.2-scrapers/
          cp "$SRC/moflix.py" tools/extracted/xship-2026.08.31.2-moflix.py
          mkdir -p tools/extracted/xship-2026.08.31.2-resolver
          cp "$ROOT/resources/lib/utils.py" tools/extracted/xship-2026.08.31.2-resolver/utils.py
          if [ -f "$ROOT/resources/lib/hoster_compat.py" ]; then cp "$ROOT/resources/lib/hoster_compat.py" tools/extracted/xship-2026.08.31.2-resolver/hoster_compat.py; fi
          grep -R -l -E 'HostedMediaFile|def resolveUrl|hoster_compat|isBlockedHoster' "$ROOT/resources/lib" "$ROOT/scrapers" | sed "s#^$ROOT/##" | sort > tools/extracted/xship-2026.08.31.2-resolver/paths.txt || true
          python3 -m py_compile tools/extracted/xship-2026.08.31.2-moflix.py tools/extracted/xship-2026.08.31.2-resolver/utils.py
      - name: Commit extracted sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/extracted/xship-2026.08.31.2-moflix.py tools/extracted/xship-2026.08.31.2-scrapers tools/extracted/xship-2026.08.31.2-resolver
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Extract xShip resolver sources for MoFlix test'
          git push origin HEAD:moflix-test-20260914
