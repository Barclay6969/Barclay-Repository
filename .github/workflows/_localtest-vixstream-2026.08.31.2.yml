name: PUBLISH xShip 2026.08.31.2 repository metadata

on:
  push:
    branches: [localtest-vixstream-20260831-build]
    paths:
      - '.github/workflows/_localtest-vixstream-2026.08.31.2.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Update addons.xml and md5
        shell: bash
        run: |
          set -euo pipefail
          test -f 'zips/plugin.video.xship/plugin.video.xship-2026.08.31.2.zip'

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, xml.etree.ElementTree as ET

          feed_path = Path('zips/addons.xml')
          md5_path = Path('zips/addons.xml.md5')
          feed = feed_path.read_text(encoding='utf-8')

          feed, count = re.subn(
              r'(<addon id="plugin\.video\.xship" version=")[^"]+(" name="xShip" provider-name="Kusi \(Barclay\)">)',
              r'\g<1>2026.08.31.2\2',
              feed,
              count=1,
          )
          if count != 1:
              raise SystemExit('Unable to update xShip version')

          start = feed.find('<addon id="plugin.video.xship"')
          end = feed.find('</addon>', start)
          if start < 0 or end < 0:
              raise SystemExit('xShip block missing')
          end += len('</addon>')
          block = feed[start:end]

          entry = (
              '2026.08.31.2\n'
              '- LOCAL TEST: VixCloud/VixSrc-Playlist wird nach erfolgreicher eigener Aufloesung nicht erneut durch ResolveURL verworfen.\n\n'
          )
          if '2026.08.31.2\n' not in block:
              block, count = re.subn(r'<news>', '<news>' + entry, block, count=1)
              if count != 1:
                  raise SystemExit('Unable to prepend xShip news')
          feed = feed[:start] + block + feed[end:]

          ET.fromstring(feed.encode('utf-8'))
          feed_path.write_text(feed, encoding='utf-8', newline='')
          md5 = hashlib.md5(feed_path.read_bytes()).hexdigest()
          md5_path.write_text(md5 + '\n', encoding='ascii')
          print('ADDONS_XML_MD5=' + md5)
          PY

          git config user.name 'Barclay'
          git config user.email '107470010+Barclay6969@users.noreply.github.com'
          git add zips/addons.xml zips/addons.xml.md5
          git commit -m 'Publish xShip 2026.08.31.2 VixStream fix'
          git push origin HEAD:main
