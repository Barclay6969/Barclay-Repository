name: Build xShip MeineCloud DropLoad Headers TEST6

on:
  push:
    branches: [ main ]
    paths:
      - '.test-build/meinecloud-test6.trigger'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build TEST6
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/build_meinecloud_test6.py
          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add test-builds/plugin.video.xship-2026.09.28.110-MEINECLOUD-DROPLOAD-HEADERS-TEST6.zip
          git commit -m "Build MeineCloud DropLoad headers TEST6"
          git push
