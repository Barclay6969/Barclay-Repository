name: Build xShip 2026.08.19.3 local test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.localtest-xship-2026.08.19.3'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build exact local test from current 2026.08.19 release
        shell: bash
        run: |
          set -euo pipefail
          BASE='zips/plugin.video.xship/plugin.video.xship-2026.08.19.zip'
          WORK="$RUNNER_TEMP/xship-08193"
          ORIGINAL="$RUNNER_TEMP/xship-08193-original"
          rm -rf "$WORK" "$ORIGINAL"
          mkdir -p "$WORK" "$ORIGINAL"
          unzip -q "$BASE" -d "$WORK"
          unzip -q "$BASE" -d "$ORIGINAL"
          ROOT="$WORK/plugin.video.xship"
          ORIG="$ORIGINAL/plugin.video.xship"
          export ROOT ORIG

          cp tools/vixstream_2026_08_19_2_test.py "$ROOT/scrapers/scrapers_source/de/vixstream.py"

          python3 - <<'PY'
          from pathlib import Path
          import os, re
          root = Path(os.environ['ROOT'])
          p = root / 'addon.xml'
          s = p.read_text(encoding='utf-8')
          s, n = re.subn(r'(<addon\s+id="plugin\.video\.xship"\s+version=")[^"]+("\s+name="xShip")', r'\g<1>2026.08.19.3\2', s, count=1)
          if n != 1:
              raise SystemExit('addon version not found')
          p.write_text(s, encoding='utf-8', newline='\n')

          vix = root / 'scrapers' / 'scrapers_source' / 'de' / 'vixstream.py'
          compile(vix.read_text(encoding='utf-8'), str(vix), 'exec')
          PY

          grep -q 'version="2026.08.19.3"' "$ROOT/addon.xml"
          grep -q "VIXCLOUD = 'vixsrc.to'" "$ROOT/scrapers/scrapers_source/de/vixstream.py"
          grep -q 'TV-derived fallback' "$ROOT/scrapers/scrapers_source/de/vixstream.py"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          a = Path(os.environ['ORIG'])
          b = Path(os.environ['ROOT'])
          def hashes(root):
              out = {}
              for p in root.rglob('*'):
                  if p.is_file():
                      out[str(p.relative_to(root))] = hashlib.sha256(p.read_bytes()).hexdigest()
              return out
          ha, hb = hashes(a), hashes(b)
          changed = sorted(k for k in set(ha) | set(hb) if ha.get(k) != hb.get(k))
          print('Changed files:', changed)
          allowed = ['addon.xml', 'scrapers/scrapers_source/de/vixstream.py']
          if changed != allowed:
              raise SystemExit('Unexpected changed files: %r' % changed)
          PY

          OUT="$GITHUB_WORKSPACE/plugin.video.xship-2026.08.19.3-LOCAL-TEST.zip"
          (cd "$WORK" && zip -qr "$OUT" plugin.video.xship)
          unzip -t "$OUT" >/dev/null

      - name: Upload local test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: xship-2026.08.19.3-local-test
          path: plugin.video.xship-2026.08.19.3-LOCAL-TEST.zip
          if-no-files-found: error
          retention-days: 3
