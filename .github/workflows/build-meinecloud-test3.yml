name: Build MeineCloud TEST3

on:
  push:
    branches: [ main ]
    paths:
      - '.build-meinecloud-test3'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build TEST3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil, tempfile, zipfile

          repo = Path.cwd()
          base_zip = repo / 'test-builds/plugin.video.xship-2026.09.18.98.2-KINOKISTE-TEST2.zip'
          out_zip = repo / 'test-builds/plugin.video.xship-2026.09.18.98.3-MEINECLOUD-TEST3.zip'
          source = repo / 'tools/meinecloud-shared-test3.py'

          compile(source.read_text(encoding='utf-8'), str(source), 'exec')

          with tempfile.TemporaryDirectory() as td:
              td = Path(td)
              with zipfile.ZipFile(base_zip, 'r') as zf:
                  zf.extractall(td)

              root = td / 'plugin.video.xship'
              target = root / 'scrapers/modules/meinecloud_shared.py'
              shutil.copyfile(source, target)

              addon = root / 'addon.xml'
              text = addon.read_text(encoding='utf-8')
              if 'version="2026.09.18.98.2"' not in text:
                  raise SystemExit('TEST2 base version not found')
              text = text.replace('version="2026.09.18.98.2"', 'version="2026.09.18.98.3"', 1)
              addon.write_text(text, encoding='utf-8', newline='\n')

              for cache in list(root.rglob('__pycache__')):
                  shutil.rmtree(cache, ignore_errors=True)
              for pyc in root.rglob('*.pyc'):
                  try:
                      pyc.unlink()
                  except FileNotFoundError:
                      pass

              if out_zip.exists():
                  out_zip.unlink()
              with zipfile.ZipFile(out_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
                  for p in sorted(root.rglob('*')):
                      if p.is_file():
                          zf.write(p, p.relative_to(td).as_posix())

          with zipfile.ZipFile(out_zip, 'r') as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f'Corrupt ZIP member: {bad}')
              addon = zf.read('plugin.video.xship/addon.xml').decode('utf-8')
              if 'version="2026.09.18.98.3"' not in addon:
                  raise SystemExit('Wrong TEST3 version')
              data = zf.read('plugin.video.xship/scrapers/modules/meinecloud_shared.py').decode('utf-8')
              compile(data, 'meinecloud_shared.py', 'exec')
              if '_decode_link_value' not in data:
                  raise SystemExit('Base64 decoder missing')

          print('BUILT', out_zip)
          PY

      - name: Commit TEST3 and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .build-meinecloud-test3
          git rm -f .github/workflows/build-meinecloud-test3.yml
          git rm -f tools/meinecloud-shared-test3.py
          git rm -f test-builds/meinecloud-reacher-diagnostic.txt
          git rm -f test-builds/meinecloud-player-diagnostic.txt
          git add test-builds/plugin.video.xship-2026.09.18.98.3-MEINECLOUD-TEST3.zip
          git commit -m "Build MeineCloud Base64 TEST3"
          git push
