name: Build xShip MoFlix Movie4K speedtest

on:
  push:
    branches: [ main ]
    paths:
      - '.build-xship-speedtest-2026.09.27'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build speedtest ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil, tempfile, zipfile

          repo = Path.cwd()
          base_zip = repo / 'zips/plugin.video.xship/plugin.video.xship-2026.09.24.103.zip'
          out_zip = repo / 'test-builds/plugin.video.xship-2026.09.24.103-SPEEDTEST-MOFLIX-MOVIE4K.zip'

          if not base_zip.exists():
              raise SystemExit('Base ZIP fehlt: %s' % base_zip)

          with tempfile.TemporaryDirectory() as td_raw:
              td = Path(td_raw)
              with zipfile.ZipFile(base_zip, 'r') as zf:
                  zf.extractall(td)

              root = td / 'plugin.video.xship'
              moflix = root / 'scrapers/scrapers_source/de/moflix.py'
              movie4k = root / 'scrapers/scrapers_source/de/movie4k.py'

              # MoFlix: bekannte gueltige Hoster nicht mehr schon waehrend
              # des Scrapes vollstaendig resolven. Resolve erfolgt erst bei
              # Auswahl der Quelle. Unbekannte/Problem-Hoster bleiben auf
              # dem bisherigen strengen Pfad.
              text = moflix.read_text(encoding='utf-8')
              old = """            started = time.time()
            is_blocked, hoster, resolved_url, prio_hoster = isBlockedHoster(original_url)
            try:
                log_utils.log('[MOFLIX-HOST-TIMING] %s | %.2fs | blocked=%s | resolver=%s' % (
                    original_host or original_url,
                    time.time() - started,
                    str(is_blocked),
                    str(hoster)
                ), log_utils.LOGINFO)
            except Exception:
                pass

            if is_blocked or not resolved_url:
                continue
"""
              new = """            # These hosters are known to be valid MoFlix mirrors, but a
            # full ResolveURL pass can take many seconds. Keep them as normal
            # non-direct sources and resolve only when the user selects one.
            deferred_hosts = {
                'moflix-stream.click',
                'vidara.to',
                'veev.to',
                'streamtape.com',
                'playmate.to',
                'anonstream.co',
                'vids.st',
                'firestream.site',
            }
            defer_resolve = original_host in deferred_hosts

            started = time.time()
            if defer_resolve:
                is_blocked, hoster, resolved_url, prio_hoster = isBlockedHoster(
                    original_url, isResolve=False
                )
            else:
                is_blocked, hoster, resolved_url, prio_hoster = isBlockedHoster(original_url)
            try:
                log_utils.log('[MOFLIX-HOST-TIMING] %s | %.2fs | blocked=%s | resolver=%s | deferred=%s' % (
                    original_host or original_url,
                    time.time() - started,
                    str(is_blocked),
                    str(hoster),
                    str(defer_resolve)
                ), log_utils.LOGINFO)
            except Exception:
                pass

            if is_blocked or not resolved_url:
                continue
            if defer_resolve:
                log_utils.log('[MOFLIX-FAST] resolver deferred to playback: %s' % original_host, log_utils.LOGINFO)
"""
              if text.count(old) != 1:
                  raise SystemExit('MoFlix target block not found exactly once')
              text = text.replace(old, new, 1)
              old_direct = """                'direct': True,
                'priority': int(self.priority),
"""
              new_direct = """                'direct': False if defer_resolve else True,
                'priority': int(self.priority),
"""
              if text.count(old_direct) != 1:
                  raise SystemExit('MoFlix direct flag block not found exactly once')
              text = text.replace(old_direct, new_direct, 1)
              moflix.write_text(text, encoding='utf-8', newline='\n')

              # Movie4K: the old /data/search endpoint currently returns 404
              # and may consume ~10s per language. Prefer the working browse
              # endpoint; only fall back to legacy search if browse itself is
              # structurally unavailable, not merely when it has 0 matches.
              text = movie4k.read_text(encoding='utf-8')
              old = """                    search_url = self.search_link % (lang, quote_plus(title))
                    data = self._request_json(search_url, self.base_link + '/browse?keyword=%s' % quote_plus(title))
                    if isinstance(data, list):
                        items = data
                    else:
                        media_type = 'tvseries' if int(season or 0) > 0 else 'movies'
                        year_param = '' if int(season or 0) > 0 else str(year or '')
                        browse = self._request_json(
                            self.browse_link % (lang, quote_plus(title), year_param, media_type),
                            self.base_link + '/browse?keyword=%s' % quote_plus(title)
                        )
                        items = browse.get('movies', []) if isinstance(browse, dict) else []

                    matches = [item for item in items if self._matches_result(item, clean_titles, year, season)]
"""
              new = """                    media_type = 'tvseries' if int(season or 0) > 0 else 'movies'
                    year_param = '' if int(season or 0) > 0 else str(year or '')
                    browse = self._request_json(
                        self.browse_link % (lang, quote_plus(title), year_param, media_type),
                        self.base_link + '/browse?keyword=%s' % quote_plus(title)
                    )

                    # A successful browse response always owns the result,
                    # including an empty movies list. This avoids falling into
                    # the currently broken /data/search endpoint on 0 results.
                    if isinstance(browse, dict) and 'movies' in browse:
                        items = browse.get('movies') or []
                    else:
                        search_url = self.search_link % (lang, quote_plus(title))
                        data = self._request_json(
                            search_url,
                            self.base_link + '/browse?keyword=%s' % quote_plus(title)
                        )
                        items = data if isinstance(data, list) else []

                    matches = [item for item in items if self._matches_result(item, clean_titles, year, season)]
"""
              if text.count(old) != 1:
                  raise SystemExit('Movie4K target block not found exactly once')
              text = text.replace(old, new, 1)
              movie4k.write_text(text, encoding='utf-8', newline='\n')

              # Syntax checks before packaging.
              compile(moflix.read_text(encoding='utf-8'), str(moflix), 'exec')
              compile(movie4k.read_text(encoding='utf-8'), str(movie4k), 'exec')

              for cache in list(root.rglob('__pycache__')):
                  shutil.rmtree(cache, ignore_errors=True)
              for pyc in root.rglob('*.pyc'):
                  pyc.unlink(missing_ok=True)

              out_zip.parent.mkdir(parents=True, exist_ok=True)
              if out_zip.exists():
                  out_zip.unlink()
              with zipfile.ZipFile(out_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
                  for p in sorted(root.rglob('*')):
                      if p.is_file():
                          zf.write(p, p.relative_to(td).as_posix())

          with zipfile.ZipFile(out_zip, 'r') as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit('Corrupt ZIP member: ' + bad)
              m = zf.read('plugin.video.xship/scrapers/scrapers_source/de/moflix.py').decode('utf-8')
              k = zf.read('plugin.video.xship/scrapers/scrapers_source/de/movie4k.py').decode('utf-8')
              if 'resolver deferred to playback' not in m:
                  raise SystemExit('MoFlix speed patch missing')
              if "if isinstance(browse, dict) and 'movies' in browse:" not in k:
                  raise SystemExit('Movie4K speed patch missing')

          print('Built:', out_zip)
          print('SHA256:', hashlib.sha256(out_zip.read_bytes()).hexdigest())
          PY

          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add test-builds/plugin.video.xship-2026.09.24.103-SPEEDTEST-MOFLIX-MOVIE4K.zip
          git rm -f .build-xship-speedtest-2026.09.27
          git rm -f .github/workflows/build-xship-speedtest-2026.09.27.yml
          git commit -m "Build xShip MoFlix Movie4K speed test"
          git push
