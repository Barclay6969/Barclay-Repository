name: Build xShip MediaInfo guard test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-xship-mediainfo-guard-test.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build MediaInfo URL guard test
        shell: bash
        run: |
          set -euo pipefail
          BASE='test-builds/plugin.video.xship-2026.08.21.10.zip'
          WORK="$RUNNER_TEMP/xship-mediainfo-guard"
          ROOT="$WORK/plugin.video.xship"
          OUT='test-builds/plugin.video.xship-2026.08.25.1-MEDIAINFO-GUARD-TEST.zip'
          export ROOT

          test -f "$BASE"
          rm -rf "$WORK"
          mkdir -p "$WORK" test-builds
          unzip -q "$BASE" -d "$WORK"

          python3 - <<'PY'
          from pathlib import Path
          import os, re

          root = Path(os.environ['ROOT'])

          addon = root / 'addon.xml'
          s = addon.read_text(encoding='utf-8')
          s, n = re.subn(r'(<addon\b[^>]*\bversion=")[^"]+("[^>]*>)',
                         r'\g<1>2026.08.25.1-MEDIAINFO-GUARD-TEST\2', s, count=1)
          if n != 1:
              raise SystemExit('addon version not found')
          addon.write_text(s, encoding='utf-8', newline='\n')

          media = root / 'resources/lib/mediainfo.py'
          text = media.read_text(encoding='utf-8')

          needle = """def getMediaInfo(url, dialog, deadline=None, stream_type_hint=None):\n    \"\"\"Detect stream type and probe media info. Returns formatted info string or None.\n    stream_type_hint: 'hls'/'dash'/'mp4' — skip type detection if known (from hoster DB).\"\"\"\n    import requests\n"""

          replacement = """def getMediaInfo(url, dialog, deadline=None, stream_type_hint=None):\n    \"\"\"Detect stream type and probe media info. Returns formatted info string or None.\n    stream_type_hint: 'hls'/'dash'/'mp4' — skip type detection if known (from hoster DB).\"\"\"\n    # Step-1 guard: Background MediaInfo probing is HTTP(S)-only.\n    # Resolver sentinels (False/None/empty) and internal pseudo URLs such as\n    # vixsrc:// must stay untouched for their real playback resolver.\n    if not url or not isinstance(url, str):\n        log_utils.log('[MEDIAINFO-GUARD] Probe übersprungen: ungültige URL %r' % (url,), log_utils.LOGWARNING)\n        return None\n\n    probe_url = url.split('|', 1)[0].strip()\n    if not probe_url.lower().startswith(('http://', 'https://')):\n        log_utils.log('[MEDIAINFO-GUARD] Probe übersprungen: nicht-HTTP URL %s' % probe_url, log_utils.LOGWARNING)\n        return None\n\n    import requests\n"""

          if needle not in text:
              raise SystemExit('Expected getMediaInfo block not found; refusing unsafe patch')
          if '[MEDIAINFO-GUARD]' in text:
              raise SystemExit('MediaInfo guard already present')

          text = text.replace(needle, replacement, 1)
          media.write_text(text, encoding='utf-8', newline='\n')

          check = media.read_text(encoding='utf-8')
          for required in (
              '[MEDIAINFO-GUARD]',
              "startswith(('http://', 'https://'))",
              'if not url or not isinstance(url, str):',
          ):
              if required not in check:
                  raise SystemExit('Guard verification failed: ' + required)

          compile(check, str(media), 'exec')
          PY

          python3 -m compileall -q "$ROOT"
          grep -q 'version="2026.08.25.1-MEDIAINFO-GUARD-TEST"' "$ROOT/addon.xml"
          grep -Fq '[MEDIAINFO-GUARD]' "$ROOT/resources/lib/mediainfo.py"

          rm -f "$OUT"
          (cd "$WORK" && zip -qr "$GITHUB_WORKSPACE/$OUT" plugin.video.xship)
          unzip -t "$OUT" >/dev/null

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT"
          git diff --cached --quiet && exit 0
          git commit -m 'Add xShip MediaInfo URL guard local test'
          git push
