name: Refresh Kodi repository index

on:
  push:
    branches: [main]
    paths:
      - 'zips/plugin.video.serienstream/**'
      - 'tools/make_repo.py'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild repository index
        run: python3 tools/make_repo.py

      - name: Commit refreshed index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zips/addons.xml zips/addons.xml.md5
          if git diff --cached --quiet; then
            echo "Repository index already current."
            exit 0
          fi
          git commit -m "Refresh repository index for SerienStream 1.0.7"
          git push
