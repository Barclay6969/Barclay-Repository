name: Publish xShip 2026.09.18.99

on:
  push:
    branches: [ main ]
    paths:
      - '.publish-xship-2026.09.18.99'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct tested TEST5 and publish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib

          root = Path('.release-payload/xship-2026.09.18.99')
          p0 = (root/'patch.00.b64').read_text().strip()
          p1 = (root/'patch.01.b64').read_text().strip()
          p2 = (root/'patch.02.b64').read_text().strip()
          p3 = (root/'patch.03.b64').read_text().strip()
          p5 = (root/'patch.05.b64').read_text().strip()

          b64 = p0[:9000] + p1 + p2 + p3[:9000] + p3[9000:18000] + p5
          if len(b64) != 50296:
              raise SystemExit('Unexpected patch base64 length: %d' % len(b64))
          patch = base64.b64decode(b64)
          digest = hashlib.sha256(patch).hexdigest()
          expected = '04cd5ab161ce59279e17567804bf50eeaddb862f12afab357122eddd8174e500'
          if digest != expected:
              raise SystemExit('TEST5 patch hash mismatch: %s' % digest)
          Path('/tmp/test3_to_test5.patch').write_bytes(patch)
          print('PATCH SHA256 OK', digest)
          PY

          WORK="$RUNNER_TEMP/xship-2026.09.18.99"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          unzip -q test-builds/plugin.video.xship-2026.09.18.98.3-MEINECLOUD-TEST3.zip -d "$WORK"

          cd "$WORK"
          patch -p1 --batch --forward < /tmp/test3_to_test5.patch
          cd "$GITHUB_WORKSPACE"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, re, zipfile, shutil
          import xml.etree.ElementTree as ET

          version = '2026.09.18.99'
          work = Path(os.environ['RUNNER_TEMP']) / 'xship-2026.09.18.99'
          root = work / 'plugin.video.xship'

          expected = {
              'scrapers/scrapers_source/de/kinoking.py':'797138bd6165dddc4ec4d103e395cf7518440e0e117baeba4f6e163791cd3145',
              'scrapers/scrapers_source/de/huhu.py':'20b8da25ff1b474a60dbab4d8a40b3eae871aa1939ace455c44c6fd955d13164',
              'scrapers/scrapers_source/de/movie4k.py':'afcdb4a58a02f0977d3f4c9921d9876abf5f90d53077ef2f3c06cf025e130d4a',
              'scrapers/scrapers_source/de/hdfilme.py':'d869b6165140ec3f79f0097c5d4eb391be26d20d95ce6faa132334bd28f4c11f',
              'scrapers/scrapers_source/de/burningseries.py':'d245675b6d7a146eeb468812422c6c8515247fde047ac0fd533d4a86dbb9c445',
              'scrapers/scrapers_source/de/serienfans.py':'8bf1a1f817ca92b6bde7d665dc3587148d988a242cc16fb665bd7ec2246654a1',
              'scrapers/scrapers_source/de/nox.py':'eacbc9a9e982a2fad2ba81921bae91d6c1763ae85330280946a850bfdbb262f0',
              'resources/lib/sources.py':'8c7e26924a67b6a7fce39141857c06f2b6166bee0a95ec70f25a4fd0fd80c7ee',
          }
          for rel, wanted in expected.items():
              p = root / rel
              data = p.read_bytes()
              got = hashlib.sha256(data).hexdigest()
              if got != wanted:
                  raise SystemExit('TEST5 file hash mismatch: %s %s' % (rel, got))
              compile(data.decode('utf-8'), rel, 'exec')
          print('ALL TEST5 FILE HASHES OK')

          news = """2026.09.18.99
- KinoKiste: Serienunterstützung verbessert; Titel, Staffel und Episode werden strikt geprüft, damit keine falschen Massentreffer mehr entstehen.
- MeineCloud: neue Base64-codierte Film-Mirrors werden wieder korrekt erkannt; Serien- und Linkerkennung robuster.
- Serien-Scraper: KinoKing, Huhu, Movie4K, HDFilme, BurningSeries, SerienFans und NOX an aktuelle Seiten-/API-Strukturen sowie robustere Titel-, Staffel- und Episodensuche angepasst.
- MediaInfo: globaler 10-Sekunden-Sicherheits-Timeout verhindert Hänger durch festgefahrene ResolveURL-Prüfungen; die betroffene Quelle bleibt für die Wiedergabe erhalten.
- AniWorld und bewusst film-only geführte Provider bleiben unverändert."""

          addon = root / 'addon.xml'
          s = addon.read_text(encoding='utf-8')
          s, n = re.subn(r'(<addon\s+id="plugin\.video\.xship"\s+version=")[^"]+(")', r'\g<1>'+version+r'\2', s, count=1)
          if n != 1:
              raise SystemExit('Could not update addon version')
          if '<news>' not in s:
              raise SystemExit('Missing news tag')
          s = s.replace('<news>', '<news>' + news + '\n\n', 1)
          addon.write_text(s, encoding='utf-8', newline='\n')
          ET.fromstring(s)

          for d in list(root.rglob('__pycache__')):
              if d.is_dir():
                  shutil.rmtree(d, ignore_errors=True)
          for p in root.rglob('*.pyc'):
              p.unlink(missing_ok=True)

          out = Path('zips/plugin.video.xship') / ('plugin.video.xship-%s.zip' % version)
          out.parent.mkdir(parents=True, exist_ok=True)
          if out.exists():
              out.unlink()
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      z.write(p, (Path('plugin.video.xship') / p.relative_to(root)).as_posix())

          with zipfile.ZipFile(out, 'r') as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit('Bad ZIP member: '+bad)
              az = z.read('plugin.video.xship/addon.xml').decode('utf-8')
              if 'version="'+version+'"' not in az or '2026.09.18.99' not in az:
                  raise SystemExit('Release ZIP metadata mismatch')

          repo_xml_path = Path('zips/addons.xml')
          repo_xml = repo_xml_path.read_text(encoding='utf-8')
          addon_block = re.sub(r'^<\?xml[^>]+>\s*', '', s, count=1).strip()
          addon_block = '\n'.join('  '+line if line else line for line in addon_block.splitlines())
          pattern = r'(?ms)^  <addon id="plugin\.video\.xship"\b.*?^  </addon>\s*'
          repo_xml, n = re.subn(pattern, addon_block+'\n', repo_xml, count=1)
          if n != 1:
              raise SystemExit('Could not replace xShip block in addons.xml')
          repo_xml_path.write_text(repo_xml, encoding='utf-8', newline='\n')
          ET.fromstring(repo_xml)

          md5 = hashlib.md5(repo_xml_path.read_bytes()).hexdigest()
          Path('zips/addons.xml.md5').write_text(md5+'\n', encoding='ascii')
          print('RELEASE BUILT', out, md5)
          PY

      - name: Commit official release and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"

          git rm -f .publish-xship-2026.09.18.99 || true
          git rm -rf .release-payload/xship-2026.09.18.99 || true
          git rm -f .build-series-test4 .build-series-test4-v2 .fast-build-test4 || true
          git rm -f .inspect-final-provider-details .inspect-nox-current .probe-hdfilme-s1 || true
          git rm -f .github/workflows/build-series-test4.yml .github/workflows/build-series-test4-v2.yml .github/workflows/fast-build-test4.yml || true
          git rm -f .github/workflows/inspect-final-provider-details.yml .github/workflows/inspect-nox-current.yml .github/workflows/probe-hdfilme-s1.yml || true
          git rm -rf tools/series-fix-test4 tools/series-audit-current || true
          git rm -f .github/workflows/publish-xship-2026.09.18.99.yml || true

          git add zips/plugin.video.xship/plugin.video.xship-2026.09.18.99.zip zips/addons.xml zips/addons.xml.md5
          git add -u
          git commit -m "Publish xShip 2026.09.18.99 series and MediaInfo fixes"
          git push
