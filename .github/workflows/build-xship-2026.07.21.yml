name: Build xShip 2026.07.21

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-xship-2026.07.21.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch stable 2026.07.20
        shell: bash
        run: |
          set -euo pipefail
          BASE='zips/plugin.video.xship/plugin.video.xship-2026.07.20.zip'
          OUT='zips/plugin.video.xship/plugin.video.xship-2026.07.21.zip'
          WORK="$RUNNER_TEMP/xship021"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          unzip -q "$BASE" -d "$WORK"
          ROOT="$WORK/plugin.video.xship"
          test -f "$ROOT/addon.xml"
          test -f "$ROOT/resources/settings.xml"
          test -f "$ROOT/service.py"

          ROOT="$ROOT" python3 - <<'PY'
          import os, re, pathlib
          root = pathlib.Path(os.environ['ROOT'])

          p = root / 'addon.xml'
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'(<addon\s+id="plugin\.video\.xship"\s+version=")[^"]+("\s+name="xShip")', r'\g<1>2026.07.21\2', s, count=1)
          if 'addon="inputstream.adaptive"' not in s:
              anchor = '<import addon="script.module.resolveurl" version="5.1.100" />'
              if anchor not in s:
                  raise SystemExit('resolveurl dependency anchor not found')
              s = s.replace(anchor, anchor + '\n        <import addon="inputstream.adaptive" />', 1)
          p.write_text(s, encoding='utf-8', newline='\n')

          p = root / 'resources' / 'settings.xml'
          s = p.read_text(encoding='utf-8')
          defaults = {
              'hosts.mode': '0',
              'scrapers.timeout': '15',
              'hosts.language': '0',
              'bypassDNSlock': 'true',
              'cacheDeltaDay': '1',
              'githubUpdateResolver': 'true',
              'provider.aniworld': 'false',
              'provider.bsto': 'false',
              'provider.burningseries': 'false',
              'provider.huhu': 'false',
              'provider.kool': 'false',
              'provider.moviedream': 'false',
              'provider.netzkino': 'true',
              'progress.dialog': '0',
              'hosts.quality': '0',
              'hosts.sort': '2',
              'serienstream.user': 'Barclay69',
              'serienstream.pass': 'melanie1',
          }
          for sid, value in defaults.items():
              pat = re.compile(r'(<setting\b(?=[^>]*\bid="' + re.escape(sid) + r'")[^>]*\bdefault=")[^"]*(")')
              s2, n = pat.subn(r'\g<1>' + value + r'\2', s, count=1)
              if n == 0:
                  raise SystemExit('setting default not found: ' + sid)
              s = s2
          p.write_text(s, encoding='utf-8', newline='\n')

          p = root / 'service.py'
          s = p.read_text(encoding='utf-8')
          marker = '# BARCLAY_SETTINGS_MIGRATION_20260721'
          if marker not in s:
              migration = r'''

          # BARCLAY_SETTINGS_MIGRATION_20260721
          def _barclay_settings_migration_20260721():
              """Einmalige Zielkonfiguration fuer Updates auf 2026.07.21."""
              migration_key = 'barclay.settings.migration.20260721'
              try:
                  if getSetting(migration_key) == 'done':
                      return
                  values = {
                      'hosts.mode': '0',
                      'scrapers.timeout': '15',
                      'hosts.language': '0',
                      'bypassDNSlock': 'true',
                      'cacheDeltaDay': '1',
                      'githubUpdateResolver': 'true',
                      'provider.aniworld': 'false',
                      'provider.bsto': 'false',
                      'provider.burningseries': 'false',
                      'provider.huhu': 'false',
                      'provider.kool': 'false',
                      'provider.moviedream': 'false',
                      'provider.netzkino': 'true',
                      'progress.dialog': '0',
                      'hosts.quality': '0',
                      'hosts.sort': '2',
                      'serienstream.user': 'Barclay69',
                      'serienstream.pass': 'melanie1',
                  }
                  for key, value in values.items():
                      setSetting(key, value)
                  setSetting(migration_key, 'done')
                  if isLogger:
                      logger.info('[service]: Barclay settings migration 20260721 completed')
              except Exception as exc:
                  if isLogger:
                      logger.warning('[service]: Barclay settings migration failed: %s' % str(exc))
          '''
              anchor = 'if __name__ == "__main__":\n'
              if anchor not in s:
                  raise SystemExit('service main anchor not found')
              s = s.replace(anchor, migration + '\n\n' + anchor, 1)
              call_anchor = '    monitor = xbmc.Monitor()\n'
              if call_anchor not in s:
                  raise SystemExit('service monitor anchor not found')
              s = s.replace(call_anchor, call_anchor + '\n    _barclay_settings_migration_20260721()\n', 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          PY

          grep -q 'version="2026.07.21"' "$ROOT/addon.xml"
          grep -q 'addon="inputstream.adaptive"' "$ROOT/addon.xml"
          grep -q 'BARCLAY_SETTINGS_MIGRATION_20260721' "$ROOT/service.py"
          python3 -m py_compile "$ROOT/service.py"
          ROOT="$ROOT" python3 - <<'PY'
          import xml.etree.ElementTree as ET, os
          ET.parse(os.path.join(os.environ['ROOT'], 'addon.xml'))
          ET.parse(os.path.join(os.environ['ROOT'], 'resources', 'settings.xml'))
          PY

          rm -f "$OUT"
          (cd "$WORK" && zip -qr "$GITHUB_WORKSPACE/$OUT" plugin.video.xship)
          unzip -t "$OUT" >/dev/null

      - name: Update repository metadata and checksum
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib
          p = Path('zips/addons.xml')
          s = p.read_text(encoding='utf-8')
          s2, n = re.subn(r'(<addon\s+id="plugin\.video\.xship"\s+version=")2026\.07\.20(")', r'\g<1>2026.07.21\2', s, count=1)
          if n != 1:
              raise SystemExit('xShip 2026.07.20 metadata entry not found')
          s = s2
          start = s.index('<addon id="plugin.video.xship"')
          end = s.index('</addon>', start) + len('</addon>')
          block = s[start:end]
          if 'addon="inputstream.adaptive"' not in block:
              anchor = '<import addon="script.module.resolveurl" version="5.1.100" />'
              if anchor not in block:
                  raise SystemExit('ResolveURL dependency missing from repository xShip entry')
              block = block.replace(anchor, anchor + '\n        <import addon="inputstream.adaptive" />', 1)
              s = s[:start] + block + s[end:]
          p.write_text(s, encoding='utf-8', newline='\n')
          md5 = hashlib.md5(p.read_bytes()).hexdigest()
          Path('zips/addons.xml.md5').write_text(md5 + '\n', encoding='ascii')
          print('addons.xml md5:', md5)
          PY

      - name: Commit 2026.07.21
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zips/plugin.video.xship/plugin.video.xship-2026.07.21.zip zips/addons.xml zips/addons.xml.md5
          git diff --cached --quiet && exit 0
          git commit -m 'Build xShip 2026.07.21 defaults and ISA dependency'
          git push
