name: Build xShip Kusi notice 5s local test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-xship-kusinotice5s-2026.08.21.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build 5-second silent Kusi start notice
        shell: bash
        run: |
          set -euo pipefail
          BASE='zips/plugin.video.xship/plugin.video.xship-2026.08.21.3.zip'
          WORK="$RUNNER_TEMP/xship-kusinotice5s"
          ROOT="$WORK/plugin.video.xship"
          OUT='test-builds/plugin.video.xship-2026.08.21.8-KUSI5S.zip'
          export ROOT

          test -f "$BASE"
          rm -rf "$WORK"
          mkdir -p "$WORK" test-builds
          unzip -q "$BASE" -d "$WORK"

          python3 - <<'PY'
          from pathlib import Path
          import os, re

          root = Path(os.environ['ROOT'])
          addon = root / 'addon.xml'
          s = addon.read_text(encoding='utf-8')
          s, n = re.subn(r'(<addon\b[^>]*\bversion=")[^"]+("[^>]*>)',
                         r'\g<1>2026.08.21.8-KUSI5S\2', s, count=1)
          if n != 1:
              raise SystemExit('addon version not found')
          addon.write_text(s, encoding='utf-8', newline='\n')

          src = root / 'resources/lib/sources.py'
          s = src.read_text(encoding='utf-8')
          lines = s.splitlines(True)
          out = []
          count = 0
          for line in lines:
              if 'player().run(' in line:
                  indent = line[:len(line)-len(line.lstrip())]
                  out.append(indent + 'try:\n')
                  out.append(indent + '    import xbmcgui\n')
                  out.append(indent + "    xbmcgui.Dialog().notification('xShip', 'Kusi sagt: Der Stream wird gestartet, nur Geduld ;-)', xbmcgui.NOTIFICATION_INFO, 5000, False)\n")
                  out.append(indent + 'except:\n')
                  out.append(indent + '    pass\n')
                  count += 1
              out.append(line)
          if count < 1:
              raise SystemExit('No player().run handoff found')
          src.write_text(''.join(out), encoding='utf-8', newline='\n')
          print('notifications added:', count)
          PY

          python3 -m py_compile "$ROOT/resources/lib/sources.py" "$ROOT/resources/lib/player.py"
          grep -q 'version="2026.08.21.8-KUSI5S"' "$ROOT/addon.xml"
          grep -q "Kusi sagt: Der Stream wird gestartet, nur Geduld ;-)" "$ROOT/resources/lib/sources.py"

          rm -f "$OUT"
          (cd "$WORK" && zip -qr "$GITHUB_WORKSPACE/$OUT" plugin.video.xship)
          unzip -t "$OUT" >/dev/null

      - name: Commit local test ZIP only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-builds/plugin.video.xship-2026.08.21.8-KUSI5S.zip
          git diff --cached --quiet && exit 0
          git commit -m 'Add xShip 2026.08.21.8 Kusi 5-second notice local test'
          git push
