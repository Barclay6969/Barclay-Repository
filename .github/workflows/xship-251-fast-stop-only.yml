name: Build xShip 25.1 fast-stop-only test

on:
  push:
    paths:
      - '.github/workflows/xship-251-fast-stop-only.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build from exact 25.1 with player stop only
        shell: bash
        run: |
          set -euo pipefail
          BASE='test-builds/plugin.video.xship-2026.08.25.1-MEDIAINFO-GUARD-TEST.zip'
          OUT='test-builds/plugin.video.xship-2026.08.25.5-FAST-STOP-ONLY-TEST.zip'
          rm -rf /tmp/xship-251-faststop /tmp/xship-251-base
          mkdir -p /tmp/xship-251-faststop /tmp/xship-251-base
          unzip -q "$BASE" -d /tmp/xship-251-faststop
          unzip -q "$BASE" -d /tmp/xship-251-base

          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('/tmp/xship-251-faststop/plugin.video.xship')
          p = root / 'resources/lib/player.py'
          s = p.read_text(encoding='utf-8')
          old = '            monitor.waitForAbort(3)\n'
          new = '            # FAST-STOP-ONLY: react to playback stop almost immediately.\n            monitor.waitForAbort(0.1)\n'
          if s.count(old) != 1:
              raise SystemExit('Expected exactly one monitor.waitForAbort(3)')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          addon = root / 'addon.xml'
          a = addon.read_text(encoding='utf-8')
          a2, n = re.subn(r'(<addon\b[^>]*?\bversion=")[^"]+("[^>]*>)', r'\g<1>2026.08.25.5\2', a, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not update addon version')
          addon.write_text(a2, encoding='utf-8')

          if '[MEDIAINFO-GUARD]' not in (root / 'resources/lib/mediainfo.py').read_text(encoding='utf-8'):
              raise SystemExit('MediaInfo guard missing')
          PY

          set +e
          DIFFS=$(diff -qr /tmp/xship-251-base/plugin.video.xship /tmp/xship-251-faststop/plugin.video.xship | sed -n 's#^Files .*plugin.video.xship/\(.*\) and .* differ$#\1#p' | sort)
          set -e
          printf 'Changed files:\n%s\n' "$DIFFS"
          EXPECTED=$(printf 'addon.xml\nresources/lib/player.py')
          if [ "$DIFFS" != "$EXPECTED" ]; then
            echo 'Unexpected changed files; refusing build.'
            exit 1
          fi

          python3 -m compileall -q /tmp/xship-251-faststop/plugin.video.xship
          rm -f "$OUT"
          (cd /tmp/xship-251-faststop && zip -qr "$GITHUB_WORKSPACE/$OUT" plugin.video.xship)
          unzip -t "$OUT" >/dev/null
          unzip -p "$OUT" plugin.video.xship/addon.xml | grep -q 'version="2026.08.25.5"'

      - name: Commit local test ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-builds/plugin.video.xship-2026.08.25.5-FAST-STOP-ONLY-TEST.zip
          git commit -m 'Add xShip 25.1 fast-stop-only local test'
          git push
