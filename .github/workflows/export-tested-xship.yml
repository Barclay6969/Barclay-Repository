name: Export tested xShip

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-tested-xship.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: tested-xship
          path: test-builds/plugin.video.xship-2026.08.21.10-SERIESVOE.zip
