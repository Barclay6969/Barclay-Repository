name: Build xShip repository metadata

on:
  push:
    paths:
      - 'zips/plugin.video.xship/*.zip'
      - '.github/workflows/extract-xship-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize xShip package and rebuild feed
        shell: python
        run: |
          import hashlib
          import pathlib
          import re
          import shutil
          import zipfile
          import xml.etree.ElementTree as ET

          root = pathlib.Path('.')
          xdir = root / 'zips' / 'plugin.video.xship'
          zips = sorted(xdir.glob('*.zip'))
          if not zips:
              raise SystemExit('No xShip ZIP found')

          packages = []
          for zp in zips:
              try:
                  with zipfile.ZipFile(zp) as zf:
                      addon_name = next(n for n in zf.namelist() if n.endswith('/addon.xml') or n == 'addon.xml')
                      xml_bytes = zf.read(addon_name)
                      addon = ET.fromstring(xml_bytes)
                      if addon.attrib.get('id') == 'plugin.video.xship':
                          packages.append((addon.attrib.get('version', '0'), zp, addon_name, xml_bytes, addon))
              except Exception:
                  pass
          if not packages:
              raise SystemExit('No valid plugin.video.xship package found')

          # Highest version contained in addon.xml wins. The filename is generated from it.
          version, zp, addon_name, xml_bytes, addon = sorted(packages, key=lambda x: x[0])[-1]
          canonical = xdir / f'plugin.video.xship-{version}.zip'
          if zp != canonical:
              shutil.copy2(zp, canonical)

          # Keep only the current package.
          for old in xdir.glob('*.zip'):
              if old != canonical:
                  old.unlink()

          # Rebuild artwork exactly according to the paths declared by xShip itself.
          for child in list(xdir.iterdir()):
              if child.is_dir():
                  shutil.rmtree(child)

          with zipfile.ZipFile(canonical) as zf:
              prefix = addon_name[:-len('addon.xml')]
              for asset in addon.findall('.//assets/*'):
                  rel = (asset.text or '').strip()
                  if not rel:
                      continue
                  member = prefix + rel
                  try:
                      data = zf.read(member)
                  except KeyError:
                      continue
                  out = xdir / rel
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(data)

          # Rebuild the Kodi repository index and matching MD5 checksum.
          repo_xml = (root / 'addons' / 'repository.barclay' / 'addon.xml').read_text(encoding='utf-8-sig').strip()
          xship_xml = xml_bytes.decode('utf-8-sig').strip()
          xship_xml = re.sub(r'^<\?xml[^>]*\?>\s*', '', xship_xml)
          repo_xml = re.sub(r'^<\?xml[^>]*\?>\s*', '', repo_xml)
          feed = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<addons>\n' + repo_xml + '\n\n' + xship_xml + '\n</addons>\n'
          (root / 'zips' / 'addons.xml').write_text(feed, encoding='utf-8', newline='\n')
          (root / 'zips' / 'addons.xml.md5').write_text(hashlib.md5(feed.encode('utf-8')).hexdigest() + '\n', encoding='ascii', newline='\n')

          print(f'xShip repository normalized to version {version}')

      - name: Commit generated repository files
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A zips/plugin.video.xship zips/addons.xml zips/addons.xml.md5
          git commit -m "Rebuild xShip repository metadata"
          git push
