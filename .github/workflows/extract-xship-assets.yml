name: Build Kusi xShip repository

on:
  push:
    paths:
      - 'zips/plugin.video.xship/*.zip'
      - 'zips/plugin.video.xship/resources/icon.png'
      - '.xship-stage/**'
      - 'addons/repository.barclay/**'
      - '.github/workflows/extract-xship-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reassemble staged xShip ZIP
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G '.xship-stage/part-*' > /dev/null; then
            mkdir -p zips/plugin.video.xship
            cat .xship-stage/part-* | base64 -d > zips/plugin.video.xship/xship-upload.zip
          fi

      - name: Normalize packages and rebuild repository
        shell: python
        run: |
          import hashlib
          import pathlib
          import re
          import shutil
          import tempfile
          import zipfile
          import xml.etree.ElementTree as ET

          root = pathlib.Path('.')
          xdir = root / 'zips' / 'plugin.video.xship'
          brand_dir = root / 'branding'
          brand_icon = brand_dir / 'xship-icon.png'
          repo_icon = xdir / 'resources' / 'icon.png'
          brand_dir.mkdir(parents=True, exist_ok=True)

          # The visible repository icon is the authoritative xShip branding source.
          # If it exists, always sync it to the permanent branding copy.
          if repo_icon.exists():
              shutil.copy2(repo_icon, brand_icon)
          elif not brand_icon.exists():
              candidate = xdir / 'resources' / 'media' / 'icon.png'
              if candidate.exists():
                  shutil.copy2(candidate, brand_icon)

          zips = sorted(xdir.glob('*.zip'))
          if not zips:
              raise SystemExit('No xShip ZIP found')

          packages = []
          for zp in zips:
              try:
                  with zipfile.ZipFile(zp) as zf:
                      addon_name = next(n for n in zf.namelist() if n.endswith('/addon.xml') or n == 'addon.xml')
                      xml_bytes = zf.read(addon_name)
                      addon = ET.fromstring(xml_bytes)
                      if addon.attrib.get('id') == 'plugin.video.xship':
                          packages.append((addon.attrib.get('version', '0'), zp, addon_name, xml_bytes, addon))
              except Exception:
                  pass
          if not packages:
              raise SystemExit('No valid plugin.video.xship package found')

          version, source_zip, addon_name, xml_bytes, addon = sorted(packages, key=lambda x: x[0])[-1]
          canonical = xdir / f'plugin.video.xship-{version}.zip'

          icon_rel = None
          for asset in addon.findall('.//assets/icon'):
              if asset.text and asset.text.strip():
                  icon_rel = asset.text.strip()
                  break

          with tempfile.NamedTemporaryFile(suffix='.zip', delete=False) as tf:
              temp_zip = pathlib.Path(tf.name)

          with zipfile.ZipFile(source_zip, 'r') as zin, zipfile.ZipFile(temp_zip, 'w', zipfile.ZIP_DEFLATED) as zout:
              prefix = addon_name[:-len('addon.xml')]
              icon_member = prefix + icon_rel if icon_rel else None
              for item in zin.infolist():
                  if icon_member and item.filename == icon_member and brand_icon.exists():
                      zout.writestr(item, brand_icon.read_bytes())
                  else:
                      zout.writestr(item, zin.read(item.filename))
              if icon_member and brand_icon.exists() and icon_member not in zin.namelist():
                  zout.writestr(icon_member, brand_icon.read_bytes())

          shutil.move(str(temp_zip), canonical)
          for old in xdir.glob('*.zip'):
              if old != canonical:
                  old.unlink()

          with zipfile.ZipFile(canonical) as zf:
              addon_name = next(n for n in zf.namelist() if n.endswith('/addon.xml') or n == 'addon.xml')
              xml_bytes = zf.read(addon_name)
              addon = ET.fromstring(xml_bytes)
              prefix = addon_name[:-len('addon.xml')]

              for child in list(xdir.iterdir()):
                  if child.is_dir():
                      shutil.rmtree(child)

              for asset in addon.findall('.//assets/*'):
                  rel = (asset.text or '').strip()
                  if not rel:
                      continue
                  member = prefix + rel
                  try:
                      data = zf.read(member)
                  except KeyError:
                      continue
                  out = xdir / rel
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(data)

          repo_src = root / 'addons' / 'repository.barclay'
          repo_root = ET.fromstring((repo_src / 'addon.xml').read_text(encoding='utf-8-sig'))
          repo_version = repo_root.attrib['version']
          repo_out = root / 'zips' / 'repository.barclay'
          repo_out.mkdir(parents=True, exist_ok=True)
          for old in repo_out.glob('repository.barclay-*.zip'):
              old.unlink()
          repo_zip = repo_out / f'repository.barclay-{repo_version}.zip'
          with zipfile.ZipFile(repo_zip, 'w', zipfile.ZIP_DEFLATED) as zf:
              for path in repo_src.rglob('*'):
                  if path.is_file():
                      arc = pathlib.Path('repository.barclay') / path.relative_to(repo_src)
                      zf.write(path, arc.as_posix())

          repo_xml = (repo_src / 'addon.xml').read_text(encoding='utf-8-sig').strip()
          xship_xml = xml_bytes.decode('utf-8-sig').strip()
          xship_xml = re.sub(r'^<\?xml[^>]*\?>\s*', '', xship_xml)
          repo_xml = re.sub(r'^<\?xml[^>]*\?>\s*', '', repo_xml)
          feed = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<addons>\n' + repo_xml + '\n\n' + xship_xml + '\n</addons>\n'
          (root / 'zips' / 'addons.xml').write_text(feed, encoding='utf-8', newline='\n')
          (root / 'zips' / 'addons.xml.md5').write_text(hashlib.md5(feed.encode('utf-8')).hexdigest() + '\n', encoding='ascii', newline='\n')

          shutil.rmtree(root / '.xship-stage', ignore_errors=True)
          print(f'xShip {version}; repository {repo_version}; branding preserved={brand_icon.exists()}')

      - name: Commit generated repository files
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A branding zips/plugin.video.xship zips/repository.barclay zips/addons.xml zips/addons.xml.md5 .xship-stage || true
          git commit -m "Build Kusi xShip repository"
          git push
