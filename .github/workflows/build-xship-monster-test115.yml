name: Build xShip Monster test 115

on:
  push:
    paths:
      - '.github/workflows/build-xship-monster-test115.yml'
      - 'tools/build_xship_monster_test115.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Monster mapping test
        run: python3 tools/build_xship_monster_test115.py
      - name: Verify build
        shell: bash
        run: |
          set -euo pipefail
          ZIP='test-builds/plugin.video.xship-2026.09.29.115-MONSTER-TEST1.zip'
          unzip -p "$ZIP" 'plugin.video.xship/addon.xml' | grep 'version="2026.09.29.115"'
          unzip -p "$ZIP" 'plugin.video.xship/scrapers/scrapers_source/de/serienstream.py' | grep 'Monster mapping'
          unzip -p "$ZIP" 'plugin.video.xship/resources/lib/sources.py' | grep 'self.tmdb_id = tmdb'
      - name: Commit test ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add test-builds/plugin.video.xship-2026.09.29.115-MONSTER-TEST1.zip
          git commit -m "Build xShip 2026.09.29.115 Monster test" || exit 0
          git push
