name: Build xShip Monster test 115

on:
  push:
    paths:
      - '.github/workflows/build-xship-monster-test115.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Monster mapping test
        shell: bash
        run: |
          set -euo pipefail
          BASE='zips/plugin.video.xship/plugin.video.xship-2026.09.28.105.zip'
          OUT='test-builds/plugin.video.xship-2026.09.29.115-MONSTER-TEST1.zip'
          WORK="$RUNNER_TEMP/xship-monster-115"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          unzip -q "$BASE" -d "$WORK"
          ROOT="$(find "$WORK" -maxdepth 2 -type f -name addon.xml -printf '%h\n' | head -n1)"
          export ROOT OUT

          python3 - <<'PY'
          from pathlib import Path
          import os, re, zipfile

          root = Path(os.environ['ROOT'])
          out = Path(os.environ['OUT'])

          # 1) Keep TMDb id on the provider instance when available and normalize
          #    literal "None"/"null" values from external TMDbHelper player URLs.
          p = root / 'resources/lib/sources.py'
          s = p.read_text(encoding='utf-8')
          old = """        tmdb = data.get('tmdb_id') if 'tmdb_id' in data else None
        #if tmdb and not imdb: print 'hallo' #TODO"""
          new = """        tmdb = data.get('tmdb_id') if 'tmdb_id' in data else None
        # External players may pass the literal string "None". Treat that as
        # missing metadata so providers never search for imdb=None.
        if imdb is not None and str(imdb).strip().lower() in ('', 'none', 'null', 'unknown'):
            imdb = None
        self.tmdb_id = tmdb
        #if tmdb and not imdb: print 'hallo' #TODO"""
          if old not in s:
              raise SystemExit('sources.py metadata anchor not found')
          s = s.replace(old, new, 1)

          old = """            try:
                call.mediatype = getattr(self, 'mediatype', None)
            except Exception:
                pass
            if self._acceptsHostDict(call):"""
          new = """            try:
                call.mediatype = getattr(self, 'mediatype', None)
                call.tmdb_id = getattr(self, 'tmdb_id', None)
            except Exception:
                pass
            if self._acceptsHostDict(call):"""
          if old not in s:
              raise SystemExit('sources.py provider metadata anchor not found')
          s = s.replace(old, new, 1)
          compile(s, str(p), 'exec')
          p.write_text(s, encoding='utf-8', newline='\n')

          # 2) SerienStream: TMDb models Monster as four separate shows, while
          #    SerienStream now stores them as /serie/monster-2022 seasons 1-4.
          p = root / 'scrapers/scrapers_source/de/serienstream.py'
          s = p.read_text(encoding='utf-8')

          anchor = "LEGACY_DOMAINS = set(['.'.join(('s', 'to')), 'www.' + '.'.join(('s', 'to'))])\n"
          inject = r'''
MONSTER_SERIES_PATH = '/serie/monster-2022'
MONSTER_TMDB_SEASONS = {
    '113988': 1,  # DAHMER - Monster: The Jeffrey Dahmer Story
    '225634': 2,  # Monsters: The Lyle and Erik Menendez Story
    '286801': 3,  # Monster: The Ed Gein Story
    '299939': 4,  # Monster: The Lizzie Borden Story
}


def _monster_target_season(titles, tmdb_id=None):
    """Map TMDb's four standalone Monster shows to SerienStream's anthology seasons."""
    try:
        key = str(tmdb_id or '').strip()
        if key in MONSTER_TMDB_SEASONS:
            return MONSTER_TMDB_SEASONS[key]
    except:
        pass

    try:
        blob = ' '.join([str(x or '') for x in (titles or [])]).lower()
    except:
        blob = str(titles or '').lower()

    # Title fallback is required for TMDbHelper player files that currently
    # do not forward tmdb_id into the xShip playExtern URL.
    if 'dahmer' in blob and 'jeffrey' in blob:
        return 1
    if 'menendez' in blob and ('lyle' in blob or 'erik' in blob):
        return 2
    if 'ed gein' in blob or ('gein' in blob and 'monster' in blob):
        return 3
    if 'lizzie borden' in blob:
        return 4
    return None
'''
          if inject.strip() not in s:
              if anchor not in s:
                  raise SystemExit('serienstream constants anchor not found')
              s = s.replace(anchor, anchor + inject + '\n', 1)

          old = """            login_success = self._do_login(login, password)
            if not login_success:
                if log_utils:
                    logger.info('SerienStream - Login failed, but continuing anyway')

            aLinks = []
"""
          new = """            login_success = self._do_login(login, password)
            if not login_success:
                if log_utils:
                    logger.info('SerienStream - Login failed, but continuing anyway')

            # Monster special case:
            # TMDb has four separate series (all season 1), whereas SerienStream
            # combines them in Monster (2022) as seasons 1-4.
            monster_season = _monster_target_season(titles, getattr(self, 'tmdb_id', None))
            if monster_season:
                if log_utils:
                    logger.info('SerienStream - Monster mapping: tmdb=%s -> /serie/monster-2022 S%02dE%02d' % (
                        getattr(self, 'tmdb_id', None), monster_season, int(episode or 0)
                    ))
                # Do not validate the standalone-series IMDb id against the
                # anthology page; it is intentionally a different catalogue entry.
                self.run2(MONSTER_SERIES_PATH, year, season=monster_season, episode=episode,
                          hostDict=hostDict, imdb=None)
                return self.sources

            aLinks = []
"""
          if old not in s:
              raise SystemExit('serienstream run anchor not found')
          s = s.replace(old, new, 1)
          compile(s, str(p), 'exec')
          p.write_text(s, encoding='utf-8', newline='\n')

          # 3) Bump addon version so Kodi installs this test over local .114.
          addon = root / 'addon.xml'
          a = addon.read_text(encoding='utf-8-sig')
          a2, n = re.subn(r'(<addon\s+id="plugin\.video\.xship"\s+version=")[^"]+(")', r'\g<1>2026.09.29.115\2', a, count=1)
          if n != 1:
              raise SystemExit('addon version anchor not found')
          addon.write_text(a2, encoding='utf-8', newline='\n')

          # Small build note inside the package.
          note = root / 'MONSTER-TEST1.txt'
          note.write_text(
              'xShip 2026.09.29.115 MONSTER-TEST1\n'
              'SerienStream Monster mapping: TMDb standalone series -> Monster (2022) seasons 1-4.\n'
              'Also normalizes literal imdb=None/null before provider calls.\n',
              encoding='utf-8'
          )

          out.parent.mkdir(parents=True, exist_ok=True)
          if out.exists():
              out.unlink()
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
              for f in sorted(root.rglob('*')):
                  if f.is_file():
                      z.write(f, Path(root.name) / f.relative_to(root))
          print(out)
          PY

          unzip -p "$OUT" 'plugin.video.xship/addon.xml' | grep 'version="2026.09.29.115"'
          unzip -p "$OUT" 'plugin.video.xship/scrapers/scrapers_source/de/serienstream.py' | grep 'Monster mapping'
          unzip -p "$OUT" 'plugin.video.xship/resources/lib/sources.py' | grep "self.tmdb_id = tmdb"

      - name: Commit test ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add test-builds/plugin.video.xship-2026.09.29.115-MONSTER-TEST1.zip
          git commit -m "Build xShip 2026.09.29.115 Monster test" || exit 0
          git push

# trigger build
