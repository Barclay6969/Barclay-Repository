name: Build TerrorLite 1.1.23 Glossy Logo TEST
on:
  push:
    branches: [terrorlite-glossy-logos-test]
    paths:
      - tools/build_terrorlite_glossy_logos.py
      - .github/workflows/build-terrorlite-glossy-logos.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: terrorlite-glossy-logos-test
          fetch-depth: 0
      - name: Install Pillow
        run: python3 -m pip install --break-system-packages 'pillow==12.3.0'
      - name: Build installable Kodi ZIP from stable 1.1.22
        run: python3 tools/build_terrorlite_glossy_logos.py
      - name: Upload test skin ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TerrorLite-1.1.23-Glossy-Logos-TEST
          path: test-builds/skin.terror.lite-1.1.23-LOGOS-TEST.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Commit test ZIP (without changing repository publication index)
        run: |
          git config user.name 'Barclay test bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test-builds/skin.terror.lite-1.1.23-LOGOS-TEST.zip development/terrorlite-glossy/build-report.txt
          git commit -m 'Build installable TerrorLite 1.1.23 glossy metadata test [skip ci]' || exit 0
          git push origin HEAD:terrorlite-glossy-logos-test
