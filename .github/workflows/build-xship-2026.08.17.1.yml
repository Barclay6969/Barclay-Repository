name: Build xShip 2026.08.17.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-xship-2026.08.17.1.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build xShip 2026.08.17.1
        shell: bash
        env:
          HELPER_B64: 
          PATCH_B64: 
          REPO_B64: 
        run: |
          set -euo pipefail
          BASE='zips/plugin.video.xship/plugin.video.xship-2026.08.17.zip'
          OUT='zips/plugin.video.xship/plugin.video.xship-2026.08.17.1.zip'
          WORK="$RUNNER_TEMP/xship08171"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          unzip -q "$BASE" -d "$WORK"
          ROOT="$WORK/plugin.video.xship"
          export ROOT HELPER_B64

          echo "$PATCH_B64" | base64 -d > "$RUNNER_TEMP/patch8171.py"
          python3 "$RUNNER_TEMP/patch8171.py"

          rm -f "$OUT"
          (cd "$WORK" && zip -qr "$GITHUB_WORKSPACE/$OUT" plugin.video.xship)

          echo "$REPO_B64" | base64 -d > "$RUNNER_TEMP/repo8171.py"
          python3 "$RUNNER_TEMP/repo8171.py"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT" zips/addons.xml zips/addons.xml.md5
          git commit -m 'Release xShip 2026.08.17.1 startup domain sync'
          git push
