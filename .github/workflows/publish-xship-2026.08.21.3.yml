name: Publish xShip 2026.08.21.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-xship-2026.08.21.3.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Build and publish tested xShip 2026.08.21.3
        shell: bash
        run: |
          set -euo pipefail
          BASE='zips/plugin.video.xship/plugin.video.xship-2026.08.20.1.zip'
          OUT='zips/plugin.video.xship/plugin.video.xship-2026.08.21.3.zip'
          WORK="$RUNNER_TEMP/xship-2026.08.21.3"
          PATCH="$RUNNER_TEMP/xship-2026.08.21.3.patch"
          export WORK OUT
          test -f "$BASE"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          unzip -q "$BASE" -d "$WORK"
          printf '%s' '[... ELLIPSIZATION ...]' | base64 -d | gzip -d > "$PATCH"
          (cd "$WORK" && patch -p1 --batch < "$PATCH")

          ROOT="$WORK/plugin.video.xship"
          export ROOT
          python3 - <<'PYCODE'
          import hashlib, pathlib, xml.etree.ElementTree as ET, os
          root = pathlib.Path(os.environ['ROOT'])
          addon = ET.parse(root / 'addon.xml').getroot()
          if addon.get('version') != '2026.08.21.3':
              raise SystemExit('packaged addon version mismatch')
          if 'MOFLIX-FAST' not in (root / 'scrapers/scrapers_source/de/moflix.py').read_text(encoding='utf-8'):
              raise SystemExit('Moflix safe-fast marker missing')

          repo_xml = pathlib.Path('zips/addons.xml')
          tree = ET.parse(repo_xml)
          addons = tree.getroot()
          xship = next((a for a in addons.findall('addon') if a.get('id') == 'plugin.video.xship'), None)
          if xship is None:
              raise SystemExit('xShip entry missing in addons.xml')
          xship.set('version', '2026.08.21.3')
          package_meta = next((e for e in addon.findall('extension') if e.get('point') == 'xbmc.addon.metadata'), None)
          repo_meta = next((e for e in xship.findall('extension') if e.get('point') == 'xbmc.addon.metadata'), None)
          package_news = package_meta.find('news') if package_meta is not None else None
          repo_news = repo_meta.find('news') if repo_meta is not None else None
          if package_news is None or repo_meta is None:
              raise SystemExit('metadata/news missing')
          if repo_news is None:
              repo_news = ET.SubElement(repo_meta, 'news')
          repo_news.text = package_news.text
          ET.indent(tree, space='  ')
          repo_xml.write_text('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + ET.tostring(addons, encoding='unicode') + '\n', encoding='utf-8')
          pathlib.Path('zips/addons.xml.md5').write_text(hashlib.md5(repo_xml.read_bytes()).hexdigest() + '\n', encoding='ascii')
          PYCODE

          rm -f "$OUT"
          (cd "$WORK" && zip -qr "$GITHUB_WORKSPACE/$OUT" plugin.video.xship)
          unzip -t "$OUT" >/dev/null
          unzip -p "$OUT" plugin.video.xship/addon.xml | grep -q 'version="2026.08.21.3"'
          unzip -p "$OUT" plugin.video.xship/scrapers/scrapers_source/de/moflix.py | grep -q 'MOFLIX-FAST'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT" zips/addons.xml zips/addons.xml.md5
          git commit -m 'Release xShip 2026.08.21.3 performance optimizations'
          git push origin HEAD:main
