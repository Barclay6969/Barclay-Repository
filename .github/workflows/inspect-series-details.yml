name: Inspect series details

on:
  push:
    branches: [ main ]
    paths:
      - '.inspect-series-details'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live detail structures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,urllib.request,urllib.parse

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept-Language':'de-DE,de;q=0.9,en;q=0.8'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      return r.status,r.geturl(),r.read().decode('utf-8','replace')
              except Exception as e:
                  return 'ERR',url,str(e)

          out=[]

          # KinoKing current series page
          for label,url in [
              ('KINOKING_REACHER','https://kinoking.cc/series.php?id=196'),
              ('STREAMCLOUD_REACHER','https://streamcloud.download/31575-reacher-stream-deutsch.html'),
              ('HDFILME_REACHER','https://hd-filme.lol/25204-reacher-stream-deutsch-kostenlos.html'),
              ('HUHU_HOME','https://www.huhu.to/'),
              ('HUHU_WEBVOD','https://www.huhu.to/web-vod/'),
          ]:
              status,final,body=get(url)
              out += [f'=== {label} ===',f'STATUS={status}',f'FINAL={final}',f'LENGTH={len(body)}']
              if status=='ERR':
                  out += [body[:1000],'']
                  continue
              low=body.lower()
              for token in ['playepisode','episode-navigation','data-season','data-episode','season','staffel','1x1','s1 e1','serial','api/','web-vod','links?id','tmdb','reacher']:
                  out.append(f'{token.upper()}_COUNT={low.count(token)}')
              for needle in ['playepisode','episode-navigation','data-season','data-episode','1x1','s1 e1','api/','web-vod','reacher']:
                  pos=low.find(needle)
                  if pos>=0:
                      snippet=re.sub(r'\s+',' ',body[max(0,pos-800):pos+2500])
                      out.append(f'[{needle}] {snippet[:3400]}')
              # script src list
              srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)',body,re.I)
              out.append('SCRIPT_SRCS='+json.dumps(srcs[:30],ensure_ascii=False))
              out.append('')

          # Movie4K: print exact candidates + watch result for Reacher S1
          for lang in ('2','3','4'):
              status,final,body=get('https://movie4k.sx/data/search/?lang=%s&keyword=Reacher' % lang)
              out += [f'=== MOVIE4K_LANG_{lang} ===',f'STATUS={status}',f'LENGTH={len(body)}']
              if status==200:
                  try:
                      data=json.loads(body)
                      for item in data:
                          title=str(item.get('title') or '')
                          if 'reacher' in title.lower() and int(item.get('tv') or 0)==1:
                              out.append('CANDIDATE='+json.dumps({
                                  k:item.get(k) for k in ['_id','title','year','lang','tv','s','imdb','imdb_id','totalSeasons','totalEpisodes']
                              },ensure_ascii=False))
                              mid=item.get('_id')
                              if mid:
                                  st,fu,wb=get('https://movie4k.sx/data/watch/?_id=%s' % mid)
                                  out.append('WATCH_STATUS=%s LEN=%s' % (st,len(wb)))
                                  if st==200:
                                      try:
                                          wd=json.loads(wb)
                                          out.append('WATCH_KEYS='+','.join(wd.keys()))
                                          streams=wd.get('streams') or []
                                          out.append('WATCH_STREAMS='+str(len(streams)))
                                          out.append('WATCH_E1='+json.dumps([x for x in streams if str(x.get('e')) in ('1','01')][:10],ensure_ascii=False)[:5000])
                                      except Exception as e:
                                          out.append('WATCH_JSON_ERROR='+str(e))
                  except Exception as e:
                      out.append('JSON_ERROR='+str(e))
              out.append('')

          Path('test-builds/series-detail-diagnostic.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .inspect-series-details
          git rm -f .github/workflows/inspect-series-details.yml
          git add test-builds/series-detail-diagnostic.txt
          git commit -m "Inspect live series detail structures"
          git push
