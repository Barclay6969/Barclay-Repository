name: Build MoFlix movie local test

on:
  push:
    paths:
      - '.github/workflows/build-moflix-movie-localtest.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build local test ZIP
        shell: bash
        run: |
          set -euo pipefail
          BASE='zips/plugin.video.xship/plugin.video.xship-2026.09.17.97.zip'
          OUT='test-builds/plugin.video.xship-2026.09.17.97-MOFLIX-MOVIE-TEST.zip'
          WORK="$RUNNER_TEMP/xship-moflix-movie-test"
          rm -rf "$WORK"
          mkdir -p "$WORK" test-builds
          unzip -q "$BASE" -d "$WORK"

          TARGET=$(find "$WORK" -path '*/scrapers/scrapers_source/de/moflix.py' -print -quit)
          if [ -z "$TARGET" ]; then
            echo 'MoFlix scraper not found in base ZIP' >&2
            exit 1
          fi

          TARGET="$TARGET" python - <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path(os.environ['TARGET'])
          s = path.read_text(encoding='utf-8')

          if 'from resources.lib.tools import logger' not in s:
              marker = 'from resources.lib.requestHandler import cRequestHandler\n'
              if marker in s:
                  s = s.replace(marker, marker + 'from resources.lib.tools import logger\n', 1)

          s = s.replace('&limit=8', '&limit=20')

          def replace_block(text, start, end, new):
              a = text.find(start)
              if a < 0:
                  raise RuntimeError('Start marker missing: ' + start)
              b = text.find(end, a)
              if b < 0:
                  raise RuntimeError('End marker missing: ' + end)
              return text[:a] + new.rstrip() + '\n\n' + text[b:]

          best_match = r'''    def _best_match(self, titles, year, season, imdb):
              candidates = []
              seen = set()
              queries = self._search_titles(titles, season)
              logger.info('[MOFLIX-MATCH] start titles=%s year=%s season=%s imdb=%s queries=%s' % (titles, year, season, imdb, queries))
              for title in queries:
                  data = self._json(self.search_link % (quote(title), quote_plus(title)), self.base_link + '/')
                  results = data.get('results') if isinstance(data, dict) else []
                  logger.info('[MOFLIX-MATCH] query=%s results=%s' % (title, len(results or [])))
                  for item in results or []:
                      if not isinstance(item, dict):
                          continue
                      if str(item.get('model_type') or '').lower() == 'person':
                          continue
                      item_id = item.get('id')
                      if item_id in seen:
                          continue
                      seen.add(item_id)
                      score, reason = self._match_score(item, titles, year, season, imdb)
                      logger.info('[MOFLIX-MATCH] candidate id=%s name=%s year=%s imdb=%s series=%s score=%s reason=%s' % (
                          item_id,
                          item.get('name') or item.get('title') or item.get('original_title'),
                          self._year(item), item.get('imdb_id'), item.get('is_series'), score, reason))
                      if score > 0:
                          candidates.append((score, item))
              candidates.sort(key=lambda value: value[0], reverse=True)
              if candidates:
                  chosen = candidates[0][1]
                  logger.info('[MOFLIX-MATCH] chosen id=%s name=%s score=%s' % (
                      chosen.get('id'), chosen.get('name') or chosen.get('title'), candidates[0][0]))
                  return chosen
              logger.info('[MOFLIX-MATCH] no match')
              return None'''

          match_score = r'''    def _match_score(self, item, titles, year, season, imdb):
              want_series = int(season or 0) > 0
              is_series = bool(item.get('is_series'))
              if want_series != is_series:
                  return 0, 'media-type'

              score = 0
              reasons = []
              wanted_imdb = str(imdb or '').strip().lower()
              item_imdb = str(item.get('imdb_id') or '').strip().lower()
              imdb_match = bool(wanted_imdb and item_imdb and item_imdb == wanted_imdb)
              if imdb_match:
                  score += 150
                  reasons.append('imdb')

              clean_titles = set()
              token_titles = []
              for title in titles or []:
                  if not title:
                      continue
                  clean = cleantitle.get(title)
                  if clean:
                      clean_titles.add(clean)
                  words = self._words(title)
                  if words:
                      token_titles.append(words)

              item_titles = set()
              item_words = []
              for key in ['name', 'title', 'original_title']:
                  value = item.get(key)
                  if value:
                      clean = cleantitle.get(value)
                      if clean:
                          item_titles.add(clean)
                      words = self._words(value)
                      if words:
                          item_words.append(words)

              for value in list(item_titles):
                  value = re.sub(r'(unrated|extended|directorscut|germansub|uncut)$', '', value or '')
                  if value:
                      item_titles.add(value)

              title_score = 0
              if clean_titles.intersection(item_titles):
                  title_score = 80
                  reasons.append('title-exact')
              else:
                  ratio = self._best_token_ratio(token_titles, item_words)
                  if ratio >= 0.84:
                      title_score = 55
                      reasons.append('title-token-%.2f' % ratio)
                  elif ratio >= 0.66:
                      title_score = 35
                      reasons.append('title-token-%.2f' % ratio)
                  elif self._loose_title_match(clean_titles, item_titles):
                      title_score = 30
                      reasons.append('title-loose')

              score += title_score
              if not imdb_match and title_score == 0:
                  return 0, 'title-mismatch'

              item_year = self._year(item)
              try:
                  if year and item_year:
                      delta = abs(int(year) - int(item_year))
                      if delta == 0:
                          score += 20
                          reasons.append('year')
                      elif delta == 1:
                          score += 8
                          reasons.append('year+-1')
                      elif delta <= 3:
                          score -= 5
                          reasons.append('year-delta-%s' % delta)
                      else:
                          score -= 15
                          reasons.append('year-delta-%s' % delta)
              except Exception:
                  pass

              return score, ','.join(reasons) or 'matched' '''

          search_titles = r'''    def _search_titles(self, titles, season=0):
              seen = set()
              result = []

              def add(value):
                  value = html_unescape(str(value or '').strip())
                  value = re.sub(r'\s+', ' ', value).strip(' -:')
                  key = value.lower()
                  if value and len(value) >= 2 and key not in seen:
                      seen.add(key)
                      result.append(value)

              for title in titles or []:
                  title = html_unescape(str(title or '').strip())
                  if not title:
                      continue
                  add(title)
                  add(title.replace(' vs. ', ' vs ').replace(' Vs. ', ' Vs '))
                  if ' - ' in title:
                      add(title.split(' - ', 1)[0])
                  if ':' in title:
                      add(title.split(':', 1)[0])

                  if not int(season or 0):
                      words = re.findall(r"[0-9A-Za-zÀ-ÿ]+", title)
                      stop = {'the', 'a', 'an', 'der', 'die', 'das', 'ein', 'eine', 'of', 'and', 'und'}
                      significant = [w for w in words if w.lower() not in stop]
                      if len(significant) >= 2:
                          add(' '.join(significant))
                      if len(significant) >= 3:
                          add(' '.join(significant[-3:]))

              return result[:16]

              @staticmethod
              def _words(value):
                  return [w.lower() for w in re.findall(r"[0-9A-Za-zÀ-ÿ]+", html_unescape(str(value or ''))) if w]

              @staticmethod
              def _best_token_ratio(wanted_titles, item_titles):
                  best = 0.0
                  for wanted in wanted_titles:
                      ws = set(wanted)
                      if not ws:
                          continue
                      for current in item_titles:
                          cs = set(current)
                          if not cs:
                              continue
                          common = len(ws.intersection(cs))
                          ratio = (2.0 * common) / float(len(ws) + len(cs))
                          if ratio > best:
                              best = ratio
                  return best'''

          s = replace_block(s, '    def _best_match(self, titles, year, season, imdb):', '    def _match_score(self, item, titles, year, season, imdb):', best_match)
          s = replace_block(s, '    def _match_score(self, item, titles, year, season, imdb):', '    def _episode_videos(self, title_id, season, episode):', match_score)
          s = replace_block(s, '    def _search_titles(self, titles):', '    @staticmethod\n    def _loose_title_match', search_titles)

          path.write_text(s, encoding='utf-8')
          print('Patched', path)
          PY

          python -m py_compile "$TARGET"

          ROOT=$(find "$WORK" -maxdepth 2 -name addon.xml -printf '%h\n' | head -n1)
          if [ -z "$ROOT" ] || [ ! -f "$ROOT/addon.xml" ]; then
            echo 'Addon root not found' >&2
            exit 1
          fi
          echo 'MoFlix movie matching local test based on xShip 2026.09.17.97' > "$ROOT/MOFLIX_MOVIE_TEST.txt"

          rm -f "$OUT"
          (cd "$(dirname "$ROOT")" && zip -qr "$GITHUB_WORKSPACE/$OUT" "$(basename "$ROOT")")
          unzip -l "$OUT" | grep -E 'moflix.py|MOFLIX_MOVIE_TEST.txt|addon.xml'
          echo "Built $OUT"

      - name: Commit local test ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Barclay Repo Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test-builds/plugin.video.xship-2026.09.17.97-MOFLIX-MOVIE-TEST.zip
          if git diff --cached --quiet; then
            echo 'No build change to commit'
            exit 0
          fi
          git commit -m 'Add MoFlix movie local test build'
          git push
