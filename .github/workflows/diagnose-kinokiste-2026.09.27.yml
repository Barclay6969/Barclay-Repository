name: Diagnose Kinokiste live

on:
  push:
    branches: [ main ]
    paths:
      - '.diagnose-kinokiste-2026.09.27'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe Kinokiste routes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re, requests
          from urllib.parse import urljoin

          base='https://kinokiste.club'
          headers={
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/137 Safari/537.36',
              'Accept-Language':'de-DE,de;q=0.9,en;q=0.8',
          }
          urls=[
              base+'/',
              base+'/browse?order_by=releases&type=movies',
              base+'/browse?order_by=releases&type=tvseries',
              base+'/browse?keyword=witchboard&type=movies',
              base+'/browse?keyword=coyote+vs.+acme&type=movies',
              base+'/data/browse/?lang=2&keyword=witchboard&year=2025&type=movies&page=1',
              base+'/data/search/?lang=2&keyword=witchboard',
          ]

          out=[]
          s=requests.Session()
          s.headers.update(headers)
          for url in urls:
              out.append('\n=== URL '+url+' ===')
              try:
                  r=s.get(url,timeout=15,allow_redirects=True)
                  out.append('STATUS=%s' % r.status_code)
                  out.append('FINAL=%s' % r.url)
                  out.append('CTYPE=%s' % r.headers.get('content-type',''))
                  out.append('LEN=%s' % len(r.text))
                  text=r.text
                  # Record interesting route/API hints without dumping the whole page.
                  patterns=[
                      r'/(?:data/)?(?:browse|watch|search)[^"\'<> ]*',
                      r'fetch\([^\n]{0,250}',
                      r'axios[^\n]{0,250}',
                      r'api[^\n]{0,250}',
                      r'witchboard.{0,300}',
                      r'coyote.{0,300}',
                      r'__NEXT_DATA__.{0,300}',
                  ]
                  seen=set()
                  for pat in patterns:
                      for m in re.finditer(pat,text,re.I):
                          frag=re.sub(r'\s+',' ',m.group(0)).strip()
                          if frag not in seen:
                              seen.add(frag)
                              out.append('HINT='+frag[:700])
                          if len(seen)>=30:
                              break
                      if len(seen)>=30:
                          break
                  # JS script srcs can reveal current endpoints.
                  for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',text,re.I):
                      out.append('SCRIPT='+urljoin(r.url,src))
                      if sum(1 for x in out if x.startswith('SCRIPT='))>=20:
                          break
              except Exception as e:
                  out.append('ERROR=%r' % e)

          path=Path('test-builds/kinokiste-live-diagnostic-2026.09.27.txt')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text('\n'.join(out),encoding='utf-8')
          PY

          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add test-builds/kinokiste-live-diagnostic-2026.09.27.txt
          git rm -f .diagnose-kinokiste-2026.09.27
          git rm -f .github/workflows/diagnose-kinokiste-2026.09.27.yml
          git commit -m "Diagnose current Kinokiste routes"
          git push
