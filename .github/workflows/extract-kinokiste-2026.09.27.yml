name: Extract current Kinokiste scraper

on:
  push:
    branches: [ main ]
    paths:
      - '.extract-kinokiste-2026.09.27'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract scraper
        shell: bash
        run: |
          set -euo pipefail
          unzip -p test-builds/plugin.video.xship-2026.09.24.103-SPEEDTEST-MOFLIX-MOVIE4K.zip             plugin.video.xship/scrapers/scrapers_source/de/kinokiste.py             > test-builds/kinokiste-current-2026.09.27.py.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test-builds/kinokiste-current-2026.09.27.py.txt')
          compile(p.read_text(encoding='utf-8'),str(p),'exec')
          print(p.stat().st_size)
          PY
          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add test-builds/kinokiste-current-2026.09.27.py.txt
          git rm -f .extract-kinokiste-2026.09.27
          git rm -f .github/workflows/extract-kinokiste-2026.09.27.yml
          git commit -m "Extract current Kinokiste scraper for diagnosis"
          git push
