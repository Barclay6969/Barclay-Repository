name: Build scraper core test 93

on:
  push:
    branches: [moflix-test-20260914]
    paths:
      - 'tools/moflix-test/patch_93.py'
      - 'tools/moflix-test/build_test93.py'
      - '.github/workflows/build-scrapercore-test93.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moflix-test-20260914
      - run: python3 tools/moflix-test/build_test93.py "$GITHUB_WORKSPACE"
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zips/test/plugin.video.xship-2026.09.14.93-SCRAPERCORETEST.zip
          git commit -m 'Build xShip 2026.09.14.93 scraper core test ZIP'
          git push origin HEAD:moflix-test-20260914
