name: Inspect TerrorLite 1.1.29 controls
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-terror-controls.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Identify included PVR OSD controls and file manager icons
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from xml.etree import ElementTree as ET
          p='zips/skin.terror.lite/skin.terror.lite-1.1.29.zip'
          with ZipFile(p) as z:
            print('SETTINGS ICONS')
            for n in z.namelist():
              if 'views/settings/' in n.lower():print(n)
            for n in z.namelist():
              if not n.endswith('.xml') or '/16x9/' not in n:continue
              s=z.read(n).decode('utf-8-sig','replace')
              if 'PVRVideoOSD' in s or 'id="808"' in s:
                print('MATCH FILE',n)
                root=ET.fromstring(s)
                for include in root.iter('include'):
                  if include.get('name')=='PVRVideoOSD':
                    print('PVRVideoOSD INCLUDE:')
                    print(ET.tostring(include,encoding='unicode')[:45000])
                lines=s.splitlines()
                for i,l in enumerate(lines):
                  if 'id="808"' in l or ('PVRVideoOSD' in l and 'name=' not in l):
                    print('NEAR',i+1, '\\n'.join(lines[max(0,i-7):i+15]))
          PY