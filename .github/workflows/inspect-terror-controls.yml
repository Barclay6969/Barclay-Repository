name: Inspect TerrorLite 1.1.29 controls
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-terror-controls.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Identify PVR focus and widget values
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from xml.etree import ElementTree as ET
          p='zips/skin.terror.lite/skin.terror.lite-1.1.29.zip'
          with ZipFile(p) as z:
            base='skin.terror.lite/'
            s=z.read(base+'16x9/Includes_LiveTV.xml').decode('utf-8-sig')
            root=ET.fromstring(s)
            include=root.find('./include[@name="PVRVideoOSD"]')
            print('PVRVideoOSD exists',include is not None)
            if include is not None:
              import xml.dom.minidom
              print(ET.tostring(include,encoding='unicode')[:25000])
            else:
              for line in s.splitlines():
                if '808' in line or 'PVRVideoOSD' in line:print(line)
            for name in ['16x9/Includes_Select.xml','16x9/Variables_Widgets.xml','16x9/Variables.xml','16x9/Includes_Widgets.xml']:
              s=z.read(base+name).decode('utf-8-sig')
              print('==========',name)
              for token in ['SelectWidgetOpacity','SelectWidgetCaseInfo','WidgetTransLabelVar','WidgetCaseInfoVar','WidgetCaseInfo','WidgetOpacity','widgetOpacity','widgetInfo']:
                start=0
                while True:
                  i=s.lower().find(token.lower(),start)
                  if i<0:break
                  print('TOKEN',token,'at',i)
                  print(s[max(0,i-250):i+750])
                  start=i+len(token)
                  if start>120000:break
                  if token.lower() in ('widgetinfo','widgetopacity'):break
          PY