name: Temporary inspect current xShip source

on:
  push:
    paths:
      - '.github/workflows/xship-inspect-current.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose archive and extract source
        shell: bash
        run: |
          set +e
          OUT=test-builds/_tmp_xship_diag.txt
          ZIP=test-builds/plugin.video.xship-2026.08.25.1-MEDIAINFO-GUARD-TEST.zip
          {
            echo 'PWD:'; pwd
            echo 'ZIP:'; ls -l "$ZIP"
            echo 'FILE:'; file "$ZIP"
            echo 'ARCHIVE TOP:'; unzip -l "$ZIP" | head -40
          } > "$OUT" 2>&1
          rm -rf /tmp/xship-inspect && mkdir -p /tmp/xship-inspect
          unzip -q "$ZIP" -d /tmp/xship-inspect >> "$OUT" 2>&1
          echo 'EXTRACTED:' >> "$OUT"
          find /tmp/xship-inspect -maxdepth 4 -type f | head -80 >> "$OUT" 2>&1
          SRC=$(find /tmp/xship-inspect -path '*/resources/lib/sources.py' -type f | head -1)
          echo "SRC=$SRC" >> "$OUT"
          if [ -n "$SRC" ]; then cp "$SRC" test-builds/_tmp_sources_2026.08.25.1.py; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT" test-builds/_tmp_sources_2026.08.25.1.py 2>/dev/null
          git commit -m 'Temporary diagnose current xShip archive'
          git push
