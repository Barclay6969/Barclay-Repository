name: Build xShip KinoGer TEST3

on:
  push:
    paths:
      - '.github/workflows/build-xship-kinoger-test3.yml'
      - 'tools/build_xship_kinoger_test3.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test ZIP
        run: python3 tools/build_xship_kinoger_test3.py
      - name: Compile check
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/verify140"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          unzip -q test-builds/plugin.video.xship-2026.10.05.140-KINOGER-TEST3.zip -d "$WORK"
          ROOT="$(find "$WORK" -type f -name addon.xml -printf '%h\n' | head -n1)"
          python3 -m py_compile "$ROOT/service.py" "$ROOT/scrapers/scrapers_source/de/kinoger.py"
      - name: Commit test ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add test-builds/plugin.video.xship-2026.10.05.140-KINOGER-TEST3.zip
          git commit -m "Build KinoGer TEST3 with sync lock to beer" || exit 0
          git push
