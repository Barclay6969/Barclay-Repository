name: Build xShip Einschalten Dood TLS test
on:
  push:
    paths:
      - '.github/workflows/xship-einschalten-dood-defaulttls-test.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix temporary patch version line
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test-builds/_patch_einschalten_257.py')
          lines=p.read_text('utf-8').splitlines()
          found=False
          for i,line in enumerate(lines):
              if line.startswith('a2,n=re.subn('):
                  lines[i] = '''a2,n=re.subn(r'version="[^"]+"', 'version="2026.08.25.7"', a, count=1)'''
                  found=True
                  break
          if not found:
              raise SystemExit('version line not found')
          p.write_text('\n'.join(lines)+'\n','utf-8')
          PY
      - name: Build test ZIP
        run: python3 test-builds/_patch_einschalten_257.py
      - name: Commit test ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-builds/plugin.video.xship-2026.08.25.7-EINSCHALTEN-DOOD-TLS-TEST.zip
          git commit -m 'Add xShip Einschalten Dood TLS test build'
          git push
