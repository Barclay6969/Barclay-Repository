name: Build series TEST4 v2

on:
  push:
    branches: [ main ]
    paths:
      - '.build-series-test4-v2'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile and build TEST4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil,tempfile,zipfile

          repo=Path.cwd()
          base_zip=repo/'test-builds/plugin.video.xship-2026.09.18.98.3-MEINECLOUD-TEST3.zip'
          out_zip=repo/'test-builds/plugin.video.xship-2026.09.18.98.4-SERIES-TEST4.zip'
          stage=repo/'tools/series-fix-test4'
          names=['kinoking.py','huhu.py','movie4k.py','burningseries.py','serienfans.py','hdfilme.py']

          if not base_zip.exists():
              raise SystemExit('Missing TEST3 base ZIP')

          for name in names:
              p=stage/name
              if not p.exists():
                  raise SystemExit('Missing staged provider: '+name)
              compile(p.read_text(encoding='utf-8'), str(p), 'exec')
              print('COMPILE OK',name)

          with tempfile.TemporaryDirectory() as td:
              td=Path(td)
              with zipfile.ZipFile(base_zip,'r') as zf:
                  zf.extractall(td)
              root=td/'plugin.video.xship'

              for name in names:
                  dst=root/'scrapers/scrapers_source/de'/name
                  if not dst.exists():
                      raise SystemExit('Target missing in base: '+name)
                  shutil.copyfile(stage/name,dst)

              addon=root/'addon.xml'
              text=addon.read_text(encoding='utf-8')
              if 'version="2026.09.18.98.3"' not in text:
                  raise SystemExit('Expected TEST3 version missing')
              text=text.replace('version="2026.09.18.98.3"','version="2026.09.18.98.4"',1)
              addon.write_text(text,encoding='utf-8',newline='\n')

              for cache in list(root.rglob('__pycache__')):
                  shutil.rmtree(cache,ignore_errors=True)
              for pyc in root.rglob('*.pyc'):
                  try: pyc.unlink()
                  except FileNotFoundError: pass

              if out_zip.exists():
                  out_zip.unlink()
              with zipfile.ZipFile(out_zip,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as zf:
                  for p in sorted(root.rglob('*')):
                      if p.is_file():
                          zf.write(p,p.relative_to(td).as_posix())

          with zipfile.ZipFile(out_zip,'r') as zf:
              if zf.testzip():
                  raise SystemExit('ZIP integrity check failed')
              addon=zf.read('plugin.video.xship/addon.xml').decode('utf-8')
              if 'version="2026.09.18.98.4"' not in addon:
                  raise SystemExit('Wrong addon version in TEST4')
              for name in names:
                  data=zf.read('plugin.video.xship/scrapers/scrapers_source/de/'+name).decode('utf-8')
                  compile(data,name,'exec')

          print('BUILT',out_zip)
          PY

      - name: Commit TEST4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .build-series-test4-v2
          git rm -f .github/workflows/build-series-test4-v2.yml
          git rm -f .build-series-test4 || true
          git rm -f .github/workflows/build-series-test4.yml || true
          git add test-builds/plugin.video.xship-2026.09.18.98.4-SERIES-TEST4.zip
          git commit -m "Build xShip series scraper TEST4"
          git push
