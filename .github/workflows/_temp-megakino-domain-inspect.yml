name: TEMP build xShip MegaKino domain test
on:
  push:
    paths:
      - '.github/workflows/_temp-megakino-domain-inspect.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build MegaKino domain test ZIP
        run: python3 test-builds/_temp_build_megakino_domain_test.py
      - name: Upload test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: xship-megakino-domain-test
          path: test-output/plugin.video.xship-2026.08.25.11.1-MEGAKINO-DOMAIN-TEST.zip
          if-no-files-found: error
          retention-days: 1
