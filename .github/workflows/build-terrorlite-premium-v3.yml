name: Build TerrorLite 1.1.25 Premium Icon V3 TEST
on:
  push:
    branches: [terrorlite-glossy-logos-test]
    paths:
      - 'tools/build_terrorlite_premium_v3.py'
      - '.github/workflows/build-terrorlite-premium-v3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated test branch
        uses: actions/checkout@v4
        with:
          ref: terrorlite-glossy-logos-test
          fetch-depth: 0
      - name: Install pinned Pillow
        run: python3 -m pip install --break-system-packages 'pillow==12.3.0'
      - name: Build installable V3 ZIP from proven 1.1.24
        run: python3 tools/build_terrorlite_premium_v3.py
      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TerrorLite-1.1.25-Premium-Icon-V3-TEST
          path: test-builds/skin.terror.lite-1.1.25-ICON-PREMIUM-TEST.zip
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Commit only isolated test package (never update production index)
        run: |
          git config user.name 'Barclay test bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test-builds/skin.terror.lite-1.1.25-ICON-PREMIUM-TEST.zip development/terrorlite-glossy/v3-build-report.txt
          git commit -m 'Build TerrorLite premium media icon V3 test [skip ci]' || exit 0
          git push origin HEAD:terrorlite-glossy-logos-test
