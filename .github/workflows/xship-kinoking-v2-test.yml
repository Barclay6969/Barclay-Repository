name: Build xShip KinoKing V2 test
on:
  push:
    paths:
      - '.github/workflows/xship-kinoking-v2-test.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build from 25.8 with KinoKing V2 parser only
        shell: bash
        run: |
          set -euo pipefail
          BASE='zips/plugin.video.xship/plugin.video.xship-2026.08.25.8.zip'
          OUT='test-builds/plugin.video.xship-2026.08.25.9-KINOKING-V2-TEST.zip'
          rm -rf /tmp/xship-kk-base /tmp/xship-kk-new
          mkdir -p /tmp/xship-kk-base /tmp/xship-kk-new
          unzip -q "$BASE" -d /tmp/xship-kk-base
          cp -a /tmp/xship-kk-base/. /tmp/xship-kk-new/
          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path('/tmp/xship-kk-new/plugin.video.xship')
          matches=list(root.rglob('kinoking.py'))
          if len(matches)!=1:
              raise SystemExit(f'Expected one kinoking.py, got {matches}')
          p=matches[0]
          s=p.read_text('utf-8')
          old='''                # Titel im alt-Attribut: onclick="playMovie(12324)"> ... alt="Inception"
                if season == 0:
                    pattern = r'onclick="playMovie\\((\\d+)\\)"'
                else:
                    pattern = r"onclick=\\\"playContent\\('\\d+'\\)\\\""
                results = []
                for m in re.finditer(pattern, sHtmlContent):
                    chunk = sHtmlContent[m.end():m.end() + 300]
                    alt_m = re.search(r'alt="([^"]+)"', chunk)
                    if alt_m:
                        results.append((m.group(1), alt_m.group(1)))
'''
          # The series pattern in the historical file contains a capture group; match
          # the exact source block with a regex to avoid quoting differences.
          block=re.compile(r'''                # Titel im alt-Attribut:.*?\n                if season == 0:\n                    pattern = .*?\n                else:\n                    pattern = .*?\n                results = \[\]\n                for m in re\.finditer\(pattern, sHtmlContent\):\n                    chunk = .*?\n                    alt_m = .*?\n                    if alt_m:\n                        results\.append\(\(m\.group\(1\), alt_m\.group\(1\)\)\)\n''', re.S)
          new='''                results = []
                if season == 0:
                    # KinoKing V2 (08/2026): movie cards no longer use playMovie().
                    # IDs/titles are exposed as data attributes on fav-data-source cards.
                    for card in re.findall(r'<[^>]+fav-data-source[^>]*>', sHtmlContent, re.I):
                        id_m = re.search(r'data-id="(\\d+)"', card, re.I)
                        type_m = re.search(r'data-type="([^"]+)"', card, re.I)
                        title_m = re.search(r'data-title="([^"]+)"', card, re.I)
                        if id_m and title_m and (not type_m or type_m.group(1).lower() == 'movie'):
                            results.append((id_m.group(1), title_m.group(1)))

                    # Compatibility fallback for the previous KinoKing markup.
                    if not results:
                        for m in re.finditer(r'onclick="playMovie\\((\\d+)\\)"', sHtmlContent):
                            chunk = sHtmlContent[m.end():m.end() + 300]
                            alt_m = re.search(r'alt="([^"]+)"', chunk)
                            if alt_m:
                                results.append((m.group(1), alt_m.group(1)))
                else:
                    # Keep the existing series parser unchanged.
                    pattern = r"onclick=\\\"playContent\\('(\\d+)'\\)\\\""
                    for m in re.finditer(pattern, sHtmlContent):
                        chunk = sHtmlContent[m.end():m.end() + 300]
                        alt_m = re.search(r'alt="([^"]+)"', chunk)
                        if alt_m:
                            results.append((m.group(1), alt_m.group(1)))
'''
          s2,n=block.subn(new,s,count=1)
          if n!=1:
              raise SystemExit('KinoKing search parser block not found')
          p.write_text(s2,'utf-8')

          addon=root/'addon.xml'
          a=addon.read_text('utf-8')
          a2,n=re.subn(r'(<addon\\b[^>]*?\\bversion=")[^"]+("[^>]*>)',r'\\g<1>2026.08.25.9\\2',a,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('Could not set addon version')
          addon.write_text(a2,'utf-8')
          PY

          # Validate the new parser against KinoKing's current live search markup.
          python3 - <<'PY'
          import re, requests
          h=requests.get('https://kinoking.cc/index.php?search=the+last+house',headers={'User-Agent':'Mozilla/5.0'},timeout=20).text
          results=[]
          for card in re.findall(r'<[^>]+fav-data-source[^>]*>', h, re.I):
              i=re.search(r'data-id="(\d+)"',card,re.I)
              t=re.search(r'data-title="([^"]+)"',card,re.I)
              ty=re.search(r'data-type="([^"]+)"',card,re.I)
              if i and t and (not ty or ty.group(1).lower()=='movie'):
                  results.append((i.group(1),t.group(1)))
          print('KINOKING LIVE RESULTS',results[:10])
          assert ('63514','The Last House') in results
          PY

          python3 -m compileall -q /tmp/xship-kk-new/plugin.video.xship
          python3 - <<'PY'
          from pathlib import Path
          base=Path('/tmp/xship-kk-base/plugin.video.xship')
          new=Path('/tmp/xship-kk-new/plugin.video.xship')
          changed=[]
          for bp in base.rglob('*'):
              if bp.is_file():
                  rel=bp.relative_to(base)
                  np=new/rel
                  if not np.exists() or bp.read_bytes()!=np.read_bytes(): changed.append(str(rel))
          print('CHANGED',changed)
          assert len(changed)==2, changed
          assert 'addon.xml' in changed
          assert any(x.endswith('kinoking.py') for x in changed)
          PY
          rm -f "$OUT"
          (cd /tmp/xship-kk-new && zip -qr "$GITHUB_WORKSPACE/$OUT" plugin.video.xship)
          unzip -t "$OUT" >/dev/null
      - name: Commit test ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-builds/plugin.video.xship-2026.08.25.9-KINOKING-V2-TEST.zip
          git commit -m 'Add xShip KinoKing V2 test build'
          git push
