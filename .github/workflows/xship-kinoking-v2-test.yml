name: Build xShip KinoKing V2 test
on:
  push:
    paths:
      - '.github/workflows/xship-kinoking-v2-test.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test ZIP
        run: python3 test-builds/_patch_kinoking_259.py
      - name: Commit test ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-builds/plugin.video.xship-2026.08.25.9-KINOKING-V2-TEST.zip
          git commit -m 'Add xShip KinoKing V2 test build'
          git push
