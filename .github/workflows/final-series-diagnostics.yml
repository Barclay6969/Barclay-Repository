name: Final series diagnostics

on:
  push:
    branches: [ main ]
    paths:
      - '.final-series-diagnostics'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe final series cases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,urllib.request,urllib.parse

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
          def get(url, headers=None):
              h={'User-Agent':UA,'Accept-Language':'de-DE,de;q=0.9,en;q=0.8'}
              if headers: h.update(headers)
              req=urllib.request.Request(url,headers=h)
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      return r.status,r.geturl(),r.read().decode('utf-8','replace')
              except Exception as e:
                  return 'ERR',url,str(e)
          def post_json(url,obj):
              data=json.dumps(obj).encode('utf-8')
              req=urllib.request.Request(url,data=data,headers={
                  'User-Agent':UA,
                  'Content-Type':'application/json; charset=utf-8',
                  'Origin':'https://www.huhu.to',
                  'Referer':'https://www.huhu.to/'
              },method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      return r.status,r.geturl(),r.read().decode('utf-8','replace')
              except Exception as e:
                  return 'ERR',url,str(e)

          out=[]

          # Huhu new API
          for typ,payload in [
              ('HUHU_SERIES',{'language':'de','region':'DE','type':'series','ids':{'tmdb_id':108978},'name':'','episode':{'ids':{},'season':1,'episode':1}}),
              ('HUHU_MOVIE',{'language':'de','region':'DE','type':'movie','ids':{'tmdb_id':297802},'name':''}),
          ]:
              s,u,b=post_json('https://www.huhu.to/mediaurl-source.json',payload)
              out += [f'=== {typ} ===',f'STATUS={s}',f'FINAL={u}',f'BODY={b[:12000]}','']

          # Movie4K exact Reacher watch endpoints
          for mid in ['643e5747c25d772f115ca1be','6488430e62ab3aeb9094843a']:
              for path in ['/data/watch/?_id=','/data/watch?_id=']:
                  s,u,b=get('https://movie4k.sx'+path+mid,{'Accept':'application/json, text/plain, */*','Referer':'https://movie4k.sx/','Origin':'https://movie4k.sx','X-Requested-With':'XMLHttpRequest'})
                  out += [f'=== MOVIE4K {mid} {path} ===',f'STATUS={s}',f'LEN={len(b)}',f'BODY={b[:12000]}','']

          # Parse HDFilme search to find all Reacher season URLs, then inspect S1
          s,u,b=get('https://hd-filme.lol/index.php?do=search&subaction=search&story=Reacher')
          out += ['=== HDFILME SEARCH ===',f'STATUS={s}']
          urls=[]
          if s==200:
              for m in re.finditer(r'<a[^>]+href=["\']([^"\']+)["\'][^>]+title=["\']([^"\']*Reacher[^"\']*)["\']',b,re.I):
                  url,title=m.groups()
                  if (url,title) not in urls: urls.append((url,title))
              out.append('RESULTS='+json.dumps(urls,ensure_ascii=False))
              s1=[x for x in urls if re.search(r'Staffel\s*1\b',x[1],re.I)]
              if s1:
                  url=urllib.parse.urljoin(u,s1[0][0])
                  st,fu,html=get(url)
                  out += [f'S1_URL={url}',f'S1_STATUS={st}',f'S1_LEN={len(html)}']
                  for needle in ['Episoden','episode','ep1','pmovie__select-items','link=','data-link','iframe','serial','meinecloud']:
                      out.append(f'{needle}_COUNT={html.lower().count(needle.lower())}')
                      pos=html.lower().find(needle.lower())
                      if pos>=0:
                          out.append(f'[{needle}] '+re.sub(r'\s+',' ',html[max(0,pos-1200):pos+5000])[:6200])
          out.append('')

          Path('test-builds/final-series-diagnostic.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .final-series-diagnostics
          git rm -f .github/workflows/final-series-diagnostics.yml
          git add test-builds/final-series-diagnostic.txt
          git commit -m "Run final series provider diagnostics"
          git push
