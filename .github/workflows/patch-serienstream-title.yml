name: Inspect xShip SerienStream scraper

on:
  push:
    paths:
      - '.github/workflows/patch-serienstream-title.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print current SerienStream scraper
        shell: python
        run: |
          import pathlib, zipfile
          zp = pathlib.Path('zips/plugin.video.xship/plugin.video.xship-2026.07.02.zip')
          with zipfile.ZipFile(zp) as zf:
              matches = [n for n in zf.namelist() if n.lower().endswith('/serienstream.py') or n.lower() == 'serienstream.py']
              if not matches:
                  raise SystemExit('serienstream.py not found')
              for name in matches:
                  print('===== ' + name + ' =====')
                  print(zf.read(name).decode('utf-8'))
