name: Patch xShip SerienStream direct slug fallback

on:
  push:
    paths:
      - 'tools/patch_serienstream_slug.py'
      - '.github/workflows/patch-serienstream-title.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build patched xShip
        run: python tools/patch_serienstream_slug.py
      - name: Commit patched package
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add zips/plugin.video.xship zips/addons.xml zips/addons.xml.md5
          git commit -m "Add SerienStream direct slug fallback in xShip 2026.07.04"
          git push
