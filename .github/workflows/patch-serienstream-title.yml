name: Patch xShip SerienStream resolver

on:
  push:
    paths:
      - 'tools/patch_serienstream_slug.py'
      - '.github/workflows/patch-serienstream-title.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect or build xShip SerienStream patch
        run: python tools/patch_serienstream_slug.py
      - name: Commit generated output
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/serienstream_2026.07.07_extracted.py zips/plugin.video.xship zips/addons.xml zips/addons.xml.md5 2>/dev/null || true
          git commit -m "Capture xShip 2026.07.07 SerienStream scraper" || exit 0
          git push
