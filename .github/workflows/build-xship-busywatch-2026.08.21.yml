name: Build xShip Busy watchdog local test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-xship-busywatch-2026.08.21.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Busy watchdog test from current xShip 2026.08.21.3
        shell: bash
        run: |
          set -euo pipefail
          BASE='zips/plugin.video.xship/plugin.video.xship-2026.08.21.3.zip'
          WORK="$RUNNER_TEMP/xship-busywatch"
          ROOT="$WORK/plugin.video.xship"
          OUT='test-builds/plugin.video.xship-2026.08.21.5-BUSYWATCH.zip'
          export ROOT

          test -f "$BASE"
          rm -rf "$WORK"
          mkdir -p "$WORK" test-builds
          unzip -q "$BASE" -d "$WORK"

          python3 - <<'PY'
          from pathlib import Path
          import os, re

          root = Path(os.environ['ROOT'])

          addon = root / 'addon.xml'
          s = addon.read_text(encoding='utf-8')
          s, n = re.subn(r'(<addon\b[^>]*\bversion=")[^"]+("[^>]*>)',
                         r'\g<1>2026.08.21.5-BUSYWATCH\2', s, count=1)
          if n != 1:
              raise SystemExit('addon version not found')
          addon.write_text(s, encoding='utf-8', newline='\n')

          # 1) Sources: use the native Kodi busy window instead of control.busy().
          src = root / 'resources/lib/sources.py'
          s = src.read_text(encoding='utf-8')
          s, native_count = re.subn(
              r'if\s+not\s+control\.visible\(\)\s*:\s*control\.busy\(\)|control\.busy\(\)',
              "control.execute('ActivateWindow(busydialognocancel)')",
              s
          )

          # Add a visible diagnostic marker directly before player handoff(s).
          # This tells us whether the VOE path actually reaches this code.
          marker = "control.execute('Notification(xShip,Stream wird gestartet...,1800)')\n"
          lines = s.splitlines(True)
          out = []
          handoff_count = 0
          for line in lines:
              if 'player().run(' in line and 'Notification(xShip,Stream wird gestartet' not in ''.join(out[-2:]):
                  indent = line[:len(line)-len(line.lstrip())]
                  out.append(indent + marker)
                  out.append(indent + "control.execute('ActivateWindow(busydialognocancel)')\n")
                  handoff_count += 1
              out.append(line)
          s = ''.join(out)
          src.write_text(s, encoding='utf-8', newline='\n')

          # 2) Player: a background watchdog re-opens Kodi's busy dialog after
          # setResolvedUrl/control.resolve closes it, until real playback starts.
          player = root / 'resources/lib/player.py'
          p = player.read_text(encoding='utf-8')

          watch_method = '''    def _xshipBusyWatch(self):\n        try:\n            import threading\n            import time\n\n            def _watch():\n                # Kodi can close busydialognocancel immediately after setResolvedUrl.\n                # Re-open it for up to 20 seconds, stopping as soon as AV playback starts.\n                for _ in range(100):\n                    try:\n                        if getattr(self, '_av_started', False) or self.isPlayingVideo():\n                            break\n                    except:\n                        pass\n                    try:\n                        control.execute('ActivateWindow(busydialognocancel)')\n                    except:\n                        pass\n                    time.sleep(0.20)\n                try:\n                    control.execute('Dialog.Close(busydialognocancel)')\n                except:\n                    pass\n\n            t = threading.Thread(target=_watch, name='xShipBusyWatch')\n            t.daemon = True\n            t.start()\n        except:\n            pass\n\n'''

          if 'def _xshipBusyWatch(self):' not in p:
              anchor = re.search(r'(?m)^    def _openStartupBusy\(self\):', p)
              if anchor:
                  p = p[:anchor.start()] + watch_method + p[anchor.start():]
              else:
                  # Fallback: add before the first normal class method after __init__.
                  anchor = re.search(r'(?m)^    def [A-Za-z_][A-Za-z0-9_]*\(self[^\n]*\):', p)
                  if not anchor:
                      raise SystemExit('Could not find player method anchor')
                  p = p[:anchor.start()] + watch_method + p[anchor.start():]

          # Replace existing busy calls with the explicit native window.
          p, player_native_count = re.subn(
              r'if\s+not\s+control\.visible\(\)\s*:\s*control\.busy\(\)|control\.busy\(\)',
              "control.execute('ActivateWindow(busydialognocancel)')",
              p
          )

          # Start the watchdog immediately before the actual Kodi resolved-URL handoff.
          handoff_injected = 0
          patterns = [
              r'(?m)^(\s*)(control\.resolve\s*\()',
              r'(?m)^(\s*)(xbmcplugin\.setResolvedUrl\s*\()'
          ]
          for pat in patterns:
              def repl(m):
                  nonlocal_dummy = None
                  return m.group(1) + 'self._xshipBusyWatch()\n' + m.group(1) + m.group(2)
              p, cnt = re.subn(pat, repl, p)
              handoff_injected += cnt

          # If the player wraps the handoff differently, attach the watchdog to
          # the existing startup-busy call instead.
          if handoff_injected == 0 and 'self._openStartupBusy()' in p:
              p = p.replace('self._openStartupBusy()', 'self._openStartupBusy()\n        self._xshipBusyWatch()', 1)
              handoff_injected = 1

          if handoff_injected == 0:
              raise SystemExit('Could not locate resolved URL handoff in player.py')

          player.write_text(p, encoding='utf-8', newline='\n')

          print('sources native busy replacements:', native_count)
          print('sources player handoff markers:', handoff_count)
          print('player native busy replacements:', player_native_count)
          print('player watchdog handoffs:', handoff_injected)
          if handoff_count < 1:
              raise SystemExit('No player().run handoff found in sources.py')
          PY

          python3 -m py_compile "$ROOT/resources/lib/sources.py" "$ROOT/resources/lib/player.py"
          grep -q 'version="2026.08.21.5-BUSYWATCH"' "$ROOT/addon.xml"
          grep -q 'def _xshipBusyWatch' "$ROOT/resources/lib/player.py"
          grep -q 'Notification(xShip,Stream wird gestartet' "$ROOT/resources/lib/sources.py"

          rm -f "$OUT"
          (cd "$WORK" && zip -qr "$GITHUB_WORKSPACE/$OUT" plugin.video.xship)
          unzip -t "$OUT" >/dev/null

      - name: Commit local test ZIP only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-builds/plugin.video.xship-2026.08.21.5-BUSYWATCH.zip
          git diff --cached --quiet && exit 0
          git commit -m 'Add xShip 2026.08.21.5 Busy watchdog local test'
          git push
