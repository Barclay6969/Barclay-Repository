name: Inspect final provider details

on:
  push:
    branches: [ main ]
    paths:
      - '.inspect-final-provider-details'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe exact series structures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,urllib.request,urllib.parse

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept-Language':'de-DE,de;q=0.9,en;q=0.8'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      return r.status,r.geturl(),r.read().decode('utf-8','replace')
              except Exception as e:
                  return 'ERR',url,str(e)

          out=[]

          # KinoKing exact season 1 page + navigation API
          st,fu,html=get('https://kinoking.cc/series.php?id=196&season=1')
          out += ['=== KINOKING S1 ===',f'STATUS={st}',f'FINAL={fu}',f'LEN={len(html)}']
          if st==200:
              rows=re.findall(r'(?is)<div[^>]+id=["\']ep-row-[^>]+.*?(?=<div[^>]+id=["\']ep-row-|</main>|</section>)',html)
              out.append('ROWS='+str(len(rows)))
              ids=[]
              for row in rows[:10]:
                  m=re.search(r"playEpisode\(['\"]?(\d+)",row,re.I)
                  txt=re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',row)).strip()
                  if m: ids.append(m.group(1))
                  out.append('ROW='+json.dumps({'id':m.group(1) if m else None,'text':txt[:500]},ensure_ascii=False))
              # generic context around episode function
              for needle in ['function playEpisode','playEpisode(','episode-navigation','fetch(']:
                  p=html.find(needle)
                  if p>=0:
                      out.append('CTX '+needle+'='+re.sub(r'\s+',' ',html[max(0,p-800):p+3000])[:3800])
              if ids:
                  st2,fu2,body=get('https://kinoking.cc/api/episode-navigation.php?episode_id='+ids[0])
                  out += [f'NAV_STATUS={st2}',f'NAV_FINAL={fu2}',f'NAV_BODY={body[:5000]}']

          # HDFilme search pages, find Reacher season pages.
          for pg in [1,2,3]:
              url='https://hd-filme.lol/index.php?do=search&subaction=search&search_start=%d&full_search=0&result_from=%d&titleonly=3&story=Reacher' % (pg, (pg-1)*10+1)
              st,fu,body=get(url)
              out += [f'=== HDFILME SEARCH PAGE {pg} ===',f'STATUS={st}',f'FINAL={fu}',f'LEN={len(body)}']
              if st==200:
                  cards=[]
                  for m in re.finditer(r'(?is)<div class="box-product.*?</li>',body):
                      block=m.group(0)
                      hm=re.search(r'href="([^"]+)"[^>]+title="([^"]+)"',block)
                      if hm and 'reacher' in hm.group(2).lower():
                          cards.append((hm.group(1),hm.group(2)))
                  out.append('REACHER='+json.dumps(cards,ensure_ascii=False))

          # Known/guessed HDFilme Reacher pages from site search: discover all hrefs then inspect Staffel 1.
          st,fu,body=get('https://hd-filme.lol/index.php?do=search&subaction=search&full_search=1&story=Reacher')
          if st==200:
              pairs=[]
              for href,title in re.findall(r'href="([^"]+)"[^>]+title="([^"]*Reacher[^"]*)"',body,re.I):
                  if (href,title) not in pairs: pairs.append((href,title))
              out += ['=== HDFILME FULLSEARCH ===','PAIRS='+json.dumps(pairs[:30],ensure_ascii=False)]
              s1=[x for x in pairs if re.search(r'Staffel\s*1\b',x[1],re.I)]
              if s1:
                  st3,fu3,phtml=get(s1[0][0])
                  out += [f'S1_STATUS={st3}',f'S1_URL={fu3}',f'S1_LEN={len(phtml)}']
                  for needle in ['Episoden 1','Episode 1','ep1','serial','meinecloud','link=','data-link','player']:
                      p=phtml.lower().find(needle.lower())
                      if p>=0:
                          out.append('S1CTX '+needle+'='+re.sub(r'\s+',' ',phtml[max(0,p-1200):p+4200])[:5400])

          # BurningSeries exact Reacher episode page
          st,fu,body=get('https://burningseries.ac/serie/Reacher-2022/1')
          out += ['=== BURNING REACHER S1 ===',f'STATUS={st}',f'FINAL={fu}',f'LEN={len(body)}']
          if st==200:
              for needle in ['episodes','episode-1','/1-','hoster','folge']:
                  p=body.lower().find(needle.lower())
                  if p>=0:
                      out.append('CTX '+needle+'='+re.sub(r'\s+',' ',body[max(0,p-1000):p+4000])[:5000])

          Path('test-builds/final-provider-details.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .inspect-final-provider-details
          git rm -f .github/workflows/inspect-final-provider-details.yml
          git add test-builds/final-provider-details.txt
          git commit -m "Inspect final provider details"
          git push
