name: Publish SerienStream 1.0.14 HQ

on:
  push:
    paths:
      - '.github/workflows/publish-serienstream-114.yml'
      - 'assets/serienstream_icon_original_1536.jpg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build SerienStream 1.0.14 with original-resolution logo
        shell: bash
        run: |
          set -euo pipefail
          BASE='zips/plugin.video.serienstream/plugin.video.serienstream-1.0.13.zip'
          OUT='zips/plugin.video.serienstream/plugin.video.serienstream-1.0.14.zip'
          WORK="$RUNNER_TEMP/serienstream114"

          rm -rf "$WORK"
          mkdir -p "$WORK"
          unzip -q "$BASE" -d "$WORK"

          ROOT="$(find "$WORK" -type f -name addon.xml -printf '%h\n' | head -n1)"
          export ROOT OUT

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, re, shutil, struct, zipfile

          root = Path(os.environ['ROOT'])
          out = Path(os.environ['OUT'])
          src_icon = Path('assets/serienstream_icon_original_1536.jpg')
          addon = root / 'addon.xml'

          data = src_icon.read_bytes()
          assert data[:2] == b'\xff\xd8', 'Logo is not JPEG'

          def jpeg_size(buf):
              p = 2
              sof = {0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}
              while p + 9 < len(buf):
                  if buf[p] != 0xFF:
                      p += 1
                      continue
                  while p < len(buf) and buf[p] == 0xFF:
                      p += 1
                  if p >= len(buf):
                      break
                  marker = buf[p]
                  p += 1
                  if marker in (0xD8,0xD9) or 0xD0 <= marker <= 0xD7:
                      continue
                  if p + 1 >= len(buf):
                      break
                  ln = (buf[p] << 8) | buf[p+1]
                  if marker in sof:
                      h = (buf[p+3] << 8) | buf[p+4]
                      w = (buf[p+5] << 8) | buf[p+6]
                      return w, h
                  p += ln
              raise AssertionError('JPEG dimensions not found')

          assert jpeg_size(data) == (1536, 1536), jpeg_size(data)

          text = addon.read_text(encoding='utf-8-sig')
          text, n = re.subn(
              r'(<addon\s+id="plugin\.video\.serienstream"\s+name="SerienStream"\s+version=")[^"]+(")',
              r'\g<1>1.0.14\2', text, count=1)
          assert n == 1
          text, n = re.subn(r'provider-name="[^"]*"', 'provider-name="Barclay (Kusi)"', text, count=1)
          assert n == 1
          text, n = re.subn(r'<icon>[^<]+</icon>', '<icon>resources/icon.jpg</icon>', text, count=1)
          assert n == 1
          addon.write_text(text, encoding='utf-8', newline='\n')

          # Remove the old low-resolution PNGs so no skin can fall back to them.
          for old in (root / 'resources' / 'icon.png', root / 'icon.png'):
              old.unlink(missing_ok=True)

          # Keep the exact original JPEG bytes, full 1536x1536, at both common add-on paths.
          (root / 'resources').mkdir(parents=True, exist_ok=True)
          shutil.copy2(src_icon, root / 'resources' / 'icon.jpg')
          shutil.copy2(src_icon, root / 'icon.jpg')

          # Repository-side artwork: same exact original bytes, no resize/re-encode.
          repo_dir = Path('zips/plugin.video.serienstream')
          (repo_dir / 'resources').mkdir(parents=True, exist_ok=True)
          for old in (repo_dir / 'resources' / 'icon.png', repo_dir / 'icon.png'):
              old.unlink(missing_ok=True)
          shutil.copy2(src_icon, repo_dir / 'resources' / 'icon.jpg')
          shutil.copy2(src_icon, repo_dir / 'icon.jpg')

          out.parent.mkdir(parents=True, exist_ok=True)
          if out.exists():
              out.unlink()
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as zf:
              for f in sorted(root.rglob('*')):
                  if f.is_file():
                      zf.write(f, Path('plugin.video.serienstream') / f.relative_to(root))

          expected = hashlib.sha256(src_icon.read_bytes()).hexdigest()
          with zipfile.ZipFile(out, 'r') as zf:
              addon_text = zf.read('plugin.video.serienstream/addon.xml').decode('utf-8')
              icon_res = zf.read('plugin.video.serienstream/resources/icon.jpg')
              icon_root = zf.read('plugin.video.serienstream/icon.jpg')
              names = set(zf.namelist())

          assert 'version="1.0.14"' in addon_text
          assert 'provider-name="Barclay (Kusi)"' in addon_text
          assert '<icon>resources/icon.jpg</icon>' in addon_text
          assert 'plugin.video.serienstream/resources/icon.png' not in names
          assert 'plugin.video.serienstream/icon.png' not in names
          assert hashlib.sha256(icon_res).hexdigest() == expected
          assert hashlib.sha256(icon_root).hexdigest() == expected
          assert jpeg_size(icon_res) == (1536, 1536)
          assert jpeg_size(icon_root) == (1536, 1536)
          print('Verified original logo SHA256:', expected)
          print('Verified dimensions: 1536x1536')
          print('Built', out)
          PY

      - name: Rebuild repository metadata
        run: python3 tools/make_repo.py

      - name: Verify repository feed and artwork
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<addon id="plugin.video.serienstream" name="SerienStream" version="1.0.14" provider-name="Barclay (Kusi)"' zips/addons.xml
          grep -q '<icon>resources/icon.jpg</icon>' zips/addons.xml
          test -s zips/addons.xml.md5
          test -s zips/plugin.video.serienstream/plugin.video.serienstream-1.0.14.zip
          test -s zips/plugin.video.serienstream/resources/icon.jpg
          test -s zips/plugin.video.serienstream/icon.jpg
          test ! -e zips/plugin.video.serienstream/resources/icon.png
          test ! -e zips/plugin.video.serienstream/icon.png

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A \
            zips/plugin.video.serienstream \
            zips/addons.xml \
            zips/addons.xml.md5 \
            zips/repository.barclay
          git commit -m "Release SerienStream 1.0.14 with original 1536px logo" || exit 0
          git push
