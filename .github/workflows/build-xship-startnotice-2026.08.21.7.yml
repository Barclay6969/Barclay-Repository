name: Build installable xShip VOE diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-xship-startnotice-2026.08.21.7.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build installable VOE diagnostics ZIP
        shell: bash
        run: |
          set -euo pipefail
          BASE='test-builds/plugin.video.xship-2026.08.21.10-SERIESVOE.zip'
          WORK="$RUNNER_TEMP/xship-voe-diag-installable"
          ROOT="$WORK/plugin.video.xship"
          OUT='test-builds/plugin.video.xship-2026.08.21.11-VOEDIAG.zip'
          export ROOT

          test -f "$BASE"
          rm -rf "$WORK"
          mkdir -p "$WORK" test-builds
          unzip -q "$BASE" -d "$WORK"
          test -f "$ROOT/addon.xml"

          python3 - <<'PY'
          from pathlib import Path
          import os, re

          root = Path(os.environ['ROOT'])
          addon = root / 'addon.xml'
          s = addon.read_text(encoding='utf-8')
          s, n = re.subn(r'(<addon\b[^>]*\bversion=")[^"]+("[^>]*>)', r'\g<1>2026.08.21.11-VOEDIAG\2', s, count=1)
          if n != 1:
              raise SystemExit('addon version not found')
          addon.write_text(s, encoding='utf-8', newline='\n')

          matches = []
          for p in root.rglob('*.py'):
              try:
                  text = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              if 'VOE direkt aufgeloest' in text and "data.get('direct_access_url')" in text:
                  matches.append((p, text))
          if len(matches) != 1:
              raise SystemExit('Expected one VOE resolver file, got %d' % len(matches))

          p, text = matches[0]
          anchor = "            media_url = data.get('direct_access_url') or data.get('source') or data.get('file')\n"
          diag = """            log_utils.log('[VOE-DIAG] file=%s' % str(data.get('file')), log_utils.LOGINFO)
            log_utils.log('[VOE-DIAG] source=%s' % str(data.get('source')), log_utils.LOGINFO)
            log_utils.log('[VOE-DIAG] direct_access_url=%s' % str(data.get('direct_access_url')), log_utils.LOGINFO)
"""
          if anchor not in text:
              raise SystemExit('VOE media selection anchor not found')
          text = text.replace(anchor, diag + anchor, 1)
          p.write_text(text, encoding='utf-8', newline='\n')
          compile(text, str(p), 'exec')
          print('Patched', p)
          PY

          python3 -m compileall -q "$ROOT"
          grep -q 'version="2026.08.21.11-VOEDIAG"' "$ROOT/addon.xml"
          grep -R -q '\[VOE-DIAG\] direct_access_url=' "$ROOT"

          rm -f "$OUT"
          (cd "$WORK" && zip -qr "$GITHUB_WORKSPACE/$OUT" plugin.video.xship)
          unzip -t "$OUT" >/dev/null
          first=$(unzip -Z1 "$OUT" | head -n1)
          case "$first" in plugin.video.xship/*) ;; *) echo "Bad ZIP root: $first"; exit 1;; esac

      - name: Commit diagnostic ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-builds/plugin.video.xship-2026.08.21.11-VOEDIAG.zip
          git diff --cached --quiet && exit 0
          git commit -m 'Add installable xShip 2026.08.21.11 VOE diagnostics test'
          git push
