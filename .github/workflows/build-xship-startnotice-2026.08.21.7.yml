name: Build clean xShip 2026.08.21.10 release ZIP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-xship-startnotice-2026.08.21.7.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repack tested SERIESVOE build as clean 2026.08.21.10
        shell: bash
        run: |
          set -euo pipefail
          BASE='test-builds/plugin.video.xship-2026.08.21.10-SERIESVOE.zip'
          WORK="$RUNNER_TEMP/xship-release-10"
          ROOT="$WORK/plugin.video.xship"
          OUT='test-builds/plugin.video.xship-2026.08.21.10-RELEASE.zip'
          export ROOT

          test -f "$BASE"
          rm -rf "$WORK"
          mkdir -p "$WORK" test-builds
          unzip -q "$BASE" -d "$WORK"

          python3 - <<'PY'
          from pathlib import Path
          import os, re
          root = Path(os.environ['ROOT'])
          addon = root / 'addon.xml'
          s = addon.read_text(encoding='utf-8')
          s, n = re.subn(r'(<addon\b[^>]*\bversion=")[^"]+("[^>]*>)', r'\g<1>2026.08.21.10\2', s, count=1)
          if n != 1:
              raise SystemExit('addon version not found')
          addon.write_text(s, encoding='utf-8', newline='\n')
          ss = next(root.rglob('serienstream.py')).read_text(encoding='utf-8')
          if 'Raw search title variants' not in ss:
              raise SystemExit('SerienStream title fix missing')
          sources = (root / 'resources/lib/sources.py').read_text(encoding='utf-8')
          if 'from html import unescape as html_unescape' not in sources:
              raise SystemExit('VOE html_unescape fix missing')
          if '[VOE-DIAG]' in sources:
              raise SystemExit('VOE diagnostic patch unexpectedly present')
          compile(ss, 'serienstream.py', 'exec')
          compile(sources, 'sources.py', 'exec')
          PY

          rm -f "$OUT"
          (cd "$WORK" && zip -qr "$GITHUB_WORKSPACE/$OUT" plugin.video.xship)
          unzip -t "$OUT" >/dev/null
          unzip -p "$OUT" plugin.video.xship/addon.xml | grep -q 'version="2026.08.21.10"'

      - name: Commit release candidate ZIP only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-builds/plugin.video.xship-2026.08.21.10-RELEASE.zip
          git diff --cached --quiet && exit 0
          git commit -m 'Add clean xShip 2026.08.21.10 release ZIP'
          git push

