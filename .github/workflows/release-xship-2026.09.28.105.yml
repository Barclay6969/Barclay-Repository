name: Release xShip 2026.09.28.105

on:
  push:
    branches: [ main ]
    paths:
      - '.release/xship-2026.09.28.105.trigger'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish xShip 2026.09.28.105
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, zipfile, shutil

          src = Path('test-builds/plugin.video.xship-2026.09.28.105-MEINECLOUD-TOKENAPI-TEST1.zip')
          dst = Path('zips/plugin.video.xship/plugin.video.xship-2026.09.28.105.zip')
          addons = Path('zips/addons.xml')
          md5file = Path('zips/addons.xml.md5')

          if not src.exists():
              raise SystemExit('TEST1 source ZIP missing')

          # Verify the tested ZIP is exactly the intended production version.
          with zipfile.ZipFile(src, 'r') as zf:
              if zf.testzip() is not None:
                  raise SystemExit('TEST1 ZIP is corrupt')
              addon_xml = zf.read('plugin.video.xship/addon.xml').decode('utf-8')
              if 'version="2026.09.28.105"' not in addon_xml:
                  raise SystemExit('TEST1 ZIP is not version 2026.09.28.105')

          dst.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(src, dst)

          text = addons.read_text(encoding='utf-8')
          old = '<addon id="plugin.video.xship" version="2026.09.27.104"'
          new = '<addon id="plugin.video.xship" version="2026.09.28.105"'
          if old not in text:
              raise SystemExit('Current xShip .104 entry not found in addons.xml')
          text = text.replace(old, new, 1)

          addon_start = text.index('<addon id="plugin.video.xship"')
          addon_end = text.index('</addon>', addon_start) + len('</addon>')
          block = text[addon_start:addon_end]

          marker = '<news>'
          if marker not in block:
              raise SystemExit('xShip news block not found')

          news = (
              '2026.09.28.105\n'
              '  - MeineCloud: Filmquellen an die neue DeVideoSRC-/Token-API angepasst; Filme liefern wieder funktionierende Quellen.\n'
              '  - Der Fix betrifft bewusst den Film-Pfad. Die spaeter getesteten DropLoad-/Serien-Experimente sind nicht Bestandteil dieses Releases.\n'
              '  \n'
          )
          block = block.replace(marker, marker + news, 1)
          text = text[:addon_start] + block + text[addon_end:]
          addons.write_text(text, encoding='utf-8', newline='\n')

          digest = hashlib.md5(addons.read_bytes()).hexdigest()
          md5file.write_text(digest, encoding='ascii')

          # Final sanity checks.
          with zipfile.ZipFile(dst, 'r') as zf:
              assert zf.testzip() is None
              addon_xml = zf.read('plugin.video.xship/addon.xml').decode('utf-8')
              assert 'version="2026.09.28.105"' in addon_xml
          final = addons.read_text(encoding='utf-8')
          assert '<addon id="plugin.video.xship" version="2026.09.28.105"' in final
          assert 'MeineCloud: Filmquellen an die neue DeVideoSRC-/Token-API angepasst' in final
          print('Release ZIP:', dst)
          print('addons.xml MD5:', digest)
          PY

          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add             zips/plugin.video.xship/plugin.video.xship-2026.09.28.105.zip             zips/addons.xml             zips/addons.xml.md5
          git commit -m "Release xShip 2026.09.28.105 MeineCloud movie fix"
          git push
