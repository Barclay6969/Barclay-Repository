name: TEMP release xShip 2026.08.28.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temp-release-xship-2026.08.28.1.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Finalize xShip 2026.08.28.1 feed and ZIP
        shell: python
        run: |
          from pathlib import Path
          import hashlib, io, re, zipfile
          import xml.etree.ElementTree as ET

          zip_path = Path('zips/plugin.video.xship/plugin.video.xship-2026.08.28.1.zip')
          feed_path = Path('zips/addons.xml')
          md5_path = Path('zips/addons.xml.md5')

          if not zip_path.exists():
              raise SystemExit('Release ZIP missing: ' + str(zip_path))

          feed = feed_path.read_text(encoding='utf-8')
          old = '<addon id="plugin.video.xship" version="2026.08.25.12" name="xShip" provider-name="Kusi (Barclay)">'
          new = '<addon id="plugin.video.xship" version="2026.08.28.1" name="xShip" provider-name="Kusi (Barclay)">'
          if old not in feed and new not in feed:
              raise SystemExit('Expected xShip version marker not found in addons.xml')
          if old in feed:
              feed = feed.replace(old, new, 1)

          release_news = (
              '2026.08.28.1\n'
              '- Automatische Provider-Domainverwaltung fuer weitere wechselnde Indexseiten erweitert.\n'
              '- FHD Filme: bekannte Domainmigration hdfilme.my / hdfilme.blog -> hdfilme.win.\n'
              '- StreamCloud: bekannte Domainmigration streamcloud.my -> streamcloud.bid.\n'
              '- MegaKino: bekannte Domainmigration megakino15.com -> megakino16.com.\n'
              '- HD Filme, KinoKing, KinoKiste, KKiste, Movie2k, Movie2k 2, Movie4k, SerienStream, StreamCloud Forum und TopStreamFilm nutzen nun ebenfalls den zentralen Domain-Manager.\n'
              '- Erkannte Domains werden automatisch in den xShip-Einstellungen gespeichert; erfolgreiche Pruefungen werden 6 Stunden, fehlgeschlagene 1 Stunde gecacht.\n'
              '- Die Redirect-Erkennung aus 2026.08.25.12 bleibt erhalten; Vavoo und die zentrale RequestHandler-Erkennung bleiben unveraendert enthalten.\n\n'
          )
          if '<news>2026.08.28.1' not in feed:
              marker = '<news>2026.08.25.12'
              if marker not in feed:
                  raise SystemExit('News insertion marker missing')
              feed = feed.replace(marker, '<news>' + release_news + '2026.08.25.12', 1)

          # Extract the complete feed news so addon.xml and addons.xml are identical.
          m = re.search(r'<news>(.*?)</news>', feed, flags=re.S)
          if not m:
              raise SystemExit('Unable to extract feed news')
          full_news = m.group(1)

          with zipfile.ZipFile(zip_path, 'r') as zin:
              names = zin.namelist()
              addon_name = 'plugin.video.xship/addon.xml'
              if addon_name not in names:
                  raise SystemExit('addon.xml missing from release ZIP')
              addon = zin.read(addon_name).decode('utf-8')
              addon = re.sub(r'^<\?xml\s+version="[^"]+"', '<?xml version="1.0"', addon, count=1)
              addon = re.sub(
                  r'(<addon\s+id="plugin\.video\.xship"\s+version=")[^"]+("\s+name="xShip")',
                  r'\g<1>2026.08.28.1\2', addon, count=1
              )
              addon, count = re.subn(r'<news>.*?</news>', '<news>' + full_news + '</news>', addon, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit('Unable to update addon.xml news')
              ET.fromstring(addon.encode('utf-8'))
              if '<?xml version="1.0"' not in addon[:80]:
                  raise SystemExit('XML declaration was not corrected')
              if 'id="plugin.video.xship" version="2026.08.28.1"' not in addon:
                  raise SystemExit('Wrong addon version after patch')

              tmp = zip_path.with_suffix('.tmp.zip')
              with zipfile.ZipFile(tmp, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as zout:
                  for info in zin.infolist():
                      data = addon.encode('utf-8') if info.filename == addon_name else zin.read(info.filename)
                      zout.writestr(info, data)

          with zipfile.ZipFile(tmp, 'r') as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit('Corrupt rebuilt ZIP member: ' + bad)
              parsed = z.read('plugin.video.xship/addon.xml').decode('utf-8')
              ET.fromstring(parsed.encode('utf-8'))
          tmp.replace(zip_path)

          feed_path.write_text(feed, encoding='utf-8', newline='')
          md5 = hashlib.md5(feed_path.read_bytes()).hexdigest()
          md5_path.write_text(md5 + '\n', encoding='ascii')

          print('ZIP_SHA256=' + hashlib.sha256(zip_path.read_bytes()).hexdigest())
          print('ADDONS_XML_MD5=' + md5)

      - name: Publish xShip 2026.08.28.1
        run: |
          set -euo pipefail
          git config user.name "Barclay"
          git config user.email "107470010+Barclay6969@users.noreply.github.com"
          git add zips/plugin.video.xship/plugin.video.xship-2026.08.28.1.zip zips/addons.xml zips/addons.xml.md5
          git commit -m "Release xShip 2026.08.28.1 domain manager" || exit 0
          git push origin HEAD:main
