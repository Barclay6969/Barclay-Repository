name: Build xShip MeineCloud Series Deferred TEST2

on:
  push:
    branches: [ main ]
    paths:
      - '.test-build/meinecloud-test2.trigger'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build TEST2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil, tempfile, zipfile

          base_zip = Path('test-builds/plugin.video.xship-2026.09.28.105-MEINECLOUD-TOKENAPI-TEST1.zip')
          out_zip = Path('test-builds/plugin.video.xship-2026.09.28.106-MEINECLOUD-SERIES-DEFERRED-TEST2.zip')
          provider_src = "# -*- coding: UTF-8 -*-\n\n# MeineCloud provider\n# Movie4k family database source\n\nfrom resources.lib.utils import isBlockedHosterFast as isBlockedHoster\nfrom scrapers.modules.meinecloud_shared import get_movie_links, get_series_links\nfrom resources.lib.control import getSetting\nfrom resources.lib.domain_manager import resolve_domain\n\nSITE_IDENTIFIER = 'meinecloud'\nSITE_DOMAIN = 'meinecloud.click'\nSITE_NAME = SITE_IDENTIFIER.upper()\n\n\nclass source:\n    def __init__(self):\n        self.priority = getSetting('provider.' + SITE_IDENTIFIER + '.priority', 100)\n        self.language = ['de']\n        self.domain = resolve_domain(SITE_IDENTIFIER, SITE_DOMAIN)\n        self.base_link = 'https://' + self.domain\n        self.sources = []\n\n    def _add_links(self, links, numbered=False, defer_resolve=False):\n        seen = set()\n        index = 0\n        for sUrl in links or []:\n            if not sUrl or sUrl in seen:\n                continue\n            seen.add(sUrl)\n\n            try:\n                if defer_resolve:\n                    isBlocked, hoster, url, prioHoster = isBlockedHoster(sUrl, isResolve=False)\n                else:\n                    isBlocked, hoster, url, prioHoster = isBlockedHoster(sUrl)\n            except TypeError:\n                isBlocked, hoster, url, prioHoster = isBlockedHoster(sUrl)\n\n            if defer_resolve and (isBlocked or not url):\n                try:\n                    from urllib.parse import urlparse\n                    hoster = (urlparse(sUrl).hostname or 'MeineCloud').lower()\n                except Exception:\n                    hoster = 'MeineCloud'\n                url = sUrl\n                prioHoster = 100\n                isBlocked = False\n                try:\n                    import xbmc\n                    xbmc.log('[xShip MEINECLOUD-API] series deferred raw source: %s' % sUrl, xbmc.LOGINFO)\n                except Exception:\n                    pass\n\n            if isBlocked or not url:\n                continue\n\n            index += 1\n            source_name = hoster or 'MeineCloud'\n            if numbered and index > 1:\n                source_name = '%s(%s)' % (source_name, index)\n\n            self.sources.append({\n                'source': source_name,\n                'quality': '1080p',\n                'language': 'de',\n                'url': url,\n                'direct': False if defer_resolve else True,\n                'priority': int(self.priority),\n                'prioHoster': prioHoster\n            })\n\n    def run(self, titles, year, season=0, episode=0, imdb=''):\n        self.sources = []\n        try:\n            if int(season or 0) == 0:\n                self._add_links(get_movie_links(imdb, self.base_link))\n            else:\n                self._add_links(\n                    get_series_links(imdb, int(season), int(episode), self.base_link),\n                    numbered=True,\n                    defer_resolve=True\n                )\n            return self.sources\n        except Exception:\n            return self.sources\n\n    def resolve(self, url):\n        return url\n"

          with tempfile.TemporaryDirectory() as td_raw:
              td = Path(td_raw)
              with zipfile.ZipFile(base_zip, 'r') as zf:
                  zf.extractall(td)
              root = td / 'plugin.video.xship'
              provider = root / 'scrapers/scrapers_source/de/meinecloud.py'
              provider.write_text(provider_src, encoding='utf-8', newline='\n')
              compile(provider.read_text(encoding='utf-8'), str(provider), 'exec')

              addon = root / 'addon.xml'
              addon_text = addon.read_text(encoding='utf-8')
              addon_text, n = re.subn(
                  r'(<addon\b[^>]*\bid="plugin\.video\.xship"[^>]*\bversion=")[^"]+(")',
                  r'\g<1>2026.09.28.106\2',
                  addon_text, count=1, flags=re.I)
              if n != 1:
                  raise SystemExit('Could not update addon version')
              addon.write_text(addon_text, encoding='utf-8', newline='\n')

              for cache in list(root.rglob('__pycache__')):
                  shutil.rmtree(cache, ignore_errors=True)
              for pyc in root.rglob('*.pyc'):
                  pyc.unlink(missing_ok=True)

              out_zip.parent.mkdir(parents=True, exist_ok=True)
              if out_zip.exists():
                  out_zip.unlink()
              with zipfile.ZipFile(out_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
                  for fp in sorted(root.rglob('*')):
                      if fp.is_file():
                          zf.write(fp, fp.relative_to(td).as_posix())

          with zipfile.ZipFile(out_zip, 'r') as zf:
              assert zf.testzip() is None
              addon_text = zf.read('plugin.video.xship/addon.xml').decode('utf-8')
              provider_text = zf.read('plugin.video.xship/scrapers/scrapers_source/de/meinecloud.py').decode('utf-8')
              assert '2026.09.28.106' in addon_text
              assert 'defer_resolve=True' in provider_text
              assert 'series deferred raw source' in provider_text
          print(out_zip)
          PY
          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add test-builds/plugin.video.xship-2026.09.28.106-MEINECLOUD-SERIES-DEFERRED-TEST2.zip
          git commit -m "Build MeineCloud series deferred TEST2"
          git push
