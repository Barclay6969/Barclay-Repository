name: TEMP export xShip 2026.08.25.12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temp-export-xship-2026.08.25.12.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload current release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: xship-2026.08.25.12-base
          path: zips/plugin.video.xship/plugin.video.xship-2026.08.25.12.zip
          if-no-files-found: error
