name: TEMP export xShip 2026.08.25.12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temp-export-xship-2026.08.25.12.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export current release text files
        shell: python
        run: |
          from pathlib import Path
          import shutil, zipfile
          src = Path('zips/plugin.video.xship/plugin.video.xship-2026.08.25.12.zip')
          out = Path('.temp-export2512')
          shutil.rmtree(out, ignore_errors=True)
          wanted = [
              'plugin.video.xship/resources/lib/requestHandler.py',
              'plugin.video.xship/scrapers/scrapers_source/de/bsto.py',
              'plugin.video.xship/scrapers/scrapers_source/de/vavoo.py',
              'plugin.video.xship/service.py',
              'plugin.video.xship/resources/lib/domain_redirect.py',
          ]
          with zipfile.ZipFile(src) as z:
              for name in wanted:
                  dest = out / name.removeprefix('plugin.video.xship/')
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(z.read(name))
      - name: Commit exported text files
        run: |
          set -euo pipefail
          git config user.name "Barclay"
          git config user.email "107470010+Barclay6969@users.noreply.github.com"
          git add .temp-export2512
          git commit -m "TEMP export xShip 2026.08.25.12 text files" || exit 0
          git push origin HEAD:main
