name: Build xShip final 2026.08.25.8
on:
  push:
    paths:
      - '.github/workflows/xship-final-20260825.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build final release ZIP
        shell: bash
        run: |
          set -euo pipefail
          BASE='test-builds/plugin.video.xship-2026.08.25.7-EINSCHALTEN-DOOD-TLS-TEST.zip'
          OUT='test-builds/plugin.video.xship-2026.08.25.8.zip'
          rm -rf /tmp/xship-final
          mkdir -p /tmp/xship-final
          unzip -q "$BASE" -d /tmp/xship-final
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('/tmp/xship-final/plugin.video.xship')
          addon = root / 'addon.xml'
          text = addon.read_text('utf-8')

          # Only bump the add-on version.
          text2, n = re.subn(r'(<addon\b[^>]*\bid="plugin\.video\.xship"[^>]*\bversion=")[^"]+("[^>]*>)', r'\g<1>2026.08.25.8\2', text, count=1, flags=re.S)
          if n != 1:
              # Fallback for version appearing before id in the opening tag.
              text2, n = re.subn(r'(<addon\b[^>]*\bversion=")[^"]+("[^>]*\bid="plugin\.video\.xship"[^>]*>)', r'\g<1>2026.08.25.8\2', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not update xShip version')
          text = text2

          news = '''2026.08.25.8
          - MediaInfo: Ungültige bzw. interne Nicht-HTTP-URLs wie False und vixsrc:// werden nicht mehr abgefragt; betroffene Quellen bleiben für die eigentliche Wiedergabe erhalten.
          - Wiedergabe: Stoppen eines Streams reagiert deutlich schneller und beendet den Player-Loop praktisch sofort.
          - MegaKino: Domain von megakino15.com auf megakino16.com aktualisiert.
          - Einschalten: DoodStream/vide0.net-Fallback für Kodi 21 ergänzt; Cloudflare-bedingte ResolveURL-Ausfälle werden lokal umgangen und Streams wieder gefunden.

          '''
          if '<news>' not in text:
              raise SystemExit('No <news> element found')
          text = text.replace('<news>', '<news>' + news, 1)
          addon.write_text(text, 'utf-8')

          # Guard the two confirmed provider fixes in the final package.
          mk = list(root.rglob('megakino.py'))
          if len(mk) != 1 or "SITE_DOMAIN = 'megakino16.com'" not in mk[0].read_text('utf-8'):
              raise SystemExit('MegaKino16 fix missing')
          ein = list(root.rglob('einschalten.py'))
          if len(ein) != 1 or '[EINSCHALTEN-DOOD]' not in ein[0].read_text('utf-8'):
              raise SystemExit('Einschalten Dood fallback missing')
          mi = list(root.rglob('mediainfo.py'))
          if len(mi) != 1 or '[MEDIAINFO-GUARD]' not in mi[0].read_text('utf-8'):
              raise SystemExit('MediaInfo guard missing')
          pl = list(root.rglob('player.py'))
          if len(pl) != 1 or 'waitForAbort(0.1)' not in pl[0].read_text('utf-8'):
              raise SystemExit('Fast stop fix missing')
          PY
          python3 -m compileall -q /tmp/xship-final/plugin.video.xship
          rm -f "$OUT"
          (cd /tmp/xship-final && zip -qr "$GITHUB_WORKSPACE/$OUT" plugin.video.xship)
          unzip -t "$OUT" >/dev/null
          unzip -p "$OUT" plugin.video.xship/addon.xml | grep -q 'version="2026.08.25.8"'
          unzip -p "$OUT" plugin.video.xship/addon.xml | grep -q 'MegaKino: Domain von megakino15.com auf megakino16.com aktualisiert.'
      - name: Commit final ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-builds/plugin.video.xship-2026.08.25.8.zip
          git commit -m 'Prepare xShip 2026.08.25.8 release ZIP'
          git push
