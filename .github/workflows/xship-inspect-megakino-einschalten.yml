name: Inspect xShip MegaKino and Einschalten

on:
  push:
    paths:
      - '.github/workflows/xship-inspect-megakino-einschalten.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract scraper sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/xshipinspect
          mkdir -p /tmp/xshipinspect
          unzip -q test-builds/plugin.video.xship-2026.08.25.5-FAST-STOP-ONLY-TEST.zip -d /tmp/xshipinspect
          ROOT=/tmp/xshipinspect/plugin.video.xship
          find "$ROOT" -type f \( -iname '*einschalten*' -o -iname '*megakino*' \) -print
          mkdir -p test-builds/_inspect
          for f in $(find "$ROOT" -type f \( -iname '*einschalten*' -o -iname '*megakino*' \)); do
            cp "$f" "test-builds/_inspect/$(basename "$f")"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-builds/_inspect
          git commit -m 'Temporary inspect MegaKino and Einschalten scrapers'
          git push
