name: Extract Huhu endpoint prefix

on:
  push:
    branches: [ main ]
    paths:
      - '.extract-huhu-prefix'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract prefix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, urllib.request, urllib.parse
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return r.read().decode('utf-8','replace')
          home=get('https://www.huhu.to/')
          src=re.search(r'<script[^>]+src=["\']([^"\']*index-[^"\']+\.js)',home,re.I).group(1)
          js=get(urllib.parse.urljoin('https://www.huhu.to/',src))
          out=[js[:22000]]
          for m in re.finditer(r'(?:(?:var|let|const)\s+)?fe\s*=\s*([^,;]{1,300})',js):
              out.append('\nFE_ASSIGN='+m.group(0))
          p=js.find('async function at')
          out.append('\nAT_POS='+str(p))
          if p>=0:
              out.append(js[max(0,p-8000):p+1800])
          Path('test-builds/huhu-prefix-diagnostic.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .extract-huhu-prefix
          git rm -f .github/workflows/extract-huhu-prefix.yml
          git add test-builds/huhu-prefix-diagnostic.txt
          git commit -m "Extract Huhu endpoint prefix"
          git push
