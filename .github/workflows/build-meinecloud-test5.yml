name: Build xShip MeineCloud TV Overview TEST5

on:
  push:
    branches: [ main ]
    paths:
      - '.test-build/meinecloud-test5.trigger'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build TEST5
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/build_meinecloud_test5.py
          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add test-builds/plugin.video.xship-2026.09.28.109-MEINECLOUD-TVOVERVIEW-TEST5.zip
          git commit -m "Build MeineCloud TV overview TEST5"
          git push
