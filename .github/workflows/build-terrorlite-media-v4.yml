name: Build TerrorLite 1.1.26 Media Finish V4 TEST
on:
  push:
    branches: [terrorlite-glossy-logos-test]
    paths:
      - 'tools/build_terrorlite_media_v4.py'
      - '.github/workflows/build-terrorlite-media-v4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated logo test branch
        uses: actions/checkout@v4
        with:
          ref: terrorlite-glossy-logos-test
          fetch-depth: 0
      - name: Install reproducible Pillow graphics
        run: python3 -m pip install --break-system-packages 'pillow==12.3.0'
      - name: Verify and build 1.1.26 deluxe media icons without touching ratings
        run: python3 tools/build_terrorlite_media_v4.py
      - name: Upload Kodi installable test ZIP and contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: TerrorLite-1.1.26-Media-Finish-V4-TEST
          path: |
            test-builds/skin.terror.lite-1.1.26-MEDIA-FINISH-TEST.zip
            development/terrorlite-glossy/v4-media-preview.png
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: Commit ONLY test artifacts to test branch
        run: |
          git config user.name 'Barclay test bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test-builds/skin.terror.lite-1.1.26-MEDIA-FINISH-TEST.zip development/terrorlite-glossy/v4-media-preview.png development/terrorlite-glossy/v4-build-report.txt
          git commit -m 'Build TerrorLite media polish V4 test only [skip ci]' || exit 0
          git push origin HEAD:terrorlite-glossy-logos-test
