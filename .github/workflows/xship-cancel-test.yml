name: Build xShip fast cancel test

on:
  push:
    paths:
      - '.github/workflows/xship-cancel-test.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build test ZIP
        shell: bash
        run: |
          set -euo pipefail
          BASE='test-builds/plugin.video.xship-2026.08.25.1-MEDIAINFO-GUARD-TEST.zip'
          OUT='test-builds/plugin.video.xship-2026.08.25.2-CANCEL-TEST.zip'
          rm -rf /tmp/xship-cancel && mkdir -p /tmp/xship-cancel
          unzip -q "$BASE" -d /tmp/xship-cancel
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('/tmp/xship-cancel/plugin.video.xship')
          p = root / 'resources/lib/sources.py'
          s = p.read_text(encoding='utf-8')

          def rep(old, new, label):
              global s
              if old not in s:
                  raise SystemExit('missing anchor: ' + label)
              s = s.replace(old, new, 1)

          rep("        self.url = None\n", "        self.url = None\n        self._user_cancelled = False\n", 'init')
          rep(
              "            items = self.getSources(title, year, imdb, season, episode, originaltitle, premiered)\n            select = control.getSetting('hosts.mode') if select == None else select\n",
              "            items = self.getSources(title, year, imdb, season, episode, originaltitle, premiered)\n            if getattr(self, '_user_cancelled', False):\n                log_utils.log('[FAST-CANCEL] Abbruch aus play() uebernommen', log_utils.LOGINFO)\n                return\n            select = control.getSetting('hosts.mode') if select == None else select\n",
              'play')

          a = s.index('    def getSources(')
          b = s.index('\n    def _acceptsHostDict', a)
          block = s[a:b]
          block = block.replace(
              "                try:\n                    if progressDialog.iscanceled(): break\n                except:\n                    pass\n",
              "                try:\n                    if progressDialog.iscanceled():\n                        self._user_cancelled = True\n                        log_utils.log('[FAST-CANCEL] Quellensuche durch Benutzer abgebrochen', log_utils.LOGINFO)\n                        for _future in futures:\n                            _future.cancel()\n                        break\n                except:\n                    pass\n", 1)
          old = "        try: progressDialog.close()\n        except: pass\n        self.sourcesFilter()\n        return self.sources\n"
          new = "        try: progressDialog.close()\n        except: pass\n        if getattr(self, '_user_cancelled', False):\n            try:\n                self.executor.shutdown(wait=False, cancel_futures=True)\n            except TypeError:\n                self.executor.shutdown(wait=False)\n            except Exception:\n                pass\n            self.sources = []\n            return []\n        self.sourcesFilter()\n        if getattr(self, '_user_cancelled', False):\n            self.sources = []\n            return []\n        return self.sources\n"
          if old not in block: raise SystemExit('missing anchor: post search')
          block = block.replace(old, new, 1)
          s = s[:a] + block + s[b:]

          a = s.index('    def _getSource(')
          b = s.index('\n\n    def sourcesFilter', a)
          block = s[a:b]
          block = block.replace("        try:\n            try:\n                call.mediatype = getattr(self, 'mediatype', None)\n",
                                "        try:\n            if getattr(self, '_user_cancelled', False):\n                return\n            try:\n                call.mediatype = getattr(self, 'mediatype', None)\n", 1)
          block = block.replace("            if sources == None or sources == []: raise Exception()\n            sources = [json.loads(t) for t in set(json.dumps(d, sort_keys=True) for d in sources)]\n",
                                "            if sources == None or sources == []: raise Exception()\n            if getattr(self, '_user_cancelled', False):\n                return\n            sources = [json.loads(t) for t in set(json.dumps(d, sort_keys=True) for d in sources)]\n", 1)
          s = s[:a] + block + s[b:]

          rep(
              "        # Button Cancel deaktivieren\n        from xbmc import sleep\n        from xbmcgui import Window\n        WINDOW_PROGRESS = Window(10101)\n        sleep(100)\n        CANCEL_BUTTON = WINDOW_PROGRESS.getControl(10)\n        CANCEL_BUTTON.setEnabled(False)\n        progressDialog.update(100, \"Streams - Mediadaten werden ermittelt\")\n",
              "        # FAST-CANCEL: Abbrechen bleibt auch waehrend MediaInfo aktiv.\n        from xbmc import sleep\n        from xbmcgui import Window\n        CANCEL_BUTTON = None\n        try:\n            WINDOW_PROGRESS = Window(10101)\n            sleep(100)\n            CANCEL_BUTTON = WINDOW_PROGRESS.getControl(10)\n            CANCEL_BUTTON.setEnabled(True)\n        except Exception:\n            pass\n        progressDialog.update(100, \"Streams - Mediadaten werden ermittelt\")\n",
              'cancel button')
          rep(
              "        while True:\n            count = len([1 for future in futures if not future.done()])\n            x = int(100*count/count_max)\n            progressDialog.update(x, \"Streams - Mediadaten werden ermittelt\")\n            if count == 0:\n                break\n            else:\n                sleep(200)\n\n        progressDialog.close()\n        CANCEL_BUTTON.setEnabled(True)\n        control.busy()\n\n        self.sources = self.sources_new\n",
              "        while True:\n            try:\n                if progressDialog.iscanceled():\n                    self._user_cancelled = True\n                    log_utils.log('[FAST-CANCEL] MediaInfo-Ermittlung durch Benutzer abgebrochen', log_utils.LOGINFO)\n                    for _future in futures:\n                        _future.cancel()\n                    break\n            except Exception:\n                pass\n            count = len([1 for future in futures if not future.done()])\n            x = int(100*count/count_max)\n            progressDialog.update(x, \"Streams - Mediadaten werden ermittelt\")\n            if count == 0:\n                break\n            sleep(100)\n\n        progressDialog.close()\n        try:\n            if CANCEL_BUTTON is not None:\n                CANCEL_BUTTON.setEnabled(True)\n        except Exception:\n            pass\n        if getattr(self, '_user_cancelled', False):\n            try:\n                self.executor.shutdown(wait=False, cancel_futures=True)\n            except TypeError:\n                self.executor.shutdown(wait=False)\n            except Exception:\n                pass\n            self.sources_new = []\n            self.sources = []\n            return\n        control.busy()\n\n        self.sources = self.sources_new\n",
              'media loop')
          rep(
              "        class _NullDialog:\n            def update(self, *a, **kw): pass\n            def iscanceled(self): return False\n            def close(self): pass\n",
              "        owner = self\n        class _NullDialog:\n            def update(self, *a, **kw): pass\n            def iscanceled(self): return getattr(owner, '_user_cancelled', False)\n            def close(self): pass\n",
              'cancel aware dialog')
          rep(
              "        source.update({'info': info, '_probe': probe})\n        self.sources_new.append(source)\n",
              "        if getattr(self, '_user_cancelled', False):\n            return\n        source.update({'info': info, '_probe': probe})\n        self.sources_new.append(source)\n",
              'late result')

          p.write_text(s, encoding='utf-8')
          addon = root / 'addon.xml'
          x = addon.read_text(encoding='utf-8')
          x2, n = re.subn(r'(<addon\b[^>]*?\bversion=")[^"]+("[^>]*>)', r'\g<1>2026.08.25.2\2', x, count=1, flags=re.S)
          if n != 1: raise SystemExit('version update failed')
          addon.write_text(x2, encoding='utf-8')

          whole = p.read_text(encoding='utf-8') + (root/'resources/lib/mediainfo.py').read_text(encoding='utf-8')
          for m in ('[MEDIAINFO-GUARD]', '[FAST-CANCEL] Quellensuche', '[FAST-CANCEL] MediaInfo-Ermittlung'):
              if m not in whole: raise SystemExit('missing marker ' + m)
          PY
          python3 -m compileall -q /tmp/xship-cancel/plugin.video.xship
          rm -f "$OUT"
          (cd /tmp/xship-cancel && zip -qr "$GITHUB_WORKSPACE/$OUT" plugin.video.xship)
          unzip -t "$OUT" >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT"
          git commit -m 'Add xShip 2026.08.25.2 fast cancel test'
          git push
