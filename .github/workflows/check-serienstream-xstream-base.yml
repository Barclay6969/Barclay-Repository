name: Check xStream base for SerienStream

on:
  push:
    branches: [main]
    paths:
      - '.serienstream-build/CHECKX'

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare xStream candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/xs /tmp/xs.zip
          curl -fL --retry 3 -o /tmp/xs.zip "https://github.com/Bitte-ein-Git/kodi-repo/archive/18ecbb438b43525334f8c51f5055f3687b9401e7.zip"
          unzip -q /tmp/xs.zip -d /tmp/xs
          BASE=$(find /tmp/xs -type d -path '*/repo/plugin.video.xstream' | head -1)
          python3 - "$BASE" <<'PY'
          from pathlib import Path
          import hashlib, sys
          base=Path(sys.argv[1])
          mf=Path('.serienstream-build/base-manifest.sha256')
          ok=bad=miss=0
          for line in mf.read_text().splitlines():
              h,p=line.split('  ',1)
              q=base/p
              if not q.exists() and p=='serienstream_main.py':
                  q=base/'xstream.py'
              if not q.exists():
                  print('MISSING ',p); miss+=1; continue
              got=hashlib.sha256(q.read_bytes()).hexdigest()
              if got==h:
                  print('MATCH   ',p); ok+=1
              else:
                  print('MISMATCH',p); bad+=1
          print(f'SUMMARY matches={ok} mismatches={bad} missing={miss}')
          PY
