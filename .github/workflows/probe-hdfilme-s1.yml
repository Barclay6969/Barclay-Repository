name: Probe HDFilme Staffel1

on:
  push:
    branches: [ main ]
    paths:
      - '.probe-hdfilme-s1'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, urllib.request, urllib.parse
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
          q=urllib.parse.quote('Reacher Staffel 1')
          url='https://hd-filme.lol/index.php?do=search&subaction=search&search_start=1&full_search=0&result_from=1&titleonly=3&story='+q
          req=urllib.request.Request(url,headers={'User-Agent':ua})
          with urllib.request.urlopen(req,timeout=20) as r:
              html=r.read().decode('utf-8','replace')
              final=r.geturl()
          out=[f'FINAL={final}',f'LEN={len(html)}']
          for needle in ['Reacher - Staffel 1','Reacher','Staffel 1']:
              p=html.lower().find(needle.lower())
              out.append(f'{needle} POS={p}')
              if p>=0:
                  out.append(re.sub(r'\s+',' ',html[max(0,p-1200):p+4000])[:5200])
          Path('test-builds/hdfilme-s1-probe.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .probe-hdfilme-s1
          git rm -f .github/workflows/probe-hdfilme-s1.yml
          git add test-builds/hdfilme-s1-probe.txt
          git commit -m "Probe HDFilme Reacher Staffel1 search"
          git push
