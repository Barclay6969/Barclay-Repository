name: Publish xShip MediathekViewWeb fallback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-xship-mvw.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build verified GEZ-KiNO release
        run: python3 tools/publish_xship_mvw.py
      - name: Update repository catalogue
        run: python3 tools/make_repo.py
      - name: Validate catalogue
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,xml.etree.ElementTree as ET
          data=Path('zips/addons.xml').read_bytes()
          assert hashlib.md5(data).hexdigest()==Path('zips/addons.xml.md5').read_text().strip()
          assert next(x for x in ET.fromstring(data) if x.get('id')=='plugin.video.xship').get('version')=='2026.10.20.164'
          PY
      - name: Publish release
        run: |
          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add zips/plugin.video.xship/plugin.video.xship-2026.10.20.164.zip zips/plugin.video.xship/changelog.txt zips/addons.xml zips/addons.xml.md5 zips/repository.barclay
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Release xShip 2026.10.20.164: MediathekViewWeb fallback and short changelog"
          git push
