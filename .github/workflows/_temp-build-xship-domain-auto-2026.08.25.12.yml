name: TEMP build xShip 2026.08.25.12 Domain Auto

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temp-build-xship-domain-auto-2026.08.25.12.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xship-domain-auto-2026-08-25
      - name: Fix builder quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/build_xship_domain_auto_2026_08_25_12.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("    '''Resolve a provider root-domain redirect and persist the final hostname.''';", "    \"Resolve a provider root-domain redirect and persist the final hostname.\";")
          s = s.replace("    '''Resolve a provider root-domain redirect and persist the final hostname.'''", "    \"Resolve a provider root-domain redirect and persist the final hostname.\"")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Build candidate
        run: python tools/build_xship_domain_auto_2026_08_25_12.py
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: xship-2026.08.25.12-domain-auto
          path: |
            test-output/plugin.video.xship-2026.08.25.12.zip
            test-output/DOMAIN-AUTO-MANIFEST.txt
          if-no-files-found: error
          retention-days: 2
