name: Build xShip 2026.08.17

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-xship-2026.08.17.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build xShip 2026.08.17
        shell: bash
        run: |
          set -euo pipefail
          BASE='zips/plugin.video.xship/plugin.video.xship-2026.08.16.zip'
          OUT='zips/plugin.video.xship/plugin.video.xship-2026.08.17.zip'
          WORK="$RUNNER_TEMP/xship0817"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          unzip -q "$BASE" -d "$WORK"
          ROOT="$WORK/plugin.video.xship"
          export ROOT

          echo '' | base64 -d | gzip -d > "$ROOT/service.py"

          python - <<'PY2'
          from pathlib import Path
          import os
          p = Path(os.environ['ROOT']) / 'addon.xml'
          s = p.read_text(encoding='utf-8')
          s = s.replace('version="2026.08.16"', 'version="2026.08.17"', 1)
          p.write_text(s, encoding='utf-8')
          PY2

          rm -f "$OUT"
          (cd "$WORK" && zip -qr "$GITHUB_WORKSPACE/$OUT" plugin.video.xship)

          python - <<'PY2'
          from pathlib import Path
          p = Path('zips/addons.xml')
          s = p.read_text(encoding='utf-8')
          old = '<addon id="plugin.video.xship" version="2026.08.16"'
          new = '<addon id="plugin.video.xship" version="2026.08.17"'
          if old not in s:
              raise SystemExit('xShip 2026.08.16 entry not found in addons.xml')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY2

          md5sum zips/addons.xml | awk '{print $1}' > zips/addons.xml.md5

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT" zips/addons.xml zips/addons.xml.md5
          git commit -m 'Release xShip 2026.08.17 bidirectional provider domain sync'
          git push
