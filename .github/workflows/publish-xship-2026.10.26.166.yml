name: Publish verified xShip 2026.10.26.166
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-xship-2026.10.26.166.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package verified MegaKino fixes
        shell: bash
        run: |
          python3 - <<'PY'
          import ast,base64,json,zlib,zipfile,re,hashlib,xml.etree.ElementTree as ET
          from pathlib import Path
          d=Path('zips/plugin.video.xship')
          out=d/'plugin.video.xship-2026.10.26.166.zip'
          assert not out.exists(), 'Release already exists'
          with zipfile.ZipFile(d/'plugin.video.xship-2026.10.20.164.zip') as z:
              entries={n:z.read(n) for n in z.namelist() if not n.endswith('/')}
          changes=json.loads(zlib.decompress(base64.b64decode('')))
          for n,s in changes.items():
              if n.endswith('.py'): ast.parse(s)
              if n.endswith('.xml'): ET.fromstring(s)
              entries[n]=s.encode()
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for n,b in entries.items(): z.writestr(n,b)
          (d/'changelog.txt').write_bytes(entries['plugin.video.xship/changelog.txt'])
          p=Path('zips/addons.xml');s=p.read_text()
          entry=re.sub(r'<\?xml[^?]*\?>\s*','',changes['plugin.video.xship/addon.xml'])
          s,n=re.subn(r'<addon\b[^>]*\bid="plugin\.video\.xship"[\s\S]*?</addon>',lambda m:entry,s)
          assert n==1
          assert next(x for x in ET.fromstring(s) if x.get('id')=='plugin.video.xship').get('version')=='2026.10.26.166'
          p.write_text(s)
          Path('zips/addons.xml.md5').write_text(hashlib.md5(p.read_bytes()).hexdigest())
          PY
      - name: Publish ZIP and update catalogue
        run: |
          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add zips/plugin.video.xship/plugin.video.xship-2026.10.26.166.zip zips/plugin.video.xship/changelog.txt zips/addons.xml zips/addons.xml.md5
          git commit -m "Release xShip 2026.10.26.166: verified MegaKino playback and domain fixes"
          git push origin main
