name: Temp KinoKing debug
on:
  push:
    paths:
      - '.github/workflows/temp-kinoking-debug.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract scraper and probe KinoKing
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/xship-kk
          mkdir -p /tmp/xship-kk
          unzip -q zips/plugin.video.xship/plugin.video.xship-2026.08.25.8.zip -d /tmp/xship-kk
          KK=$(find /tmp/xship-kk -type f -iname 'kinoking.py' | head -1)
          test -n "$KK"
          cp "$KK" test-builds/_debug_kinoking.py
          python3 - <<'PY'
          import requests
          from pathlib import Path
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151.0.0.0 Safari/537.36'
          s=requests.Session()
          for name,url in [
              ('search','https://kinoking.cc/index.php?search=the+last+house'),
              ('movie','https://kinoking.cc/movie.php?id=63514')]:
              r=s.get(url,headers={'User-Agent':ua},timeout=20)
              print(name,r.status_code,r.url,len(r.text))
              Path(f'test-builds/_debug_kinoking_{name}.html').write_text(r.text,'utf-8')
          PY
      - name: Commit debug snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-builds/_debug_kinoking.py test-builds/_debug_kinoking_search.html test-builds/_debug_kinoking_movie.html
          git commit -m 'Temporary KinoKing debug snapshots'
          git push
