name: Inspect xShip MeineCloud TEST1

on:
  push:
    branches: [ main ]
    paths:
      - '.test-build/inspect-meinecloud.trigger'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract MeineCloud files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, tempfile

          zpath = Path('test-builds/plugin.video.xship-2026.09.28.105-MEINECLOUD-TOKENAPI-TEST1.zip')
          out = Path('test-builds/diagnostics')
          out.mkdir(parents=True, exist_ok=True)

          with tempfile.TemporaryDirectory() as td:
              td = Path(td)
              with zipfile.ZipFile(zpath) as zf:
                  zf.extractall(td)
              root = td / 'plugin.video.xship'
              hits = []
              for p in root.rglob('*.py'):
                  txt = p.read_text(encoding='utf-8', errors='ignore')
                  if 'get_series_links' in txt or 'MEINECLOUD-API' in txt or ('meinecloud' in p.name.lower()):
                      hits.append((p, txt))
              for i,(p,txt) in enumerate(hits,1):
                  target = out / ('meinecloud-test1-%02d-%s.txt' % (i, p.name))
                  target.write_text('PATH: %s\n\n%s' % (p.relative_to(root), txt), encoding='utf-8')
                  print(target, p.relative_to(root))
          PY
          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add test-builds/diagnostics/meinecloud-test1-*.txt
          git commit -m "Inspect MeineCloud TEST1 provider"
          git push
