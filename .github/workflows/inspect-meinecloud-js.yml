name: Inspect MeineCloud player JS

on:
  push:
    branches: [ main ]
    paths:
      - '.inspect-meinecloud-js'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect player scripts and movie mirrors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, urllib.request, urllib.parse

          headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
            'Referer':'https://meinecloud.click/'
          }
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r:
                  return r.status,r.geturl(),r.read().decode('utf-8','replace')

          out=[]
          for label,url in [
              ('SERIAL_REACHER','https://meinecloud.click/serial/9288030'),
              ('MOVIE_AQUAMAN','https://meinecloud.click/movie/tt1477834'),
              ('MOVIE_SCAN','https://meinecloud.click/movie/tt8790086'),
          ]:
              try:
                  status,final,html=get(url)
              except Exception as e:
                  out += [f'=== {label} ===',f'ERROR={e}','']
                  continue
              out += [f'=== {label} ===',f'STATUS={status}',f'FINAL={final}',f'LENGTH={len(html)}']
              tags=re.findall(r'<[^>]+data-link[^>]*>',html,flags=re.I|re.S)
              out.append(f'DATA_LINK_TAGS={len(tags)}')
              for tag in tags[:20]:
                  out.append(re.sub(r'\s+',' ',tag)[:1000])
              out.append('--- JS lines of interest ---')
              scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,flags=re.I|re.S)
              js='\n'.join(scripts)
              for line in js.splitlines():
                  if re.search(r'fetch|ajax|mirror|data-link|player|episode|season|api|\.php',line,re.I):
                      compact=re.sub(r'\s+',' ',line).strip()
                      if compact:
                          out.append(compact[:1800])
              out.append('')
          Path('test-builds/meinecloud-player-diagnostic.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .inspect-meinecloud-js
          git rm -f .github/workflows/inspect-meinecloud-js.yml
          git add test-builds/meinecloud-player-diagnostic.txt
          git commit -m "Inspect MeineCloud player and mirrors"
          git push
