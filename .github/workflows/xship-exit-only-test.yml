name: Build xShip exit-only local test

on:
  push:
    paths:
      - '.github/workflows/xship-exit-only-test.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build from exact 25.1 MediaInfo Guard base
        shell: bash
        run: |
          set -euo pipefail
          BASE='test-builds/plugin.video.xship-2026.08.25.1-MEDIAINFO-GUARD-TEST.zip'
          OUT='test-builds/plugin.video.xship-2026.08.25.4-EXIT-ONLY-TEST.zip'
          rm -rf /tmp/xship-exit-only /tmp/xship-exit-base
          mkdir -p /tmp/xship-exit-only /tmp/xship-exit-base
          unzip -q "$BASE" -d /tmp/xship-exit-only
          unzip -q "$BASE" -d /tmp/xship-exit-base

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('/tmp/xship-exit-only/plugin.video.xship')
          sp = root / 'resources/lib/sources.py'
          pp = root / 'resources/lib/player.py'

          s = sp.read_text(encoding='utf-8')
          p = pp.read_text(encoding='utf-8')

          # 1) Finished source list: closing/back must only release executor resources.
          #    Search and MediaInfo behavior stay untouched.
          old = """                elif select == '0' or select == '1':\n                    url = self.sourcesDialog(items)\n                    if  url == 'close://': return\n"""
          new = """                elif select == '0' or select == '1':\n                    url = self.sourcesDialog(items)\n                    if url == 'close://':\n                        log_utils.log('[EXIT-ONLY] Quellenliste geschlossen - xShip beendet', log_utils.LOGINFO)\n                        try:\n                            self.executor.shutdown(wait=False, cancel_futures=True)\n                        except TypeError:\n                            self.executor.shutdown(wait=False)\n                        except Exception:\n                            pass\n                        return\n"""
          if old not in s:
              raise SystemExit('PATCH ANCHOR NOT FOUND: source-list close')
          s = s.replace(old, new, 1)

          # 2) When playback returns (stop/end/error), release this sources instance's executor.
          old = """            player().run(title, url, meta)\n        except Exception as e:\n"""
          new = """            player().run(title, url, meta)\n            log_utils.log('[EXIT-ONLY] Player beendet - xShip Ressourcen werden freigegeben', log_utils.LOGINFO)\n            try:\n                self.executor.shutdown(wait=False, cancel_futures=True)\n            except TypeError:\n                self.executor.shutdown(wait=False)\n            except Exception:\n                pass\n        except Exception as e:\n"""
          if old not in s:
              raise SystemExit('PATCH ANCHOR NOT FOUND: player return cleanup')
          s = s.replace(old, new, 1)
          sp.write_text(s, encoding='utf-8')

          # 3) Playback loop checks streamFinished every 100 ms instead of up to 3 s.
          #    No playback/resolver/source behavior is changed.
          old = """            monitor.waitForAbort(3)\n"""
          new = """            # EXIT-ONLY: react to Stop/Back almost immediately.\n            monitor.waitForAbort(0.1)\n"""
          if p.count(old) != 1:
              raise SystemExit('Expected exactly one playback monitor waitForAbort(3)')
          p = p.replace(old, new, 1)
          pp.write_text(p, encoding='utf-8')

          addon = root / 'addon.xml'
          a = addon.read_text(encoding='utf-8')
          a2, n = re.subn(r'(<addon\b[^>]*?\bversion=")[^"]+("[^>]*>)', r'\g<1>2026.08.25.4\2', a, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not update addon version')
          addon.write_text(a2, encoding='utf-8')

          # Guard must still exist exactly as inherited from 25.1.
          mi = (root / 'resources/lib/mediainfo.py').read_text(encoding='utf-8')
          if '[MEDIAINFO-GUARD]' not in mi:
              raise SystemExit('25.1 MediaInfo guard missing')
          if '[EXIT-ONLY] Quellenliste geschlossen' not in s or '[EXIT-ONLY] Player beendet' not in s:
              raise SystemExit('Exit markers missing')
          if 'monitor.waitForAbort(0.1)' not in p:
              raise SystemExit('Fast playback-exit poll missing')
          PY

          # Prove that only sources.py, player.py and addon.xml differ from exact 25.1 base.
          set +e
          DIFFS=$(diff -qr /tmp/xship-exit-base/plugin.video.xship /tmp/xship-exit-only/plugin.video.xship | sed -n 's#^Files .*plugin.video.xship/\(.*\) and .* differ$#\1#p' | sort)
          set -e
          printf 'Changed files:\n%s\n' "$DIFFS"
          EXPECTED=$(printf 'addon.xml\nresources/lib/player.py\nresources/lib/sources.py')
          if [ "$DIFFS" != "$EXPECTED" ]; then
            echo 'Unexpected changed files; refusing build.'
            exit 1
          fi

          python3 -m compileall -q /tmp/xship-exit-only/plugin.video.xship
          rm -f "$OUT"
          (cd /tmp/xship-exit-only && zip -qr "$GITHUB_WORKSPACE/$OUT" plugin.video.xship)
          unzip -t "$OUT" >/dev/null
          unzip -p "$OUT" plugin.video.xship/addon.xml | grep -q 'version="2026.08.25.4"'

      - name: Commit local test ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-builds/plugin.video.xship-2026.08.25.4-EXIT-ONLY-TEST.zip
          git commit -m 'Add xShip 25.1-based exit-only local test'
          git push
