name: Inspect current xShip providers

on:
  push:
    branches: [ main ]
    paths:
      - '.inspect-xship-providers'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract provider sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/provider-inspect
          mkdir -p tools/provider-inspect
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          zpath=Path('zips/plugin.video.xship/plugin.video.xship-2026.09.18.98.zip')
          out=Path('tools/provider-inspect')
          wanted={
            'plugin.video.xship/scrapers/scrapers_source/de/kinokiste.py':'kinokiste.py',
            'plugin.video.xship/scrapers/scrapers_source/de/meinecloud.py':'meinecloud.py',
            'plugin.video.xship/scrapers/modules/meinecloud_shared.py':'meinecloud_shared.py',
          }
          with zipfile.ZipFile(zpath) as z:
              names=set(z.namelist())
              for src,dst in wanted.items():
                  if src not in names:
                      raise SystemExit(f'Missing {src}')
                  (out/dst).write_bytes(z.read(src))
          PY
      - name: Commit inspection files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .inspect-xship-providers
          git add tools/provider-inspect
          git commit -m "Extract current xShip provider sources for inspection"
          git push
