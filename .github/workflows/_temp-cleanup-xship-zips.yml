name: TEMP cleanup xShip ZIPs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temp-cleanup-xship-zips.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove obsolete xShip ZIPs
        shell: python
        run: |
          from pathlib import Path

          release_dir = Path('zips/plugin.video.xship')
          test_dir = Path('test-builds')
          keep = {
              'plugin.video.xship-2026.08.20.1.zip',
              'plugin.video.xship-2026.08.21.10.zip',
              'plugin.video.xship-2026.08.25.11.zip',
              'plugin.video.xship-2026.08.25.12.zip',
              'plugin.video.xship-2026.08.28.1.zip',
          }

          removed_release = []
          for fp in sorted(release_dir.glob('plugin.video.xship-*.zip')):
              if fp.name not in keep:
                  removed_release.append(fp.name)
                  fp.unlink()

          removed_tests = []
          if test_dir.exists():
              for fp in sorted(test_dir.glob('*.zip')):
                  removed_tests.append(fp.name)
                  fp.unlink()

          # Remove temporary trigger files created while verifying the cleanup.
          Path('.cleanup-trigger').unlink(missing_ok=True)
          for fp in Path('.github/workflows').glob('_temp-cleanup-xship-zips-trigger*.txt'):
              fp.unlink()

          remaining = sorted(fp.name for fp in release_dir.glob('plugin.video.xship-*.zip'))
          if set(remaining) != keep:
              raise SystemExit('Unexpected remaining release ZIPs: %r' % remaining)

          print('REMOVED_RELEASE=%d' % len(removed_release))
          print('REMOVED_TESTS=%d' % len(removed_tests))
          print('KEPT=%s' % ', '.join(remaining))

      - name: Publish cleanup
        run: |
          set -euo pipefail
          git config user.name "Barclay"
          git config user.email "107470010+Barclay6969@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to clean"
            exit 0
          fi
          git commit -m "Cleanup obsolete xShip ZIP builds"
          git pull --rebase origin main
          git push origin HEAD:main
