name: Publish SerienStream 1.0.12

on:
  push:
    paths:
      - '.github/workflows/publish-serienstream-112.yml'
      - 'assets/serienstream_icon_96.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build SerienStream 1.0.12
        shell: bash
        run: |
          set -euo pipefail
          BASE='zips/plugin.video.serienstream/plugin.video.serienstream-1.0.10.zip'
          OUT='zips/plugin.video.serienstream/plugin.video.serienstream-1.0.12.zip'
          WORK="$RUNNER_TEMP/serienstream112"

          rm -rf "$WORK"
          mkdir -p "$WORK"
          unzip -q "$BASE" -d "$WORK"

          ROOT="$(find "$WORK" -type f -name addon.xml -printf '%h\n' | head -n1)"
          export ROOT OUT

          python3 - <<'PY'
          from pathlib import Path
          import os, re, shutil, zipfile

          root = Path(os.environ['ROOT'])
          out = Path(os.environ['OUT'])
          addon = root / 'addon.xml'
          text = addon.read_text(encoding='utf-8-sig')

          text, n = re.subn(
              r'(<addon\s+id="plugin\.video\.serienstream"\s+name="SerienStream"\s+version=")[^"]+(")',
              r'\g<1>1.0.12\2', text, count=1)
          if n != 1:
              raise SystemExit('Could not update version')

          text, n = re.subn(
              r'provider-name="[^"]*"',
              'provider-name="Barclay (Kusi)"', text, count=1)
          if n != 1:
              raise SystemExit('Could not update provider')

          text, n = re.subn(
              r'<icon>resources/[^<]+</icon>',
              '<icon>resources/icon.png</icon>', text, count=1)
          if n != 1:
              raise SystemExit('Could not restore standard icon path')

          addon.write_text(text, encoding='utf-8', newline='\n')

          src_icon = Path('assets/serienstream_icon_96.png')
          dst_icon = root / 'resources' / 'icon.png'
          dst_icon.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(src_icon, dst_icon)

          # Also publish the artwork as a standalone repository asset. Kodi repository
          # views may request the icon through datadir before the ZIP is installed.
          repo_icon = Path('zips/plugin.video.serienstream/resources/icon.png')
          repo_icon.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(src_icon, repo_icon)

          out.parent.mkdir(parents=True, exist_ok=True)
          if out.exists():
              out.unlink()
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as zf:
              for f in sorted(root.rglob('*')):
                  if f.is_file():
                      zf.write(f, Path('plugin.video.serienstream') / f.relative_to(root))

          with zipfile.ZipFile(out, 'r') as zf:
              addon_text = zf.read('plugin.video.serienstream/addon.xml').decode('utf-8')
              icon_data = zf.read('plugin.video.serienstream/resources/icon.png')

          assert 'version="1.0.12"' in addon_text
          assert 'provider-name="Barclay (Kusi)"' in addon_text
          assert '<icon>resources/icon.png</icon>' in addon_text
          assert icon_data == src_icon.read_bytes()
          assert repo_icon.read_bytes() == src_icon.read_bytes()
          print('Built', out, 'icon bytes=', len(icon_data))
          PY

      - name: Rebuild repository metadata
        run: python3 tools/make_repo.py

      - name: Verify repository feed
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<addon id="plugin.video.serienstream" name="SerienStream" version="1.0.12" provider-name="Barclay (Kusi)"' zips/addons.xml
          grep -q '<icon>resources/icon.png</icon>' zips/addons.xml
          test -s zips/addons.xml.md5
          test -s zips/plugin.video.serienstream/plugin.video.serienstream-1.0.12.zip
          test -s zips/plugin.video.serienstream/resources/icon.png

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Barclay Repo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add             zips/plugin.video.serienstream/plugin.video.serienstream-1.0.12.zip             zips/plugin.video.serienstream/resources/icon.png             zips/addons.xml             zips/addons.xml.md5             zips/repository.barclay
          git commit -m "Release SerienStream 1.0.12 with fixed icon" || exit 0
          git push

