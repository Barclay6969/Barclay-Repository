name: Trigger xShip 2026.08.21.3 release

on:
  push:
    branches: [main]
    paths:
      - '.release-xship-2026.08.21.3'

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verified release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-xship-2026.08.21.3-verified.yml --repo "$GITHUB_REPOSITORY" --ref main
